name: Replace malformed mobilization digest 274

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/replace_mobilization_digest_274.yml"

jobs:
  replace:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests==2.32.3
      - name: Delete bad digest and publish corrected digest
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: python src/replace_mobilization_digest_274.py
