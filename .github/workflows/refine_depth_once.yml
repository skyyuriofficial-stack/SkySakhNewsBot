name: Refine evidence contract on repair branch
on:
  push:
    branches: [fix/digest-evidence-depth-20261102]
    paths:
      - 'tools/refine_digest_depth_once.py'
      - '.github/workflows/refine_depth_once.yml'
permissions:
  contents: write
concurrency:
  group: refine-depth-repair-branch
  cancel-in-progress: false
jobs:
  refine:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      IMAGE_REQUIRED: '1'
      AI_CALL_BUDGET: '0'
      EDITORIAL_AUDIT_AI_BUDGET: '0'
      NEWS_DIRECTOR_AI_BUDGET: '0'
      POST_AUDIT_AUTOCORRECT: '0'
      DIGEST_DRY_RUN: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/digest-evidence-depth-20261102
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python tools/refine_digest_depth_once.py
      - run: python src/mobilization_depth_selftest.py
      - run: python src/production_selftest.py
      - name: Commit only tested source files
        run: |
          git diff --check
          git config user.name skysakhnews-bot
          git config user.email actions@github.com
          git add src/editorial_policy.py src/mobilization_depth.py src/mobilization_depth_selftest.py
          if ! git diff --cached --quiet; then
            git commit -m "Close evidence bypasses and inflected Sber promotional coverage"
            git push origin HEAD:fix/digest-evidence-depth-20261102
          fi
