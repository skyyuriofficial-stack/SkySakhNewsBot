# one-shot live verification trigger 2026-08-19 v9.7
name: SkySakhNews v9.7 One Shot Verification

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/run_v96_once.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: skysakhnews-production-publisher
  cancel-in-progress: false

jobs:
  verify-live:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile and regression gate
        env:
          IMAGE_REQUIRED: "0"
          AI_CALL_BUDGET: "8"
        run: |
          python -m py_compile src/news_bot_v8.py src/news_bot_v9.py src/production.py
          python - <<'PY'
          import sys
          sys.path.insert(0, "src")
          import production as prod
          core = prod.core
          assert prod.VERSION == "stable-v9.7"
          assert core.VERSION == "stable-v9.7"
          assert prod.AI_CALL_BUDGET == 8
          assert prod.classify_v97(
              "ru", 78,
              "Трамп рассматривает отсрочку введения пошлин в 50% в отношении Канады",
              "Президент США рассматривает отсрочку пошлин в отношении Канады.",
              "",
              "https://www.interfax.ru/world/1110016",
          )[0] not in {"ru_eco", "ru_pol", "ru_security"}
          fallback = prod._extractive_fallback({
              "category_key": "sakh",
              "footer": "САХАЛИН",
              "title": "В Южно-Сахалинске восстановили движение после дорожной аварии",
              "source_text": (
                  "Движение на участке городской улицы восстановили после завершения аварийных работ. "
                  "Специалисты убрали поврежденный автомобиль и освободили проезжую часть для транспорта. "
                  "Обстоятельства происшествия устанавливают сотрудники полиции."
              )
          })
          assert fallback and len(fallback["body"]) == 2
          print("one-shot v9.7 regression gate: OK")
          PY
      - name: Run stable v9.7 live publisher
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ secrets.OPENROUTER_MODEL }}
          IMAGE_REQUIRED: "0"
          POSTS_PER_RUN: "2"
          MAX_AGE_HOURS: "36"
          AI_CALL_BUDGET: "8"
          PYTHONUNBUFFERED: "1"
        run: |
          python src/production.py
      - name: Verify runtime state
        run: |
          python - <<'PY'
          import json
          from urllib.parse import urlparse
          with open("state.json", "r", encoding="utf-8") as f:
              state = json.load(f)
          run = state.get("last_run") or {}
          assert run.get("version") == "stable-v9.7", run
          assert run.get("status") == "ok", run
          assert run.get("published", 0) <= 2, run
          assert "finished_sakhalin" in run, run
          local = run.get("local_stream") or {}
          assert local.get("status") in {"healthy", "degraded"}, local
          stats = run.get("stats") or {}
          assert stats.get("ai_calls", 0) <= 8, stats
          for p in (state.get("last_posts") or [])[-run.get("published", 0):]:
              u = p.get("url") or ""
              assert "news.google." not in urlparse(u).netloc.lower(), p
              if p.get("category_key") in {"ru_eco", "ru_pol", "ru_security"}:
                  assert "/world/" not in urlparse(u).path.lower(), p
              assert p.get("grounded_evidence") is True, p
          print("runtime verification: OK", run)
          PY
      - name: Commit live runtime state
        if: always()
        run: |
          git config user.name "skysakhnews-bot"
          git config user.email "actions@github.com"
          git add state.json
          if git diff --cached --quiet; then
            echo "No state changes"
          else
            git commit -m "Record v9.7 one-shot live verification"
            git pull --rebase --autostash origin main
            git push origin main
          fi
