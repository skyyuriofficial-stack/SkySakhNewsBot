# one-shot diagnostic live verification trigger 2026-08-19 v9.7
name: SkySakhNews v9.7 Diagnostic Live Verification

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/run_v96_once.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: skysakhnews-production-publisher
  cancel-in-progress: false

jobs:
  verify-live:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run v9.7 and capture diagnostics
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ secrets.OPENROUTER_MODEL }}
          IMAGE_REQUIRED: "0"
          POSTS_PER_RUN: "2"
          MAX_AGE_HOURS: "36"
          AI_CALL_BUDGET: "8"
          PYTHONUNBUFFERED: "1"
        run: |
          set +e
          python -m py_compile src/news_bot_v8.py src/news_bot_v9.py src/production.py > live_verify_report.txt 2>&1
          compile_rc=$?
          run_rc=99
          if [ "$compile_rc" -eq 0 ]; then
            python src/production.py >> live_verify_report.txt 2>&1
            run_rc=$?
          fi
          echo "compile_rc=$compile_rc" >> live_verify_report.txt
          echo "run_rc=$run_rc" >> live_verify_report.txt
          python - <<PY
          import json
          from pathlib import Path
          p = Path('state.json')
          state = json.loads(p.read_text(encoding='utf-8')) if p.exists() else {}
          run = state.get('last_run') or {}
          run.setdefault('version', 'stable-v9.7')
          if $compile_rc != 0:
              run.update({'version':'stable-v9.7','status':'error','error':'compile_failed','diagnostic':True})
          elif $run_rc != 0:
              run.update({'version':'stable-v9.7','status':'error','error':'runtime_failed','diagnostic':True})
          state['last_run'] = run
          p.write_text(json.dumps(state, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          tail -n 300 live_verify_report.txt
          exit 0
      - name: Persist diagnostic state and log
        if: always()
        run: |
          git config user.name "skysakhnews-bot"
          git config user.email "actions@github.com"
          git add state.json live_verify_report.txt
          if git diff --cached --quiet; then
            echo "No diagnostic changes"
          else
            git commit -m "Record v9.7 diagnostic live verification"
            git pull --rebase --autostash origin main
            git push origin main
          fi
