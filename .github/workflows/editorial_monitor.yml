name: SkySakhNews Continuous Editorial Monitor v12.1

on:
  workflow_dispatch:
  schedule:
    # Every hour at :30. Publisher itself runs at :00 on its six scheduled cycles.
    - cron: "30 * * * *"

permissions:
  contents: write

concurrency:
  group: skysakhnews-editorial-monitor
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile editorial monitor chain
        run: |
          python -m py_compile \
            src/news_bot_v8.py src/news_bot_v9.py src/production.py \
            src/editorial_gate.py src/editorial_policy.py src/category_reconciler.py \
            src/editorial_gate_runner.py src/media_enforced_runner.py \
            src/news_director.py src/publication_auditor.py \
            src/editorial_monitor.py src/publisher.py src/production_selftest.py

      - name: Require current regression suite
        env:
          IMAGE_REQUIRED: "1"
          AI_CALL_BUDGET: "0"
          EDITORIAL_AUDIT_AI_BUDGET: "0"
          NEWS_DIRECTOR_AI_BUDGET: "0"
          POST_AUDIT_AUTOCORRECT: "0"
          RUN_COOLDOWN_MINUTES: "0"
        run: python src/production_selftest.py

      - name: Audit and self-heal Telegram feed
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          POST_AUDIT_AUTOCORRECT: "1"
          IMAGE_REQUIRED: "1"
          AI_CALL_BUDGET: "0"
          EDITORIAL_AUDIT_AI_BUDGET: "0"
          NEWS_DIRECTOR_AI_BUDGET: "0"
          PYTHONUNBUFFERED: "1"
        run: python src/editorial_monitor.py

      - name: Commit audit corrections and monitor status
        if: always()
        run: |
          git config user.name "skysakhnews-monitor"
          git config user.email "actions@github.com"
          git add state.json monitor_status.json
          if git diff --cached --quiet; then
            echo "No monitor changes"
          else
            git commit -m "Update continuous editorial monitor state"
            git pull --rebase --autostash origin main
            git push origin main
          fi

      - name: Require healthy monitored feed
        run: |
          python - <<'PY'
          import json
          with open("monitor_status.json", "r", encoding="utf-8") as f:
              status = json.load(f)
          assert status.get("publisher_version") == "stable-v12.1", status
          assert status.get("status") == "healthy", status
          assert int((status.get("post_audit") or {}).get("unresolved") or 0) == 0, status
          assert not (status.get("post_audit") or {}).get("failed_actions"), status
          print("continuous editorial monitor: HEALTHY")
          PY
