name: SkySakhNews Continuous Editorial Monitor v12.1

on:
  workflow_dispatch:
  schedule:
    # Six independent opportunities per hour, offset from production pulses.
    - cron: "3,13,23,33,43,53 * * * *"

permissions:
  contents: write

concurrency:
  # Serialize with production only when live state could be corrected.
  group: skysakhnews-live-state
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile editorial monitor chain
        run: |
          python -m py_compile \
            src/news_bot_v8.py src/news_bot_v9.py src/production.py \
            src/editorial_gate.py src/editorial_policy.py src/category_reconciler.py \
            src/editorial_gate_runner.py src/media_enforced_runner.py \
            src/news_director.py src/publication_auditor.py \
            src/editorial_monitor.py src/publisher.py src/production_selftest.py \
            src/telegram_health.py src/editorial_hardening.py \
            src/hardened_monitor.py src/health_gate.py src/hardening_selftest.py \
            src/operational_selftest.py

      - name: Require current regression suite on manual diagnostic runs
        if: github.event_name == 'workflow_dispatch'
        env:
          IMAGE_REQUIRED: "1"
          AI_CALL_BUDGET: "0"
          EDITORIAL_AUDIT_AI_BUDGET: "0"
          NEWS_DIRECTOR_AI_BUDGET: "0"
          POST_AUDIT_AUTOCORRECT: "0"
          RUN_COOLDOWN_MINUTES: "0"
        run: |
          python src/production_selftest.py
          python src/hardening_selftest.py
          python src/operational_selftest.py

      - name: Audit and self-heal Telegram feed
        id: hardened_monitor
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          POST_AUDIT_AUTOCORRECT: "1"
          IMAGE_REQUIRED: "1"
          AI_CALL_BUDGET: "0"
          EDITORIAL_AUDIT_AI_BUDGET: "0"
          NEWS_DIRECTOR_AI_BUDGET: "0"
          THEMATIC_MIX_ERROR_LIMIT: "8"
          PYTHONUNBUFFERED: "1"
        run: python src/hardened_monitor.py

      - name: Commit monitor status and real corrections
        if: always()
        run: |
          git config user.name "skysakhnews-monitor"
          git config user.email "actions@github.com"
          git add monitor_status.json telegram_health.json
          if python - <<'PY'
          import json, sys
          try:
              data=json.load(open('monitor_status.json',encoding='utf-8'))
          except Exception:
              sys.exit(1)
          audit=data.get('post_audit') or {}
          actions=data.get('hardening_actions') or []
          sys.exit(0 if (audit.get('corrected') or audit.get('deleted') or actions) else 1)
          PY
          then
            git add state.json
          fi
          if git diff --cached --quiet; then
            echo "No monitor changes"
          else
            git commit -m "Update hardened editorial monitor status"
            git pull --rebase --autostash origin main
            git push origin main
          fi

      - name: Require monitor execution health
        if: always()
        run: python src/health_gate.py monitor
