name: Veshudei Telegram Diagnostic

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/veshudei_telegram_diagnostic.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect Telegram bot and webhook
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          token = os.environ.get("TELEGRAM_BOT_TOKEN", "")
          if not token:
              print(json.dumps({"ok": False, "error": "missing TELEGRAM_BOT_TOKEN"}))
              raise SystemExit(0)
          base = "https://api.telegram.org/bot" + token + "/"
          out = {}
          for method in ("getMe", "getWebhookInfo"):
              with urllib.request.urlopen(base + method, timeout=15) as r:
                  data = json.load(r)
              if method == "getMe":
                  result = data.get("result") or {}
                  out["bot"] = {"id": result.get("id"), "username": result.get("username")}
              else:
                  result = data.get("result") or {}
                  out["webhook"] = {
                      "url": result.get("url"),
                      "pending_update_count": result.get("pending_update_count"),
                      "last_error_date": result.get("last_error_date"),
                      "last_error_message": result.get("last_error_message"),
                      "max_connections": result.get("max_connections"),
                      "allowed_updates": result.get("allowed_updates"),
                  }
          print(json.dumps(out, ensure_ascii=False))
          PY
