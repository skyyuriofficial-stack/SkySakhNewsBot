name: SkySakhNews Final Quality Audit v10.2

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/final_quality_audit_v102.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: skysakhnews-final-quality-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile complete production and audit system
        run: |
          python -m py_compile \
            src/news_bot_v8.py \
            src/news_bot_v9.py \
            src/production.py \
            src/editorial_gate.py \
            src/category_reconciler.py \
            src/editorial_gate_runner.py \
            src/quality_audit.py

      - name: Run live-source end-to-end dry audit
        id: quality
        continue-on-error: true
        env:
          IMAGE_REQUIRED: "0"
          POSTS_PER_RUN: "2"
          MAX_AGE_HOURS: "36"
          AI_CALL_BUDGET: "0"
          EDITORIAL_AUDIT_AI_BUDGET: "0"
          RUN_COOLDOWN_MINUTES: "0"
          FORCE_RUN: "1"
          PYTHONUNBUFFERED: "1"
        run: |
          python src/quality_audit.py 2>&1 | tee final_quality_audit.log
          test ${PIPESTATUS[0]} -eq 0

      - name: Persist final audit report and log
        if: always()
        run: |
          git config user.name "skysakhnews-bot"
          git config user.email "actions@github.com"
          git add final_quality_report.json final_quality_audit.log
          if git diff --cached --quiet; then
            echo "No final audit changes"
          else
            git commit -m "Record stable v10.2 final quality audit"
            git pull --rebase --autostash origin main
            git push origin main
          fi

      - name: Enforce final audit result
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path("final_quality_report.json")
          assert path.exists(), "final_quality_report.json was not produced"
          report = json.loads(path.read_text(encoding="utf-8"))
          assert report.get("version") == "stable-v10.2", report.get("version")
          assert report.get("all_pass") is True, {
              "failed": report.get("failed"),
              "run_error": report.get("run_error"),
              "failed_checks": [x for x in report.get("checks", []) if not x.get("ok")],
              "violations": report.get("candidate_violations", [])[:8],
          }
          print("FINAL QUALITY AUDIT: PASS")
          PY
