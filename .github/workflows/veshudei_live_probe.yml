name: Veshudei Live Probe
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/veshudei_live_probe.yml"
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe health
        run: |
          curl -L -sS --max-time 20 https://sky-sakh-news-bot.vercel.app/api/health
          echo
      - name: Probe webhook transport
        run: |
          code=$(curl -L -sS -o /tmp/body -w "%{http_code}" --max-time 20 -X POST -H "content-type: application/json" -d '{}' https://sky-sakh-news-bot.vercel.app/api/telegram)
          echo "HTTP=$code"
          cat /tmp/body
          echo
