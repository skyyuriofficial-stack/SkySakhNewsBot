name: SkySakhNews v11.0 One-Shot Live Verification

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/run_v110_live_once.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: skysakhnews-production-publisher
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile and run mandatory regressions
        env:
          IMAGE_REQUIRED: "1"
          AI_CALL_BUDGET: "8"
          EDITORIAL_AUDIT_AI_BUDGET: "4"
          NEWS_DIRECTOR_AI_BUDGET: "1"
          RUN_COOLDOWN_MINUTES: "0"
          MEDIA_PENDING_MAX_HOURS: "36"
          MEDIA_PENDING_MAX_ITEMS: "24"
        run: |
          python -m py_compile \
            src/news_bot_v8.py \
            src/news_bot_v9.py \
            src/production.py \
            src/editorial_gate.py \
            src/category_reconciler.py \
            src/editorial_gate_runner.py \
            src/media_enforced_runner.py \
            src/news_director.py \
            src/publisher.py \
            src/production_selftest.py
          python src/production_selftest.py

      - name: Run corrected system against live sources and Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ secrets.OPENROUTER_MODEL }}
          IMAGE_REQUIRED: "1"
          POSTS_PER_RUN: "2"
          MAX_AGE_HOURS: "36"
          AI_CALL_BUDGET: "8"
          EDITORIAL_AUDIT_AI_BUDGET: "4"
          NEWS_DIRECTOR_AI_BUDGET: "1"
          RUN_COOLDOWN_MINUTES: "0"
          FORCE_RUN: "1"
          MEDIA_PENDING_MAX_HOURS: "36"
          MEDIA_PENDING_MAX_ITEMS: "24"
          PYTHONUNBUFFERED: "1"
        run: |
          python src/publisher.py

      - name: Verify live publication and autonomous director state
        run: |
          python - <<'PY'
          import json
          from urllib.parse import urlparse

          with open("state.json", "r", encoding="utf-8") as file:
              state = json.load(file)

          run = state.get("last_run") or {}
          assert run.get("version") == "stable-v11.0", run
          assert run.get("status") == "ok", run
          assert "finished_sakhalin" in run, run
          assert (run.get("local_stream") or {}).get("status") in {"healthy", "degraded"}, run

          director = run.get("news_director") or {}
          assert director.get("version") == "director-v1", director
          assert int(director.get("candidate_count") or 0) > 0, director
          assert int(director.get("approved_count") or 0) > 0, director
          assert int(director.get("rejected_count") or 0) >= 0, director

          media = run.get("media_policy") or {}
          assert media.get("required") is True, media
          assert media.get("text_only_allowed") is False, media

          published = int(run.get("published") or 0)
          assert 1 <= published <= 2, run
          posts = (state.get("last_posts") or [])[-published:]
          assert len(posts) == published, posts

          for post in posts:
              editorial = post.get("editorial_gate") or {}
              assert editorial.get("approved") is True, post
              assert int(editorial.get("title_matches_source") or 0) >= 90, post
              assert int(editorial.get("category_matches_story") or 0) >= 90, post
              assert editorial.get("facts_supported") is True, post
              assert editorial.get("meaning_changed") is False, post

              decision = post.get("news_director") or {}
              assert decision.get("version") == "director-v1", post
              assert decision.get("approved") is True, post
              assert decision.get("final_title_checked") is True, post
              assert decision.get("final_category_checked") is True, post
              assert int(decision.get("seriousness") or 0) >= int(decision.get("threshold") or 0), post

              assert post.get("with_image") is True, post
              assert post.get("image_url"), post
              assert post.get("image_hash"), post
              assert str(post.get("publish_method") or "").startswith("sendPhoto/"), post
              assert "news.google." not in urlparse(post.get("url") or "").netloc.lower(), post
              assert post.get("telegram_message_id") is not None, post

          print("stable-v11.0 live verification: OK")
          print(json.dumps({
              "run": run,
              "published_posts": posts,
              "balance": state.get("news_balance"),
          }, ensure_ascii=False, indent=2))
          PY

      - name: Commit verified state
        if: always()
        run: |
          git config user.name "skysakhnews-bot"
          git config user.email "actions@github.com"
          git add state.json
          if git diff --cached --quiet; then
            echo "No state changes"
          else
            git commit -m "Record stable v11.0 live verification"
            git pull --rebase --autostash origin main
            git push origin main
          fi
