name: SkySakhNews v10.3 Mandatory Media Live Verification

on:
  push:
    branches: [main]
    paths: [".github/workflows/run_v103_media_live_once.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: skysakhnews-production-publisher
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile
        run: |
          python -m py_compile \
            src/news_bot_v8.py \
            src/news_bot_v9.py \
            src/production.py \
            src/editorial_gate.py \
            src/category_reconciler.py \
            src/editorial_gate_runner.py \
            src/media_enforced_runner.py

      - name: Publish verified source-media posts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ secrets.OPENROUTER_MODEL }}
          IMAGE_REQUIRED: "1"
          POSTS_PER_RUN: "2"
          MAX_AGE_HOURS: "36"
          AI_CALL_BUDGET: "8"
          EDITORIAL_AUDIT_AI_BUDGET: "4"
          RUN_COOLDOWN_MINUTES: "0"
          FORCE_RUN: "1"
          PYTHONUNBUFFERED: "1"
        run: |
          python src/media_enforced_runner.py

      - name: Verify two media publications
        run: |
          python - <<'PY'
          import json

          with open("state.json", "r", encoding="utf-8") as file:
              state = json.load(file)

          run = state.get("last_run") or {}
          assert run.get("version") == "stable-v10.3", run
          assert run.get("status") == "ok", run
          assert int(run.get("published") or 0) == 2, run

          media = run.get("media_policy") or {}
          assert media.get("required") is True, media
          assert media.get("text_only_allowed") is False, media
          assert int(media.get("photo_published") or 0) >= 2, media

          posts = (state.get("last_posts") or [])[-2:]
          for post in posts:
              assert post.get("with_image") is True, post
              assert post.get("image_url"), post
              assert post.get("image_hash"), post
              assert post.get("media_required") is True, post
              assert post.get("media_type") == "photo", post
              assert post.get("media_origin") == "source_article_or_feed", post
              assert str(post.get("publish_method") or "").startswith("sendPhoto/"), post
              gate = post.get("editorial_gate") or {}
              assert gate.get("approved") is True, post
              assert int(gate.get("title_matches_source") or 0) >= 90, post
              assert int(gate.get("category_matches_story") or 0) >= 90, post
              assert gate.get("facts_supported") is True, post
              assert gate.get("meaning_changed") is False, post

          print("stable-v10.3 live mandatory-media verification: SUCCESS", posts)
          PY

      - name: Commit verified state
        if: always()
        run: |
          git config user.name "skysakhnews-bot"
          git config user.email "actions@github.com"
          git add state.json
          if git diff --cached --quiet; then
            echo "No state changes"
          else
            git commit -m "Record v10.3 mandatory-media live verification"
            git pull --rebase --autostash origin main
            git push origin main
          fi
