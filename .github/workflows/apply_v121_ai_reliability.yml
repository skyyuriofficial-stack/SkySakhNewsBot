name: Apply v12.1 AI reliability patch

on:
  push:
    branches: [fix/v121-ai-fallback]
    paths:
      - "tools/apply_v121_ai_reliability.py"
      - ".github/workflows/apply_v121_ai_reliability.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-v121-ai-reliability
  cancel-in-progress: true

jobs:
  patch-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply patch
        run: python tools/apply_v121_ai_reliability.py
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile
        run: |
          python -m py_compile \
            src/news_bot_v8.py src/news_bot_v9.py src/production.py \
            src/editorial_gate.py src/editorial_policy.py src/category_reconciler.py \
            src/editorial_gate_runner.py src/media_enforced_runner.py \
            src/news_director.py src/publication_auditor.py src/editorial_monitor.py \
            src/publisher.py src/production_selftest.py
      - name: Test
        env:
          IMAGE_REQUIRED: "1"
          AI_CALL_BUDGET: "0"
          EDITORIAL_AUDIT_AI_BUDGET: "0"
          NEWS_DIRECTOR_AI_BUDGET: "0"
          OPENROUTER_MAX_ATTEMPTS: "3"
          OPENROUTER_RETRY_BASE_SECONDS: "0"
          POST_AUDIT_AUTOCORRECT: "0"
          RUN_COOLDOWN_MINUTES: "0"
        run: python src/production_selftest.py
      - name: Verify diff
        run: |
          git diff --check
          git diff --stat
      - name: Commit tested sources
        run: |
          git config user.name "skysakhnews-bot"
          git config user.email "actions@github.com"
          find src -type d -name __pycache__ -prune -exec rm -rf {} +
          git checkout -- .github/workflows/auto_publish_v7.yml .github/workflows/editorial_monitor.yml
          git add src/editorial_policy.py src/editorial_gate_runner.py src/production.py src/production_selftest.py
          git commit -m "Make foreign translation resilient without global AI failure"
          git push origin HEAD:fix/v121-ai-fallback
