name: SkySakhNews Mobilization Digest One-Off Recovery

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/mobilization_recovery_once.yml"

permissions:
  contents: write

concurrency:
  group: skysakhnews-mobilization-digest
  cancel-in-progress: false

jobs:
  recover-missed-morning:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile digest
        run: |
          python -m py_compile src/mobilization_digest.py
          python -m py_compile src/mobilization_digest_runner.py
          python -m py_compile src/mobilization_sources.py
          python -m py_compile src/mobilization_digest_final.py

      - name: Recover today's missed morning digest
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ secrets.OPENROUTER_MODEL }}
          DIGEST_MODE: morning
          DIGEST_DRY_RUN: "0"
          PYTHONUNBUFFERED: "1"
        run: python src/mobilization_digest_final.py

      - name: Persist digest state
        if: always()
        run: |
          git config user.name "skysakhnews-bot"
          git config user.email "actions@github.com"
          git add mobilization_digest_state.json
          if git diff --cached --quiet; then
            echo "No digest state changes"
          else
            git commit -m "Recover missed morning mobilization digest"
            git pull --rebase --autostash origin main
            git push origin main
          fi
