name: SkySakhNews v10.1 Final Semantic Verification

on:
  push:
    branches: [main]
    paths: [".github/workflows/run_editorial_audit_final.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: skysakhnews-final-semantic-verification
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile and dry-run exact production path
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ secrets.OPENROUTER_MODEL }}
          IMAGE_REQUIRED: "0"
          POSTS_PER_RUN: "2"
          MAX_AGE_HOURS: "36"
          AI_CALL_BUDGET: "2"
          EDITORIAL_AUDIT_AI_BUDGET: "2"
          RUN_COOLDOWN_MINUTES: "0"
          FORCE_RUN: "1"
          PYTHONUNBUFFERED: "1"
        run: |
          set +e
          python -m py_compile src/news_bot_v8.py src/news_bot_v9.py src/production.py src/editorial_gate.py src/category_reconciler.py src/editorial_gate_runner.py > final_semantic_verify.log 2>&1
          python - <<'PY' >> final_semantic_verify.log 2>&1
          import copy, json, sys, traceback
          from pathlib import Path
          from datetime import datetime, timezone
          sys.path.insert(0, "src")
          import editorial_gate as gate
          import category_reconciler as rec
          import editorial_gate_runner as runner
          core, prod = runner.core, runner.prod

          report = {"version": runner.VERSION, "generated_at_utc": datetime.now(timezone.utc).isoformat(timespec="seconds"), "checks": [], "all_pass": False}
          try:
              state = json.loads(Path("state.json").read_text(encoding="utf-8"))

              # Historical failures must now be deterministically corrected.
              def C(cat, source, title, text, url):
                  return {"category_key":cat,"category":cat,"source":source,"title":title,"source_text":text,"url":url}
              regressions = [
                  (C("sakh","Interfax","В парламенте Ирана заявили, что давление на Тегеран не поможет США заключить соглашение","Иран и США обсуждают соглашение.","https://www.interfax.ru/world/1110010"), "geo"),
                  (C("ru_eco","Interfax","Трамп рассматривает отсрочку введения пошлин в 50% в отношении Канады","Президент США обсуждает пошлины для Канады.","https://www.interfax.ru/world/1110016"), "geo"),
                  (C("sakh_chp","SakhalinMedia.ru","Сильный дождь пройдет в центральных районах Сахалина 20 августа","Сахалинское УГМС прогнозирует осадки.","https://sakhalinmedia.ru/news/2593484/"), "sakh"),
                  (C("ru_pol","Interfax","Ребенок погиб в Ростовской области, упав за борт катера","Следователи устанавливают обстоятельства происшествия.","https://www.interfax.ru/russia/1110068"), "ru_incident"),
                  (C("ru_pol","TASS","Дмитриев считает, что Федоров бросил вызов Зеленскому призывами к выборам","Высказывание касается украинской политики и выборов на Украине.","https://tass.ru/politika/28023743"), "geo"),
                  (C("sakh","Interfax","Японист РАН: Токио наказывает Россию за Украину, но в уме держит Китай","Материал о политике Японии, России, Украины и Китая; упоминаются Курилы.","https://www.interfax.ru/world/1110153"), "geo"),
                  (C("sakh","SakhalinMedia.ru","Мэр Хабаровска рассказал об автобусной остановке","Новость посвящена городской инфраструктуре Хабаровска.","https://sakhalinmedia.ru/news/2594805/"), None),
                  (C("sakh","SakhalinMedia.ru","Русские Сейшелы на сентябрь: райский остров для отдыха","Туристический материал без привязки к Сахалину.","https://sakhalinmedia.ru/news/2594558/"), None),
                  (C("ru_eco","Interfax","Нефть слабо дорожает, Brent торгуется у $91,7 за баррель","Цены на Brent меняются на фоне сигналов с Ближнего Востока.","https://www.interfax.ru/business/1110251"), "geo"),
              ]
              regression_results = []
              for c, expected in regressions:
                  got = rec.suggest_category(c)
                  regression_results.append({"title":c["title"],"old":c["category_key"],"expected":expected,"got":got,"ok":got==expected})

              # Audit live raw candidate pool with current reconciler.
              raw = runner._original_collect(copy.deepcopy(state))
              raw_audit = []
              for c in raw:
                  got = rec.suggest_category(c)
                  raw_audit.append({"title":c.get("title"),"source":c.get("source"),"old":c.get("category_key"),"new":got,"changed":got!=c.get("category_key")})

              # Exact production dry-run; keep runner save wrapper so gate verdicts are persisted.
              captured, sent = {}, []
              core.b.load_state = lambda: copy.deepcopy(state)
              def sink(s): captured.clear(); captured.update(copy.deepcopy(s))
              runner._original_save_state = sink
              core.b.save_state = runner.save_state_with_editorial_audit
              def photo(c, cap): sent.append({"url":c.get("url"),"category_key":c.get("category_key"),"title":c.get("title"),"method":"photo"}); return {"ok":True}
              def text(row, c): sent.append({"url":c.get("url"),"category_key":c.get("category_key"),"title":c.get("title"),"method":"text"}); return {"ok":True}
              core.b.send_photo = photo
              core.send_text = text
              core.time.sleep = lambda _: None
              run_error = None
              try: runner.main()
              except Exception as ex: run_error = repr(ex); traceback.print_exc()

              run = captured.get("last_run") or {}
              n = int(run.get("published") or 0)
              posts = (captured.get("last_posts") or [])[-n:] if n else []
              checks=[]
              def ck(name, ok, detail=""): checks.append({"name":name,"ok":bool(ok),"detail":str(detail)[:1800]})
              ck("compile/runtime", run_error is None, run_error)
              ck("version", run.get("version") == "stable-v10.1", run.get("version"))
              ck("historical_regressions", all(x["ok"] for x in regression_results), [x for x in regression_results if not x["ok"]])
              ck("raw_candidates", len(raw)>0, len(raw))
              ck("post_reconcile_candidates", int(run.get("candidates") or 0)>0, run.get("candidates"))
              ck("local_candidates_after_reconcile", int(run.get("local_candidates") or 0)>0, run.get("local_candidates"))
              ck("published_two", n==2, n)
              ck("captured_two", len(sent)==2, sent)
              for i,p in enumerate(posts,1):
                  g=p.get("editorial_gate") or {}
                  ck(f"post{i}_approved", g.get("approved") is True, g)
                  ck(f"post{i}_title90", int(g.get("title_matches_source") or 0)>=90, g)
                  ck(f"post{i}_category90", int(g.get("category_matches_story") or 0)>=90, g)
                  ck(f"post{i}_facts", g.get("facts_supported") is True, g)
                  ck(f"post{i}_meaning", g.get("meaning_changed") is False, g)
              report.update({"run":run,"historical_regressions":regression_results,"raw_candidate_count":len(raw),"raw_audit":raw_audit,"sent":sent,"posts":posts,"checks":checks,"run_error":run_error})
          except Exception as ex:
              report["checks"]=[{"name":"harness","ok":False,"detail":repr(ex)}]; report["run_error"]=repr(ex); traceback.print_exc()
          report["passed"]=sum(1 for x in report["checks"] if x.get("ok"))
          report["failed"]=sum(1 for x in report["checks"] if not x.get("ok"))
          report["all_pass"]=bool(report["checks"]) and report["failed"]==0
          Path("final_semantic_verify.json").write_text(json.dumps(report,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          print(json.dumps({k:report.get(k) for k in ("version","raw_candidate_count","passed","failed","all_pass","run_error")},ensure_ascii=False,indent=2))
          PY
          tail -n 300 final_semantic_verify.log
          exit 0
      - name: Persist final verification
        if: always()
        run: |
          git config user.name "skysakhnews-bot"
          git config user.email "actions@github.com"
          git add -A final_semantic_verify.json final_semantic_verify.log
          if git diff --cached --quiet; then
            echo "No verification changes"
          else
            git commit -m "Record final v10.1 semantic verification"
            git pull --rebase --autostash origin main
            git push origin main
          fi
