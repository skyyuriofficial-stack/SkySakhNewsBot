name: Definitive stable v10.2 release validation

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/release_v102_final.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-and-finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile
        run: |
          python -m py_compile src/news_bot_v8.py src/news_bot_v9.py src/production.py src/editorial_gate.py src/category_reconciler.py src/editorial_gate_runner.py src/quality_audit.py
      - name: Run definitive live-source dry audit
        env:
          IMAGE_REQUIRED: "0"
          POSTS_PER_RUN: "2"
          MAX_AGE_HOURS: "36"
          AI_CALL_BUDGET: "0"
          EDITORIAL_AUDIT_AI_BUDGET: "0"
          RUN_COOLDOWN_MINUTES: "0"
          FORCE_RUN: "1"
          PYTHONUNBUFFERED: "1"
        run: |
          set +e
          python src/quality_audit.py > final_quality_audit.log 2>&1
          rc=$?
          python - <<PY
          import json
          from pathlib import Path
          report_path = Path('final_quality_report.json')
          report = json.loads(report_path.read_text(encoding='utf-8')) if report_path.exists() else {}
          assert $rc == 0, {'exit_code': $rc, 'failed': report.get('failed'), 'run_error': report.get('run_error'), 'failed_checks': [x for x in report.get('checks', []) if not x.get('ok')], 'violations': report.get('candidate_violations', [])[:10]}
          assert report.get('version') == 'stable-v10.2', report.get('version')
          assert report.get('all_pass') is True, report
          assert int(report.get('failed') or 0) == 0, report
          assert len(report.get('candidate_violations') or []) == 0, report.get('candidate_violations')
          status = {
              'version': 'stable-v10.2',
              'quality_gate': 'passed',
              'all_pass': True,
              'passed_checks': report.get('passed'),
              'failed_checks': 0,
              'candidate_count': report.get('candidate_count'),
              'reconciled_count': report.get('reconciled_count'),
              'offtopic_rejected': report.get('offtopic_count'),
              'candidate_violations': 0,
              'run_error': None,
              'verified_by': 'live sources + dry Telegram + mandatory semantic gate',
          }
          Path('QUALITY_STATUS.json').write_text(json.dumps(status, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(status, ensure_ascii=False, indent=2))
          PY
      - name: Install permanent manual audit workflow
        run: |
          cat > .github/workflows/run_editorial_audit_once.yml <<'YAML'
          name: SkySakhNews Manual Quality Audit v10.2

          on:
            workflow_dispatch:

          permissions:
            contents: read

          jobs:
            audit:
              runs-on: ubuntu-latest
              timeout-minutes: 35
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-python@v5
                  with:
                    python-version: "3.11"
                - name: Install dependencies
                  run: |
                    python -m pip install --upgrade pip
                    pip install -r requirements.txt
                - name: Run live-source dry quality audit
                  env:
                    IMAGE_REQUIRED: "0"
                    POSTS_PER_RUN: "2"
                    MAX_AGE_HOURS: "36"
                    AI_CALL_BUDGET: "0"
                    EDITORIAL_AUDIT_AI_BUDGET: "0"
                    RUN_COOLDOWN_MINUTES: "0"
                    FORCE_RUN: "1"
                    PYTHONUNBUFFERED: "1"
                  run: |
                    python -m py_compile src/news_bot_v8.py src/news_bot_v9.py src/production.py src/editorial_gate.py src/category_reconciler.py src/editorial_gate_runner.py src/quality_audit.py
                    python src/quality_audit.py
          YAML
      - name: Clean temporary release artifacts
        run: |
          git rm -f --ignore-unmatch \
            .github/workflows/apply_v102_strict_patch.yml \
            .github/workflows/apply_v102_local_geography_patch.yml \
            .github/workflows/final_quality_audit_v102.yml \
            .github/workflows/final_quality_proof_v102.yml \
            .github/workflows/final_quality_proof_v102_rerun.yml \
            .github/workflows/final_quality_proof_v102_final.yml \
            .github/workflows/finalize_v102_cleanup.yml \
            .github/workflows/finalize_v102_cleanup_retry.yml \
            .github/workflows/release_v102_final.yml \
            final_quality_report.json \
            final_quality_audit.log \
            FINAL_QUALITY_PASS.json \
            FINAL_QUALITY_FAIL.json \
            v10_editorial_audit_report.json \
            editorial_audit.log
      - name: Commit definitive release
        run: |
          git config user.name "skysakhnews-bot"
          git config user.email "actions@github.com"
          git add QUALITY_STATUS.json .github/workflows/run_editorial_audit_once.yml
          git commit -m "Finalize stable v10.2 verified production release"
          git pull --rebase --autostash origin main
          git push origin main
