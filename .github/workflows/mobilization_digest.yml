name: SkySakhNews Mobilization Digest

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Digest mode"
        required: false
        default: "auto"
        type: choice
        options:
          - auto
          - morning
          - evening
  schedule:
    # UTC; Sakhalin = UTC+11. 08:00 and 19:00 Sakhalin.
    - cron: "0 8,21 * * *"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/mobilization_digest.yml"

permissions:
  contents: write

concurrency:
  group: skysakhnews-mobilization-digest
  cancel-in-progress: false

jobs:
  publish-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile digest
        run: python -m py_compile src/mobilization_digest.py

      - name: Build, fact-check and publish mobilization digest
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ secrets.OPENROUTER_MODEL }}
          DIGEST_MODE: ${{ github.event.inputs.mode }}
          PYTHONUNBUFFERED: "1"
        run: python src/mobilization_digest.py

      - name: Commit digest state
        if: success()
        run: |
          git config user.name "skysakhnews-bot"
          git config user.email "actions@github.com"
          git add mobilization_digest_state.json
          if git diff --cached --quiet; then
            echo "No digest state changes"
          else
            git commit -m "Update mobilization digest state"
            git pull --rebase --autostash origin main
            git push origin main
          fi
