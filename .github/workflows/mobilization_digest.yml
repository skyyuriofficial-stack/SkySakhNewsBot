name: SkySakhNews Mobilization Digest

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Digest mode"
        required: false
        default: "auto"
        type: choice
        options:
          - auto
          - morning
          - evening
  schedule:
    # Sakhalin UTC+11. Offset from common cron peaks and retry repeatedly.
    # Morning: 08:07-12:37 Sakhalin every 30 minutes.
    - cron: "7,37 0,1,21,22,23 * * *"
    # Morning late watchdog: 13:07-18:07 Sakhalin, hourly.
    - cron: "7 2,3,4,5,6,7 * * *"
    # Evening: 19:07-22:37 Sakhalin every 30 minutes.
    - cron: "7,37 8,9,10,11 * * *"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/mobilization_digest.yml"
      - "src/mobilization_digest.py"
      - "src/mobilization_digest_runner.py"
      - "src/mobilization_sources.py"
      - "src/mobilization_digest_final.py"
      - "src/hardened_digest.py"
      - "src/telegram_health.py"

permissions:
  contents: write

concurrency:
  group: skysakhnews-mobilization-digest
  cancel-in-progress: false

jobs:
  publish-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile digest
        run: |
          python -m py_compile src/mobilization_digest.py
          python -m py_compile src/mobilization_digest_runner.py
          python -m py_compile src/mobilization_sources.py
          python -m py_compile src/mobilization_digest_final.py
          python -m py_compile src/telegram_health.py
          python -m py_compile src/hardened_digest.py

      - name: Build, fact-check and publish mobilization digest
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ secrets.OPENROUTER_MODEL }}
          DIGEST_MODE: ${{ github.event.inputs.mode }}
          DIGEST_SCHEDULE: ${{ github.event.schedule }}
          DIGEST_DRY_RUN: ${{ github.event_name == 'push' && '1' || '0' }}
          PYTHONUNBUFFERED: "1"
        run: python src/hardened_digest.py

      - name: Commit digest state
        if: always() && github.event_name != 'push'
        run: |
          git config user.name "skysakhnews-bot"
          git config user.email "actions@github.com"
          git add mobilization_digest_state.json
          if git diff --cached --quiet; then
            echo "No digest state changes"
          else
            git commit -m "Update mobilization digest state"
            git pull --rebase --autostash origin main
            git push origin main
          fi
