name: SkySakhNews v12 One-Shot Live Verification

on:
  push:
    branches: [main]
    paths: [".github/workflows/run_v12_live_once.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: skysakhnews-production-publisher
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Require verified v12 sources
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("V12_MAIN_VERIFIED.json").read_text(encoding="utf-8"))
          assert data.get("version") == "stable-v12.0", data
          assert data.get("all_source_tests_passed") is True, data
          PY

      - name: Install and test
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m py_compile \
            src/news_bot_v8.py src/news_bot_v9.py src/production.py \
            src/editorial_gate.py src/category_reconciler.py \
            src/editorial_gate_runner.py src/media_enforced_runner.py \
            src/editorial_policy.py src/news_director.py \
            src/publication_auditor.py src/publisher.py \
            src/production_selftest.py
          IMAGE_REQUIRED=1 AI_CALL_BUDGET=0 EDITORIAL_AUDIT_AI_BUDGET=0 \
          NEWS_DIRECTOR_AI_BUDGET=0 POST_AUDIT_AUTOCORRECT=0 \
          RUN_COOLDOWN_MINUTES=0 python src/production_selftest.py

      - name: Publish two strictly verified posts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ secrets.OPENROUTER_MODEL }}
          IMAGE_REQUIRED: "1"
          POSTS_PER_RUN: "2"
          MAX_AGE_HOURS: "36"
          AI_CALL_BUDGET: "0"
          EDITORIAL_AUDIT_AI_BUDGET: "0"
          NEWS_DIRECTOR_AI_BUDGET: "0"
          POST_AUDIT_AUTOCORRECT: "1"
          RUN_COOLDOWN_MINUTES: "0"
          FORCE_RUN: "1"
          MEDIA_PENDING_MAX_HOURS: "36"
          MEDIA_PENDING_MAX_ITEMS: "24"
          PYTHONUNBUFFERED: "1"
        run: |
          python src/publisher.py

      - name: Verify actual Telegram publication and final audit
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from urllib.parse import urlparse

          state = json.loads(Path("state.json").read_text(encoding="utf-8"))
          run = state.get("last_run") or {}
          assert run.get("version") == "stable-v12.0", run
          assert run.get("status") == "ok", run
          assert int(run.get("published") or 0) == 2, run
          posts = (state.get("last_posts") or [])[-2:]
          assert len(posts) == 2, posts

          forbidden = (
              "в этот день", "наградили", "поздравили", "торжественная церемония",
              "гороскоп", "рецепт", "головолом", "райское место", "по карману",
              "туристический форум", "чтобы вернуть ему вещи и документы",
          )
          for post in posts:
              title = str(post.get("title") or "")
              assert not any(marker in title.lower() for marker in forbidden), post
              assert post.get("publisher_version") == "stable-v12.0", post
              assert post.get("telegram_message_id") is not None, post
              assert post.get("with_image") is True, post
              assert post.get("image_url") and post.get("image_hash"), post
              assert str(post.get("publish_method") or "").startswith("sendPhoto/"), post
              assert "news.google." not in urlparse(str(post.get("url") or "")).netloc.lower(), post

              editorial = post.get("editorial_gate") or {}
              assert editorial.get("approved") is True, post
              assert int(editorial.get("title_matches_source") or 0) >= 90, post
              assert int(editorial.get("category_matches_story") or 0) >= 90, post
              assert editorial.get("facts_supported") is True, post
              assert editorial.get("meaning_changed") is False, post

              director = post.get("news_director") or {}
              assert director.get("approved") is True, post
              assert int(director.get("seriousness") or 0) >= int(director.get("threshold") or 0), post
              assert director.get("final_title_checked") is True, post
              assert director.get("final_category_checked") is True, post

          audit = run.get("post_publication_audit") or {}
          assert int(audit.get("unresolved") or 0) == 0, audit
          print("stable-v12.0 live Telegram verification: ALL PASS", posts)
          PY

      - name: Commit verified live state
        if: always()
        run: |
          git config user.name "skysakhnews-bot"
          git config user.email "actions@github.com"
          git add state.json
          if git diff --cached --quiet; then
            echo "No state changes"
          else
            git commit -m "Record verified stable v12.0 live publication"
            git pull --rebase --autostash origin main
            git push origin main
          fi
