name: Publish Mobilization Digest Test Once

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish_mobilization_test_once.yml"

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install requests
        run: pip install requests==2.32.3

      - name: Publish verified test digest to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: python src/publish_mobilization_test_once.py
