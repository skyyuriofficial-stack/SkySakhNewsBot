name: SkySakhNews Root Cause Hardening Once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/root_cause_hardening_once.yml"

permissions:
  contents: write

concurrency:
  group: skysakhnews-root-cause-hardening
  cancel-in-progress: false

jobs:
  harden:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Apply root-cause hardening
        run: python src/root_cause_patch_once.py

      - name: Compile and run reliability regressions
        env:
          IMAGE_REQUIRED: "1"
          AI_CALL_BUDGET: "0"
          EDITORIAL_AUDIT_AI_BUDGET: "0"
          NEWS_DIRECTOR_AI_BUDGET: "0"
          POST_AUDIT_AUTOCORRECT: "0"
          RUN_COOLDOWN_MINUTES: "0"
          OPENROUTER_MAX_ATTEMPTS: "3"
          OPENROUTER_RETRY_BASE_SECONDS: "0"
        run: |
          python -m py_compile src/editorial_gate_runner.py src/editorial_monitor.py src/hardened_monitor.py src/hardened_digest.py src/schedule_guard.py src/health_gate.py src/operational_selftest.py
          python src/production_selftest.py
          python src/hardening_selftest.py
          python src/operational_selftest.py

      - name: Inventory workflow triggers
        run: |
          python - <<'PY'
          from pathlib import Path
          for path in sorted(Path('.github/workflows').glob('*.yml')):
              text=path.read_text(encoding='utf-8')
              triggers=[]
              if '\n  schedule:' in text: triggers.append('schedule')
              if '\n  push:' in text: triggers.append('push')
              if '\n  workflow_dispatch:' in text: triggers.append('dispatch')
              if triggers:
                  print(f"WORKFLOW_TRIGGER {path}: {','.join(triggers)}")
          PY

      - name: Commit source hardening
        run: |
          git config user.name "skysakhnews-hardening"
          git config user.email "actions@github.com"
          find src -type d -name __pycache__ -prune -exec rm -rf {} +
          find src -type f -name '*.pyc' -delete
          git add src
          git commit -m "Harden state ownership, scheduling semantics and health gates"
          git pull --rebase --autostash origin main
          git push origin main
