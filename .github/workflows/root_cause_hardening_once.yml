name: SkySakhNews Root Cause Hardening Once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/root_cause_hardening_once.yml"

permissions:
  contents: write

concurrency:
  group: skysakhnews-root-cause-hardening
  cancel-in-progress: false

jobs:
  harden:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Apply root-cause hardening
        run: |
          python - <<'PY'
          from pathlib import Path

          def read(path):
              return Path(path).read_text(encoding="utf-8")

          def write(path, text):
              Path(path).write_text(text, encoding="utf-8")

          def replace_once(path, old, new):
              text = read(path)
              if old not in text:
                  raise SystemExit(f"pattern not found in {path}: {old[:120]!r}")
              write(path, text.replace(old, new, 1))

          # 1. Remove the retired OpenRouter model from every bounded fallback plan.
          replace_once(
              "src/editorial_gate_runner.py",
              '''    plan = []\n    for model in configured:\n        if model not in plan:\n            plan.append(model)\n    # Prefer the explicit free model that has proven stable in our live\n    # production runs; retain the OpenRouter free router as a second path.\n    for model in ("z-ai/glm-5.2:free", "openrouter/free"):\n        if model not in plan:\n            plan.append(model)\n\n    while len(plan) < max_attempts:\n        plan.append("openrouter/free")\n    return plan[:max_attempts]\n''',
              '''    retired = {"z-ai/glm-5.2:free"}\n    plan = []\n    for model in configured:\n        if model in retired:\n            continue\n        if model not in plan:\n            plan.append(model)\n    # Never silently switch to a paid model. The free router is the only\n    # implicit fallback; retired free model ids are skipped completely.\n    if "openrouter/free" not in plan:\n        plan.append("openrouter/free")\n\n    while len(plan) < max_attempts:\n        plan.append("openrouter/free")\n    return plan[:max_attempts]\n'''
          )

          # 2. Retry blocked production cheaply and quickly after a credential repair.
          replace_once(
              "src/schedule_guard.py",
              "PRODUCTION_HOURS = (7, 10, 13, 16, 19, 22)\n",
              "PRODUCTION_HOURS = (7, 10, 13, 16, 19, 22)\nBLOCKED_RETRY_COOLDOWN_MINUTES = 15\n",
          )
          p = "src/schedule_guard.py"
          text = read(p).replace("55 * 60", "BLOCKED_RETRY_COOLDOWN_MINUTES * 60")
          write(p, text)

          # 3. Make the independent monitor a reader by default, and report exact missed/blocked slots.
          replace_once(
              "src/editorial_monitor.py",
              "from datetime import datetime, timezone\n",
              "from datetime import datetime, timedelta, timezone\n",
          )
          replace_once(
              "src/editorial_monitor.py",
              'DIGEST_STATE_PATH = ROOT / "mobilization_digest_state.json"\n',
              'DIGEST_STATE_PATH = ROOT / "mobilization_digest_state.json"\nPRODUCTION_HOURS = (7, 10, 13, 16, 19, 22)\nPRODUCTION_SLOT_GRACE_MINUTES = 45\n',
          )
          replace_once(
              "src/editorial_monitor.py",
              '''def _active_recent_posts(state: Dict[str, Any]):\n''',
              '''def _latest_required_production_slot(now_local: datetime) -> Optional[datetime]:\n    candidates = []\n    for day_offset in (0, -1):\n        day = now_local.date() + timedelta(days=day_offset)\n        for hour in PRODUCTION_HOURS:\n            slot = datetime(day.year, day.month, day.day, hour, 0, tzinfo=now_local.tzinfo)\n            if slot + timedelta(minutes=PRODUCTION_SLOT_GRACE_MINUTES) <= now_local:\n                candidates.append(slot)\n    return max(candidates) if candidates else None\n\n\ndef _active_recent_posts(state: Dict[str, Any]):\n'''
          )
          replace_once(
              "src/editorial_monitor.py",
              "def run_monitor(*, mutate: bool = True) -> Dict[str, Any]:\n",
              "def run_monitor(*, mutate: bool = True, persist_state: bool = True) -> Dict[str, Any]:\n",
          )
          replace_once(
              "src/editorial_monitor.py",
              '''    if last_run_age is not None and last_run_age > freshness_limit:\n        issues.append({\n            "type": "publisher_stale",\n            "age_hours": last_run_age,\n            "limit_hours": freshness_limit,\n        })\n\n    unresolved = int(audit.get("unresolved") or 0)\n''',
              '''    if last_run_age is not None and last_run_age > freshness_limit:\n        issues.append({\n            "type": "publisher_stale",\n            "age_hours": last_run_age,\n            "limit_hours": freshness_limit,\n        })\n\n    latest_slot = _latest_required_production_slot(now_local)\n    attempt = state.get("last_production_attempt") or {}\n    finished = _parse_dt(run.get("finished_sakhalin"))\n    attempted = _parse_dt(attempt.get("checked_at_utc"))\n    if latest_slot is not None:\n        run_covers_slot = bool(finished and finished.astimezone(now_local.tzinfo) >= latest_slot)\n        blocked_covers_slot = bool(\n            attempt.get("status") == "blocked"\n            and attempted\n            and attempted.astimezone(now_local.tzinfo) >= latest_slot\n        )\n        if not run_covers_slot:\n            if blocked_covers_slot:\n                issues.append({\n                    "type": "publisher_blocked",\n                    "slot_sakhalin": latest_slot.isoformat(timespec="minutes"),\n                    "reason": attempt.get("reason"),\n                    "attempted_at_utc": attempt.get("checked_at_utc"),\n                })\n            else:\n                issues.append({\n                    "type": "publisher_slot_missed",\n                    "slot_sakhalin": latest_slot.isoformat(timespec="minutes"),\n                    "grace_minutes": PRODUCTION_SLOT_GRACE_MINUTES,\n                    "last_finished_sakhalin": run.get("finished_sakhalin"),\n                })\n\n    unresolved = int(audit.get("unresolved") or 0)\n'''
          )
          replace_once(
              "src/editorial_monitor.py",
              '''        "mobilization_digest": digest_health,\n''',
              '''        "last_production_attempt": state.get("last_production_attempt") or {},\n        "mobilization_digest": digest_health,\n'''
          )
          replace_once(
              "src/editorial_monitor.py",
              '''    state["continuous_editorial_monitor"] = report\n    _save_json(STATE_PATH, state)\n    _save_json(STATUS_PATH, report)\n    return report\n''',
              '''    mutated_state = bool((audit.get("corrected") or []) or (audit.get("deleted") or []))\n    if persist_state:\n        state["continuous_editorial_monitor"] = report\n        _save_json(STATE_PATH, state)\n    elif mutated_state:\n        _save_json(STATE_PATH, state)\n    _save_json(STATUS_PATH, report)\n    return report\n'''
          )

          # 4. Hardened monitor no longer writes state merely to mirror health status.
          replace_once(
              "src/hardened_monitor.py",
              "    if actions or failures:\n        _save(STATE_PATH, state)\n",
              "    if actions:\n        _save(STATE_PATH, state)\n",
          )
          replace_once(
              "src/hardened_monitor.py",
              "    report = editorial_monitor.run_monitor(mutate=mutate)\n",
              "    report = editorial_monitor.run_monitor(mutate=mutate, persist_state=False)\n",
          )
          replace_once(
              "src/hardened_monitor.py",
              '''    state = _load_state()\n    state["continuous_editorial_monitor"] = report\n    state["telegram_health"] = health\n    _save(STATE_PATH, state)\n    _save(STATUS_PATH, report)\n''',
              '''    _save(STATUS_PATH, report)\n'''
          )

          # 5. Dry-run digest must not depend on live Telegram credentials.
          replace_once(
              "src/hardened_digest.py",
              '''def main() -> int:\n    mode = final.resolved_mode()\n    health = telegram_health.check_telegram()\n''',
              '''def main() -> int:\n    mode = final.resolved_mode()\n    if __import__("os").getenv("DIGEST_DRY_RUN", "0") == "1":\n        return int(final.main() or 0)\n    health = telegram_health.check_telegram()\n'''
          )

          # 6. Separate workflow-execution health from feed/service health.
          health_gate = r'''from __future__ import annotations

import json
import sys
from datetime import datetime, timezone
from pathlib import Path
from typing import Any, Dict, List, Optional

import editorial_hardening

editorial_hardening.install()

ROOT = Path(__file__).resolve().parents[1]
STATE_PATH = ROOT / "state.json"
STATUS_PATH = ROOT / "monitor_status.json"
TELEGRAM_PATH = ROOT / "telegram_health.json"
MONITOR_MAX_AGE_MINUTES = 40


def _load(path: Path) -> Dict[str, Any]:
    if not path.exists():
        return {}
    try:
        value = json.loads(path.read_text(encoding="utf-8"))
        return value if isinstance(value, dict) else {}
    except Exception:
        return {}


def _parse(value: Any) -> Optional[datetime]:
    if not value:
        return None
    try:
        dt = datetime.fromisoformat(str(value).replace("Z", "+00:00"))
        return dt if dt.tzinfo else dt.replace(tzinfo=timezone.utc)
    except Exception:
        return None


def _dedupe(values: List[str]) -> List[str]:
    return list(dict.fromkeys(value for value in values if value))


def production_report(state=None, monitor=None, telegram=None) -> Dict[str, Any]:
    state = state if isinstance(state, dict) else _load(STATE_PATH)
    monitor = monitor if isinstance(monitor, dict) else _load(STATUS_PATH)
    telegram = telegram if isinstance(telegram, dict) else (_load(TELEGRAM_PATH) or state.get("telegram_health") or {})
    run = state.get("last_run") or {}
    critical: List[str] = []
    warnings: List[str] = []

    if telegram.get("status") != "healthy":
        critical.append("telegram_unhealthy:" + str(telegram.get("error_kind") or "unknown"))
    if run.get("version") != "stable-v12.1":
        critical.append("last_run_version_invalid")
    if run.get("status") != "ok":
        critical.append("last_run_not_ok")
    if not run.get("finished_sakhalin"):
        critical.append("last_run_missing_finished_sakhalin")

    stats = run.get("stats") or {}
    published = int(run.get("published") or 0)
    telegram_fail = int(stats.get("telegram_fail") or 0)
    if telegram_fail:
        critical.append(f"telegram_fail:{telegram_fail}")
    contract_blocked = int(stats.get("publication_contract_blocked") or 0)
    if contract_blocked:
        warnings.append(f"publication_contract_blocked:{contract_blocked}")

    media = run.get("media_policy") or {}
    if int(media.get("pending_ready") or 0) and published == 0:
        critical.append("pending_ready_but_nothing_published")
    if int(media.get("deferred_this_run") or 0):
        critical.append("delivery_deferred_this_run:" + str(media.get("deferred_this_run")))

    posts = (state.get("last_posts") or [])[-published:] if published else []
    groups = []
    for post in posts:
        contract = post.get("publication_contract") or {}
        if contract.get("approved") is not True or contract.get("issues"):
            critical.append("published_contract_invalid:" + str(post.get("title") or "")[:120])
        if not post.get("with_image") or not post.get("image_url") or not post.get("image_hash"):
            critical.append("published_media_invalid:" + str(post.get("title") or "")[:120])
        group = (post.get("news_director") or {}).get("group")
        if group:
            groups.append(str(group))
    if len(groups) == 2 and len(set(groups)) != 2:
        critical.append("published_group_diversity_failed:" + ",".join(groups))

    if monitor and monitor.get("status") != "healthy":
        warnings.append("feed_monitor_reports_problems")
    audit = monitor.get("post_audit") or {}
    if int(audit.get("unresolved") or 0):
        warnings.append("post_audit_unresolved:" + str(audit.get("unresolved")))
    if audit.get("failed_actions"):
        warnings.append("post_audit_failed_actions:" + str(len(audit.get("failed_actions") or [])))

    for item in [value for value in (state.get("pending_media_delivery") or []) if isinstance(value, dict)]:
        candidate = {
            "title": item.get("title"), "source_text": item.get("source_text"),
            "category_key": item.get("category_key"), "url": item.get("url"), "source": item.get("source"),
        }
        quality = editorial_hardening.content_quality_issues(candidate, item.get("row") or {})
        if quality:
            warnings.append("unsafe_pending:" + str(item.get("title") or "")[:80] + ":" + ",".join(quality))

    critical = _dedupe(critical)
    warnings = _dedupe(warnings)
    return {
        "mode": "production",
        "execution_status": "error" if critical else "healthy",
        "service_status": "error" if critical else ("degraded" if warnings else "healthy"),
        "critical": critical,
        "warnings": warnings,
    }


def monitor_report(status=None, *, now: Optional[datetime] = None) -> Dict[str, Any]:
    status = status if isinstance(status, dict) else _load(STATUS_PATH)
    now = now or datetime.now(timezone.utc)
    critical: List[str] = []
    warnings: List[str] = []

    if not status:
        critical.append("monitor_status_missing_or_invalid")
    else:
        checked = _parse(status.get("checked_at_utc"))
        if checked is None:
            critical.append("monitor_checked_at_missing_or_invalid")
        else:
            age_minutes = (now - checked.astimezone(timezone.utc)).total_seconds() / 60.0
            if age_minutes > MONITOR_MAX_AGE_MINUTES:
                critical.append(f"monitor_status_stale:{age_minutes:.1f}m")
        if status.get("publisher_version") != "stable-v12.1":
            critical.append("monitor_publisher_version_invalid")
        if not isinstance(status.get("post_audit"), dict):
            critical.append("monitor_post_audit_missing")

        if status.get("status") != "healthy":
            warnings.append("feed_status:" + str(status.get("status") or "unknown"))
        for item in status.get("issues") or []:
            if isinstance(item, dict):
                warnings.append("feed_issue:" + str(item.get("type") or "unknown"))
            else:
                warnings.append("feed_issue:" + str(item))
        audit = status.get("post_audit") or {}
        if int(audit.get("unresolved") or 0):
            warnings.append("post_audit_unresolved:" + str(audit.get("unresolved")))
        if audit.get("failed_actions"):
            warnings.append("post_audit_failed_actions:" + str(len(audit.get("failed_actions") or [])))

    critical = _dedupe(critical)
    warnings = _dedupe(warnings)
    return {
        "mode": "monitor",
        "execution_status": "error" if critical else "healthy",
        "feed_status": status.get("status") if status else "unknown",
        "critical": critical,
        "warnings": warnings,
    }


def production_issues() -> List[str]:
    return production_report()["critical"]


def monitor_issues() -> List[str]:
    return monitor_report()["critical"]


def main() -> int:
    mode = (sys.argv[1] if len(sys.argv) > 1 else "production").strip().lower()
    report = production_report() if mode == "production" else monitor_report()
    print(json.dumps(report, ensure_ascii=False, indent=2))
    return 0 if report.get("execution_status") == "healthy" else 1


if __name__ == "__main__":
    raise SystemExit(main())
'''
