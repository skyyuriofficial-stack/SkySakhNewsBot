              if '\n  schedule:' in text: triggers.append('schedule')
              if '\n  push:' in text: triggers.append('push')
              if '\n  workflow_dispatch:' in text: triggers.append('dispatch')
              if triggers:
                  print(f"WORKFLOW_TRIGGER {path}: {','.join(triggers)}")
