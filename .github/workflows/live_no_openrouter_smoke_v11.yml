name: SkySakhNews v11 live no-OpenRouter smoke test

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/live_no_openrouter_smoke_v11.yml"

permissions:
  contents: read

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile and run full regressions
        env:
          IMAGE_REQUIRED: "1"
          AI_CALL_BUDGET: "4"
          EDITORIAL_AUDIT_AI_BUDGET: "2"
          NEWS_DIRECTOR_AI_BUDGET: "0"
          OPENROUTER_MAX_ATTEMPTS: "3"
          OPENROUTER_RETRY_BASE_SECONDS: "0"
        run: |
          python -m py_compile src/production.py src/editorial_gate_runner.py src/publisher.py
          python src/production_selftest.py

      - name: Verify live Russian source path with OpenRouter unavailable
        env:
          PYTHONPATH: "src"
          IMAGE_REQUIRED: "1"
          AI_CALL_BUDGET: "4"
          EDITORIAL_AUDIT_AI_BUDGET: "2"
          NEWS_DIRECTOR_AI_BUDGET: "0"
          OPENROUTER_API_KEY: ""
          MAX_AGE_HOURS: "36"
          PYTHONUNBUFFERED: "1"
        run: |
          python - <<'PY'
          import json
          import publisher

          def forbidden_openrouter(*args, **kwargs):
              raise AssertionError("OpenRouter was called on the Russian extractive path")

          publisher.core.b.openrouter = forbidden_openrouter

          state = publisher.core.b.load_state()
          candidates = publisher.core.b.collect(state)
          assert candidates, "No live candidates were collected"

          accepted = None
          examined = 0
          for candidate in candidates:
              if candidate.get("category_key") not in {"sakh", "sakh_chp", "sakh_quake", "ru_pol", "ru_eco"}:
                  continue
              source_text = (
                  str(candidate.get("title") or "")
                  + " "
                  + str(candidate.get("source_text") or "")
              )
              if publisher.core.b.ratio_latin(source_text) > 0.12:
                  continue
              examined += 1
              row = publisher.prod.valid_post_v99(candidate)
              if not row:
                  continue
              review = publisher.media.editorial._review(candidate, row)
              if review.get("approved") is True:
                  accepted = {
                      "title": candidate.get("title"),
                      "category_key": candidate.get("category_key"),
                      "source": candidate.get("source"),
                      "editorial_mode": row.get("editorial_mode"),
                      "review_mode": review.get("mode"),
                      "title_matches_source": review.get("title_matches_source"),
                      "category_matches_story": review.get("category_matches_story"),
                  }
                  break

          assert examined > 0, "No Russian live candidate reached extractive validation"
          assert accepted is not None, "No Russian live candidate passed without OpenRouter"
          assert accepted["editorial_mode"] == "extractive_fallback", accepted
          assert accepted["review_mode"] == "deterministic+extractive", accepted
          assert int(publisher.core.b.STATS.get("ai_calls") or 0) == 0, publisher.core.b.STATS
          assert int(publisher.core.b.STATS.get("director_ai_calls") or 0) == 0, publisher.core.b.STATS
          assert int(publisher.core.b.STATS.get("editorial_gate_ai_calls") or 0) == 0, publisher.core.b.STATS
          print("LIVE_NO_OPENROUTER_SMOKE_OK")
          print(json.dumps(accepted, ensure_ascii=False, indent=2))
          PY
