name: SkySakhNews v11 live no-OpenRouter smoke test

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/live_no_openrouter_smoke_v11.yml"

permissions:
  contents: read

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile and run full regressions
        env:
          IMAGE_REQUIRED: "1"
          AI_CALL_BUDGET: "4"
          EDITORIAL_AUDIT_AI_BUDGET: "2"
          NEWS_DIRECTOR_AI_BUDGET: "0"
          OPENROUTER_MAX_ATTEMPTS: "3"
          OPENROUTER_RETRY_BASE_SECONDS: "0"
        run: |
          python -m py_compile src/production.py src/editorial_gate_runner.py src/publisher.py
          python src/production_selftest.py

      - name: Verify a live clean Russian source path with OpenRouter unavailable
        env:
          PYTHONPATH: "src"
          IMAGE_REQUIRED: "1"
          AI_CALL_BUDGET: "4"
          EDITORIAL_AUDIT_AI_BUDGET: "2"
          NEWS_DIRECTOR_AI_BUDGET: "0"
          OPENROUTER_API_KEY: ""
          MAX_AGE_HOURS: "36"
          PYTHONUNBUFFERED: "1"
        run: |
          python - <<'PY'
          import json
          import publisher

          state = publisher.core.b.load_state()
          candidates = publisher.core.b.collect(state)
          assert candidates, "No live candidates were collected"

          chosen = None
          examined = 0
          for candidate in candidates:
              source_text = (
                  str(candidate.get("title") or "")
                  + " "
                  + str(candidate.get("source_text") or "")
              )
              if publisher.core.b.ratio_latin(source_text) > 0.12:
                  continue

              examined += 1
              row = publisher.prod.valid_post_v99(candidate)
              if not row or row.get("editorial_mode") != "extractive_fallback":
                  continue

              deterministic = publisher.media.editorial.gate.deterministic_review(
                  candidate,
                  row,
              )
              hard_issues = [
                  issue
                  for issue in deterministic.get("issues", [])
                  if not str(issue).startswith("title_category_weak:")
              ]
              deterministic_pass = (
                  not hard_issues
                  and deterministic.get("source_is_russian") is True
                  and deterministic.get("approved") is True
                  and int(deterministic.get("title_matches_source") or 0) >= 90
                  and int(deterministic.get("category_matches_story") or 0) >= 90
                  and deterministic.get("facts_supported") is True
                  and deterministic.get("meaning_changed") is False
              )
              if deterministic_pass:
                  chosen = (candidate, row, deterministic)
                  break

          assert examined > 0, "No Russian live candidate reached extractive validation"
          assert chosen is not None, "No clean Russian live candidate was found"

          candidate, row, deterministic = chosen

          def forbidden_openrouter(*args, **kwargs):
              raise AssertionError("OpenRouter was called on a clean Russian extractive path")

          publisher.core.b.openrouter = forbidden_openrouter
          calls_before = int(
              publisher.core.b.STATS.get("editorial_gate_ai_calls") or 0
          )
          review = publisher.media.editorial._review(candidate, row)
          calls_after = int(
              publisher.core.b.STATS.get("editorial_gate_ai_calls") or 0
          )

          accepted = {
              "title": candidate.get("title"),
              "category_key": candidate.get("category_key"),
              "source": candidate.get("source"),
              "editorial_mode": row.get("editorial_mode"),
              "review_mode": review.get("mode"),
              "title_matches_source": review.get("title_matches_source"),
              "category_matches_story": review.get("category_matches_story"),
              "editorial_ai_calls_delta": calls_after - calls_before,
          }

          assert review.get("approved") is True, review
          assert review.get("mode") == "deterministic+extractive", review
          assert calls_after == calls_before, accepted
          assert int(publisher.core.b.STATS.get("ai_calls") or 0) == 0, publisher.core.b.STATS
          assert int(publisher.core.b.STATS.get("director_ai_calls") or 0) == 0, publisher.core.b.STATS
          print("LIVE_NO_OPENROUTER_SMOKE_OK")
          print(json.dumps(accepted, ensure_ascii=False, indent=2))
          PY
