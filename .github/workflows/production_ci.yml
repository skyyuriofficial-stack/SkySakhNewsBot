name: SkySakhNews Production CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "src/news_bot_v8.py"
      - "src/news_bot_v9.py"
      - "src/production.py"
      - "requirements.txt"
      - ".github/workflows/auto_publish_v7.yml"
      - ".github/workflows/production_ci.yml"

permissions:
  contents: read

concurrency:
  group: skysakhnews-production-ci
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile and regression tests
        env:
          IMAGE_REQUIRED: "0"
          AI_CALL_BUDGET: "8"
          RUN_COOLDOWN_MINUTES: "20"
        run: |
          python -m py_compile src/news_bot_v8.py src/news_bot_v9.py src/production.py
          python - <<'PY'
          import sys
          sys.path.insert(0, "src")
          import production as prod
          core = prod.core
          assert prod.VERSION == "stable-v9.9"
          assert core.VERSION == "stable-v9.9"
          assert core.strict_fresh(None) is False
          assert prod.AI_CALL_BUDGET == 8
          assert prod.RUN_COOLDOWN_MINUTES == 20
          assert "ru_incident" in core.b.CAT

          cases = [
              ("ru", "Трамп рассматривает отсрочку введения пошлин в 50% в отношении Канады", "Президент США рассматривает отсрочку пошлин в отношении Канады.", "https://www.interfax.ru/world/1110016", {"geo", None}),
              ("ru", "Аэропорт временно ограничил прием самолетов из-за угрозы БПЛА", "Росавиация сообщила об ограничениях.", "https://www.interfax.ru/russia/1110011", {"ru_security"}),
              ("ru", "Ребенок погиб в Ростовской области, упав за борт катера", "Следователи устанавливают обстоятельства происшествия на воде.", "https://www.interfax.ru/russia/1110068", {"ru_incident"}),
              ("sakhalin", "Сильный дождь пройдет в центральных районах Сахалина 20 августа", "Сахалинское УГМС прогнозирует сильный дождь и осадки.", "https://sakhalinmedia.ru/news/2593484/", {"sakh"}),
          ]
          for src_type, title, text, url, allowed in cases:
              cat, _, _ = prod.classify_v99(src_type, 90, title, text, "", url)
              assert cat in allowed, (title, cat, allowed)

          ok, why = prod.valid_source_stream_v99({
              "category_key": "ru_pol",
              "source": "Interfax",
              "url": "https://www.interfax.ru/russia/1110068",
              "title": "Ребенок погиб в Ростовской области",
              "source_text": "Следователи устанавливают обстоятельства происшествия."
          })
          assert not ok and why == "politics_without_politics_marker"

          sentences = prod._sentence_candidates(
              "В полиции возбудили уголовное дело против 50-летнего жителя. "
              "Его подозревают в краже почти 40 тыс. рублей с банковской карты приятеля, сообщает УМВД. "
              "Сумма ущерба составила 38 760 рублей."
          )
          assert any(s.startswith("Его подозревают") and "40 тыс. рублей" in s for s in sentences), sentences
          assert not any(s.startswith("рублей") for s in sentences), sentences

          duplicated = "Медведь напал на двух мужчин в лесу, сообщили в МВД Медведь напал на двух мужчин в лесу, сообщили в МВД."
          deduped = prod._sentence_candidates(duplicated)
          assert deduped and deduped[0].count("Медведь напал") == 1, deduped

          fallback = prod._extractive_fallback({
              "category_key": "sakh_chp",
              "footer": "ЧП | САХАЛИН",
              "title": "Житель Долинска украл карту у приятеля - SakhalinMedia.ru",
              "source_text": (
                  "В полиции Долинска возбудили уголовное дело против неоднократно судимого 50-летнего местного жителя. "
                  "Его подозревают в краже почти 40 тыс. рублей с банковской карты приятеля, сообщает пресс-служба УМВД России по Сахалинской области. "
                  "Сумма ущерба составила 38 760 рублей."
              )
          })
          assert fallback
          assert all(not x.startswith("рублей") for x in fallback["body"]), fallback
          assert "SakhalinMedia" not in fallback["title_ru"]
          print("stable-v9.9 deterministic regression tests: OK")
          PY
