name: SkySakhNews Production CI v10.3

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/news_bot_v8.py"
      - "src/news_bot_v9.py"
      - "src/production.py"
      - "src/editorial_gate.py"
      - "src/category_reconciler.py"
      - "src/editorial_gate_runner.py"
      - "src/media_enforced_runner.py"
      - "requirements.txt"
      - ".github/workflows/auto_publish_v7.yml"
      - ".github/workflows/production_ci.yml"

permissions:
  contents: read

concurrency:
  group: skysakhnews-production-ci
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile current production chain
        run: |
          python -m py_compile \
            src/news_bot_v8.py \
            src/news_bot_v9.py \
            src/production.py \
            src/editorial_gate.py \
            src/category_reconciler.py \
            src/editorial_gate_runner.py \
            src/media_enforced_runner.py

      - name: Semantic and mandatory-media regression suite
        env:
          IMAGE_REQUIRED: "1"
          AI_CALL_BUDGET: "8"
          EDITORIAL_AUDIT_AI_BUDGET: "4"
          RUN_COOLDOWN_MINUTES: "20"
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, "src")

          import category_reconciler as rec
          import editorial_gate as gate
          import media_enforced_runner as runner

          assert runner.VERSION == "stable-v10.3"
          assert runner.core.b.IMAGE_REQUIRED is True

          def c(title, text, source="Interfax", url="https://www.interfax.ru/russia/1", category="sakh"):
              return {
                  "title": title,
                  "source_text": text,
                  "source": source,
                  "url": url,
                  "category_key": category,
                  "category": category,
              }

          expected = [
              (c("В парламенте Ирана заявили, что давление на Тегеран не поможет США заключить соглашение",
                 "Иран и США обсуждают условия.", url="https://www.interfax.ru/world/1"), "geo"),
              (c("Сильный дождь пройдет в центральных районах Сахалина",
                 "Сахалинское УГМС прогнозирует осадки.", source="SakhalinMedia.ru",
                 url="https://sakhalinmedia.ru/news/1/"), "sakh"),
              (c("Ребенок погиб, упав за борт катера",
                 "Следователи устанавливают обстоятельства."), "ru_incident"),
              (c("Аэропорт ограничил работу из-за угрозы БПЛА",
                 "Росавиация сообщила об ограничениях."), "ru_security"),
              (c("История магнитных лент", "Материал об аналоговом аудио.",
                 source="Habr", url="https://habr.com/ru/articles/1/"), None),
          ]
          for item, wanted in expected:
              got = rec.suggest_category(item)
              assert got == wanted, (item["title"], got, wanted)

          item = c(
              "Правительство рассматривает возможность введения меры",
              "Предложение обсуждается, решение не принято.",
              category="ru_pol",
          )
          verdict = gate.deterministic_review(
              item,
              {"title_ru": "Правительство ввело меру", "body": [], "editorial_mode": "generated"},
          )
          assert not verdict["approved"] and verdict["meaning_changed"], verdict

          source_photo = {
              "image": b"x" * 12000,
              "image_url": "https://sakhalinmedia.ru/f/big/story.jpg",
              "image_hash": "1" * 40,
          }
          assert runner._is_source_media(source_photo) == (True, "source_article_or_feed")
          assert runner._is_source_media({})[0] is False
          assert runner._is_source_media({
              **source_photo,
              "image_url": "https://upload.wikimedia.org/generic.jpg",
          })[0] is False
          assert runner.block_text_publication({}, {"title": "test"}).get("ok") is False

          print("stable-v10.3 semantic and mandatory-media regression suite: OK")
          PY
