name: SkySakhNews Production CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "src/news_bot_v8.py"
      - "src/news_bot_v9.py"
      - "src/production.py"
      - "src/editorial_gate.py"
      - "src/category_reconciler.py"
      - "src/editorial_gate_runner.py"
      - "requirements.txt"
      - ".github/workflows/auto_publish_v7.yml"
      - ".github/workflows/production_ci.yml"

permissions:
  contents: read

concurrency:
  group: skysakhnews-production-ci
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile and semantic regressions
        env:
          IMAGE_REQUIRED: "0"
          AI_CALL_BUDGET: "8"
          EDITORIAL_AUDIT_AI_BUDGET: "4"
          RUN_COOLDOWN_MINUTES: "20"
        run: |
          python -m py_compile src/news_bot_v8.py src/news_bot_v9.py src/production.py src/editorial_gate.py src/category_reconciler.py src/editorial_gate_runner.py
          python - <<'PY'
          import sys
          sys.path.insert(0, "src")
          import editorial_gate as gate
          import category_reconciler as rec
          import editorial_gate_runner as runner

          assert runner.VERSION == "stable-v10.1"
          assert runner.core.strict_fresh(None) is False

          def c(cat, source, title, text, url):
              return {"category_key":cat,"category":cat,"source":source,"title":title,"source_text":text,"url":url}

          historical = [
              (c("sakh","Interfax","В парламенте Ирана заявили, что давление на Тегеран не поможет США заключить соглашение","Иран и США обсуждают соглашение.","https://www.interfax.ru/world/1110010"), "geo"),
              (c("ru_eco","Interfax","Трамп рассматривает отсрочку введения пошлин в 50% в отношении Канады","Президент США рассматривает отсрочку пошлин для Канады.","https://www.interfax.ru/world/1110016"), "geo"),
              (c("sakh_chp","SakhalinMedia.ru","Сильный дождь пройдет в центральных районах Сахалина 20 августа","Сахалинское УГМС прогнозирует сильный дождь и осадки.","https://sakhalinmedia.ru/news/2593484/"), "sakh"),
              (c("ru_pol","Interfax","Ребенок погиб в Ростовской области, упав за борт катера","Следователи устанавливают обстоятельства происшествия.","https://www.interfax.ru/russia/1110068"), "ru_incident"),
              (c("ru_pol","TASS","Дмитриев считает, что Федоров бросил вызов Зеленскому призывами к выборам","Высказывание касается украинской политики и выборов на Украине.","https://tass.ru/politika/28023743"), "geo"),
              (c("ru_pol","Interfax","Аэропорт временно ограничил прием самолетов из-за угрозы БПЛА","Росавиация сообщила об ограничениях из-за угрозы БПЛА.","https://www.interfax.ru/russia/1110011"), "ru_security"),
          ]
          for item, expected in historical:
              got = rec.suggest_category(item)
              assert got == expected, (item["title"], got, expected)

          # Meaning strengthening is forbidden.
          item = c("ru_eco","Interfax","Правительство рассматривает возможность введения новой меры","Власти обсуждают предложение, окончательное решение не принято.","https://www.interfax.ru/russia/1")
          r = gate.deterministic_review(item, {"title_ru":"Правительство ввело новую меру","body":[],"editorial_mode":"generated"})
          assert not r["approved"] and r["meaning_changed"], r

          # A number absent from source is forbidden.
          item = c("sakh_chp","SakhalinMedia.ru","В Долинске расследуют кражу","Полиция Долинска расследует кражу банковской карты.","https://sakhalinmedia.ru/news/1/")
          r = gate.deterministic_review(item, {"title_ru":"В Долинске расследуют кражу на 50 тысяч рублей","body":[],"editorial_mode":"generated"})
          assert not r["facts_supported"] and not r["approved"], r

          print("stable-v10.1 semantic regression suite: OK")
          PY
