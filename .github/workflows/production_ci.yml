name: SkySakhNews Production CI v12.1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/news_bot_v8.py"
      - "src/news_bot_v9.py"
      - "src/production.py"
      - "src/editorial_gate.py"
      - "src/editorial_policy.py"
      - "src/category_reconciler.py"
      - "src/editorial_gate_runner.py"
      - "src/media_enforced_runner.py"
      - "src/news_director.py"
      - "src/publication_auditor.py"
      - "src/editorial_monitor.py"
      - "src/publisher.py"
      - "src/production_selftest.py"
      - "requirements.txt"
      - ".github/workflows/auto_publish_v7.yml"
      - ".github/workflows/editorial_monitor.yml"
      - ".github/workflows/production_ci.yml"

permissions:
  contents: read

concurrency:
  group: skysakhnews-production-ci-v121
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile canonical v12.1 chain
        run: |
          python -m py_compile \
            src/news_bot_v8.py src/news_bot_v9.py src/production.py \
            src/editorial_gate.py src/editorial_policy.py src/category_reconciler.py \
            src/editorial_gate_runner.py src/media_enforced_runner.py \
            src/news_director.py src/publication_auditor.py \
            src/editorial_monitor.py src/publisher.py src/production_selftest.py

      - name: Run exact feed, category, balance, title and post-audit regressions
        env:
          IMAGE_REQUIRED: "1"
          AI_CALL_BUDGET: "0"
          EDITORIAL_AUDIT_AI_BUDGET: "0"
          NEWS_DIRECTOR_AI_BUDGET: "0"
          POST_AUDIT_AUTOCORRECT: "0"
          RUN_COOLDOWN_MINUTES: "0"
          MEDIA_PENDING_MAX_HOURS: "36"
          MEDIA_PENDING_MAX_ITEMS: "24"
          OPENROUTER_MAX_ATTEMPTS: "3"
          OPENROUTER_RETRY_BASE_SECONDS: "0"
        run: python src/production_selftest.py
