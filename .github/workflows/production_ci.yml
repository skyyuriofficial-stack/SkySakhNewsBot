name: SkySakhNews Production CI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/news_bot_v8.py"
      - "src/news_bot_v9.py"
      - "src/production.py"
      - "src/editorial_gate.py"
      - "src/category_reconciler.py"
      - "src/editorial_gate_runner.py"
      - "requirements.txt"
      - ".github/workflows/auto_publish_v7.yml"
      - ".github/workflows/production_ci.yml"

permissions:
  contents: read

concurrency:
  group: skysakhnews-production-ci
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile
        run: |
          python -m py_compile \
            src/news_bot_v8.py \
            src/news_bot_v9.py \
            src/production.py \
            src/editorial_gate.py \
            src/category_reconciler.py \
            src/editorial_gate_runner.py

      - name: Semantic regression suite
        env:
          IMAGE_REQUIRED: "0"
          AI_CALL_BUDGET: "8"
          EDITORIAL_AUDIT_AI_BUDGET: "4"
          RUN_COOLDOWN_MINUTES: "20"
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, "src")
          import editorial_gate as gate
          import category_reconciler as rec
          import editorial_gate_runner as runner

          assert runner.VERSION == "stable-v10.2"
          assert runner.prod.VERSION == "stable-v10.2"
          assert runner.core.VERSION == "stable-v10.2"

          def c(title, text, source="Interfax", url="https://www.interfax.ru/russia/1", category="sakh"):
              return {
                  "title": title, "source_text": text, "source": source,
                  "url": url, "category_key": category, "category": category,
              }

          expected = [
              (c("В парламенте Ирана заявили, что давление на Тегеран не поможет США заключить соглашение",
                 "Иран и США обсуждают условия.", url="https://www.interfax.ru/world/1110010"), "geo"),
              (c("Трамп рассматривает отсрочку пошлин для Канады",
                 "Президент США обсуждает пошлины.", url="https://www.interfax.ru/world/1110016"), "geo"),
              (c("Сильный дождь пройдет в центральных районах Сахалина",
                 "Сахалинское УГМС прогнозирует осадки.", source="SakhalinMedia.ru",
                 url="https://sakhalinmedia.ru/news/1/"), "sakh"),
              (c("Ребенок погиб, упав за борт катера",
                 "Следователи устанавливают обстоятельства.", url="https://www.interfax.ru/russia/2"), "ru_incident"),
              (c("Аэропорт ограничил работу из-за угрозы БПЛА",
                 "Росавиация сообщила об ограничениях.", url="https://www.interfax.ru/russia/3"), "ru_security"),
              (c("История магнитных лент", "Материал об аналоговом аудио.",
                 source="Habr", url="https://habr.com/ru/articles/1/"), None),
              (c("Мэр Хабаровска рассказал об остановке", "Работы идут в Хабаровске.",
                 source="SakhalinMedia.ru", url="https://sakhalinmedia.ru/news/2/"), None),
              (c("Японист РАН: Токио наказывает Россию за Украину, но держит Китай",
                 "В статье упоминаются Курильские острова.",
                 url="https://www.interfax.ru/world/1110153"), "geo"),
              (c("Нефть слабо дорожает, Brent торгуется у $91,7 за баррель",
                 "Мировые цены растут на ICE Futures.",
                 url="https://www.interfax.ru/business/1110251", category="ru_eco"), "geo"),
          ]
          for item, wanted in expected:
              got = rec.suggest_category(item)
              assert got == wanted, (item["title"], got, wanted)

          assert "it" not in gate.infer_topics("В полиции России сообщили о расследовании")
          assert "local" not in gate.infer_topics(
              "Мэр Хабаровска рассказал о благоустройстве",
              "SakhalinMedia.ru",
              "https://sakhalinmedia.ru/news/2/",
          )

          item = c(
              "Правительство рассматривает возможность введения меры",
              "Предложение обсуждается, решение не принято.",
              category="ru_pol",
          )
          verdict = gate.deterministic_review(
              item,
              {"title_ru": "Правительство ввело меру", "body": [], "editorial_mode": "generated"},
          )
          assert not verdict["approved"] and verdict["meaning_changed"], verdict

          print("stable-v10.2 semantic regression suite: OK")
          PY
