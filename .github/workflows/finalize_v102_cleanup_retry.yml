name: Finalize stable v10.2 quality release retry

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/finalize_v102_cleanup_retry.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate proof and create canonical status
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          pass_path = Path('FINAL_QUALITY_PASS.json')
          status_path = Path('QUALITY_STATUS.json')
          if pass_path.exists():
              proof = json.loads(pass_path.read_text(encoding='utf-8'))
              assert proof.get('version') == 'stable-v10.2', proof
              assert proof.get('all_pass') is True, proof
              assert int(proof.get('failed') or 0) == 0, proof
              assert int(proof.get('candidate_violations') or 0) == 0, proof
              status = {
                  'version': 'stable-v10.2',
                  'quality_gate': 'passed',
                  'all_pass': True,
                  'passed_checks': proof.get('passed'),
                  'failed_checks': 0,
                  'candidate_count': proof.get('candidate_count'),
                  'reconciled_count': proof.get('reconciled_count'),
                  'offtopic_rejected': proof.get('offtopic_count'),
                  'candidate_violations': 0,
                  'run_error': None,
                  'verified_by': 'live sources + dry Telegram + mandatory semantic gate',
              }
              status_path.write_text(json.dumps(status, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          else:
              assert status_path.exists(), 'Neither final PASS proof nor QUALITY_STATUS exists'
              status = json.loads(status_path.read_text(encoding='utf-8'))
              assert status.get('version') == 'stable-v10.2', status
              assert status.get('all_pass') is True, status
              assert int(status.get('failed_checks') or 0) == 0, status
              assert int(status.get('candidate_violations') or 0) == 0, status
          print(json.dumps(status, ensure_ascii=False, indent=2))
          PY

      - name: Ensure permanent manual audit workflow
        run: |
          cat > .github/workflows/run_editorial_audit_once.yml <<'YAML'
          name: SkySakhNews Manual Quality Audit v10.2

          on:
            workflow_dispatch:

          permissions:
            contents: read

          jobs:
            audit:
              runs-on: ubuntu-latest
              timeout-minutes: 35
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-python@v5
                  with:
                    python-version: "3.11"
                - name: Install dependencies
                  run: |
                    python -m pip install --upgrade pip
                    pip install -r requirements.txt
                - name: Run live-source dry quality audit
                  env:
                    IMAGE_REQUIRED: "0"
                    POSTS_PER_RUN: "2"
                    MAX_AGE_HOURS: "36"
                    AI_CALL_BUDGET: "0"
                    EDITORIAL_AUDIT_AI_BUDGET: "0"
                    RUN_COOLDOWN_MINUTES: "0"
                    FORCE_RUN: "1"
                    PYTHONUNBUFFERED: "1"
                  run: |
                    python -m py_compile src/news_bot_v8.py src/news_bot_v9.py src/production.py src/editorial_gate.py src/category_reconciler.py src/editorial_gate_runner.py src/quality_audit.py
                    python src/quality_audit.py
          YAML

      - name: Remove all temporary release workflows and logs
        run: |
          git rm -f --ignore-unmatch \
            .github/workflows/apply_v102_strict_patch.yml \
            .github/workflows/apply_v102_local_geography_patch.yml \
            .github/workflows/final_quality_audit_v102.yml \
            .github/workflows/final_quality_proof_v102.yml \
            .github/workflows/final_quality_proof_v102_rerun.yml \
            .github/workflows/final_quality_proof_v102_final.yml \
            .github/workflows/finalize_v102_cleanup.yml \
            .github/workflows/finalize_v102_cleanup_retry.yml \
            final_quality_report.json \
            final_quality_audit.log \
            FINAL_QUALITY_PASS.json \
            FINAL_QUALITY_FAIL.json \
            v10_editorial_audit_report.json \
            editorial_audit.log

      - name: Commit finalized release
        run: |
          git config user.name "skysakhnews-bot"
          git config user.email "actions@github.com"
          git add QUALITY_STATUS.json .github/workflows/run_editorial_audit_once.yml
          if git diff --cached --quiet; then
            echo "Release already finalized"
          else
            git commit -m "Finalize stable v10.2 verified production release"
            git pull --rebase --autostash origin main
            git push origin main
          fi
