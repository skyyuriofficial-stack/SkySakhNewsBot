name: SkySakhNews v12.1 Immediate Editorial Repair

on:
  push:
    branches: [main]
    paths: [".github/workflows/run_monitor_once_v121.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: skysakhnews-editorial-monitor
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Regression gate
        env:
          IMAGE_REQUIRED: "1"
          AI_CALL_BUDGET: "0"
          EDITORIAL_AUDIT_AI_BUDGET: "0"
          NEWS_DIRECTOR_AI_BUDGET: "0"
          POST_AUDIT_AUTOCORRECT: "0"
          RUN_COOLDOWN_MINUTES: "0"
        run: python src/production_selftest.py
      - name: Repair actual Telegram feed
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          POST_AUDIT_AUTOCORRECT: "1"
          IMAGE_REQUIRED: "1"
          AI_CALL_BUDGET: "0"
          EDITORIAL_AUDIT_AI_BUDGET: "0"
          NEWS_DIRECTOR_AI_BUDGET: "0"
          PYTHONUNBUFFERED: "1"
        run: python src/editorial_monitor.py
      - name: Commit repaired state
        if: always()
        run: |
          git config user.name "skysakhnews-monitor"
          git config user.email "actions@github.com"
          git add state.json monitor_status.json
          if git diff --cached --quiet; then
            echo "No repair state changes"
          else
            git commit -m "Repair and audit recent Telegram feed with v12.1"
            git pull --rebase --autostash origin main
            git push origin main
          fi
      - name: Require clean v12 feed
        run: |
          python - <<'PY'
          import json
          with open("monitor_status.json", "r", encoding="utf-8") as f:
              s = json.load(f)
          assert s.get("publisher_version") == "stable-v12.1", s
          assert int((s.get("post_audit") or {}).get("unresolved") or 0) == 0, s
          assert not (s.get("post_audit") or {}).get("failed_actions"), s
          assert s.get("status") == "healthy", s
          print("IMMEDIATE V12.1 FEED REPAIR: HEALTHY")
          PY
