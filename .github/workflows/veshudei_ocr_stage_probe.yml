name: Veshudei OCR Stage Probe
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/veshudei_ocr_stage_probe.yml"
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Files
        run: curl -L -sS --max-time 20 "https://sky-sakh-news-bot.vercel.app/api/ocrtest?stage=files"
      - name: Worker
        run: curl -L -sS --max-time 35 "https://sky-sakh-news-bot.vercel.app/api/ocrtest?stage=worker"
