name: SkySakhNews Auto Publisher Stable v9.9

on:
  workflow_dispatch:
  schedule:
    # UTC; Sakhalin = UTC+11: 07:00, 10:00, 13:00, 16:00, 19:00, 22:00
    - cron: "0 2,5,8,11,20,23 * * *"

permissions:
  contents: write

concurrency:
  group: skysakhnews-production-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile and deterministic production gate
        env:
          IMAGE_REQUIRED: "0"
          AI_CALL_BUDGET: "8"
          RUN_COOLDOWN_MINUTES: "20"
        run: |
          python -m py_compile src/news_bot_v8.py src/news_bot_v9.py src/production.py
          python - <<'PY'
          import sys
          sys.path.insert(0, "src")
          import production as prod
          core = prod.core

          assert prod.VERSION == "stable-v9.9"
          assert core.VERSION == "stable-v9.9"
          assert core.strict_fresh(None) is False
          assert core.b.IMAGE_REQUIRED is False
          assert "ru_incident" in core.b.CAT
          assert prod.AI_CALL_BUDGET == 8
          assert prod.RUN_COOLDOWN_MINUTES == 20

          cat, _, _ = prod.classify_v99(
              "ru", 78,
              "Трамп рассматривает отсрочку введения пошлин в 50% в отношении Канады",
              "Президент США рассматривает отсрочку пошлин в отношении Канады.",
              "",
              "https://www.interfax.ru/world/1110016",
          )
          assert cat not in {"ru_eco", "ru_pol", "ru_security", "ru_incident"}

          cat, _, _ = prod.classify_v99(
              "ru", 78,
              "Аэропорт временно ограничил прием самолетов из-за угрозы БПЛА",
              "Росавиация сообщила об ограничениях.",
              "",
              "https://www.interfax.ru/russia/1110011",
          )
          assert cat == "ru_security"

          cat, _, _ = prod.classify_v99(
              "ru", 78,
              "Ребенок погиб в Ростовской области, упав за борт катера",
              "Следователи устанавливают обстоятельства происшествия на воде.",
              "",
              "https://www.interfax.ru/russia/1110068",
          )
          assert cat == "ru_incident"

          cat, _, _ = prod.classify_v99(
              "sakhalin", 102,
              "Сильный дождь пройдет в центральных районах Сахалина 20 августа",
              "Сахалинское УГМС прогнозирует сильный дождь и осадки.",
              "",
              "https://sakhalinmedia.ru/news/2593484/",
          )
          assert cat == "sakh"

          # Abbreviations must not create broken paragraphs such as "рублей с карты...".
          sentences = prod._sentence_candidates(
              "В полиции возбудили уголовное дело против 50-летнего жителя. "
              "Его подозревают в краже почти 40 тыс. рублей с банковской карты приятеля, сообщает УМВД. "
              "Сумма ущерба составила 38 760 рублей."
          )
          assert any(s.startswith("Его подозревают") and "40 тыс. рублей" in s for s in sentences), sentences
          assert not any(s.startswith("рублей") for s in sentences), sentences

          # Adjacent duplicated source summaries must collapse to one clean sentence.
          duplicated = (
              "Медведь напал на двух мужчин в лесу, сообщили в МВД Медведь напал на двух мужчин в лесу, сообщили в МВД."
          )
          deduped = prod._sentence_candidates(duplicated)
          assert deduped and deduped[0].count("Медведь напал") == 1, deduped

          fallback = prod._extractive_fallback({
              "category_key": "sakh_chp",
              "footer": "ЧП | САХАЛИН",
              "title": "Житель Долинска украл карту у приятеля - SakhalinMedia.ru",
              "source_text": (
                  "В полиции Долинска возбудили уголовное дело против неоднократно судимого 50-летнего местного жителя. "
                  "Его подозревают в краже почти 40 тыс. рублей с банковской карты приятеля, сообщает пресс-служба УМВД России по Сахалинской области. "
                  "Сумма ущерба составила 38 760 рублей."
              )
          })
          assert fallback
          assert all(not x.startswith("рублей") for x in fallback["body"]), fallback
          assert "SakhalinMedia" not in fallback["title_ru"]

          print("production gate stable-v9.9: OK")
          PY

      - name: Run stable publisher
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ secrets.OPENROUTER_MODEL }}
          IMAGE_REQUIRED: "0"
          POSTS_PER_RUN: "2"
          MAX_AGE_HOURS: "36"
          AI_CALL_BUDGET: "8"
          RUN_COOLDOWN_MINUTES: "20"
          PYTHONUNBUFFERED: "1"
        run: |
          python src/production.py

      - name: Verify run health
        run: |
          python - <<'PY'
          import json
          with open("state.json", "r", encoding="utf-8") as f:
              state = json.load(f)
          run = state.get("last_run") or {}
          # A cooldown skip intentionally leaves the previous successful run intact.
          if run.get("version") == "stable-v9.9":
              assert run.get("status") == "ok", run
              assert "finished_sakhalin" in run, run
              local = run.get("local_stream") or {}
              assert local.get("status") in {"healthy", "degraded"}, local
              stats = run.get("stats") or {}
              assert stats.get("ai_calls", 0) <= 8, stats
          print("run health: OK", run)
          PY

      - name: Commit state and health
        if: always()
        run: |
          git config user.name "skysakhnews-bot"
          git config user.email "actions@github.com"
          git add state.json
          if git diff --cached --quiet; then
            echo "No state changes"
          else
            git commit -m "Update news state and health"
            git pull --rebase --autostash origin main
            git push origin main
          fi
