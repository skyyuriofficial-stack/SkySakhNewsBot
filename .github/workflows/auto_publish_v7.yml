name: SkySakhNews Auto Publisher Stable v12.1

on:
  workflow_dispatch:
  schedule:
    # Recovery pulses every 10 minutes in the active Sakhalin window.
    # schedule_guard.py preserves the logical slots 07/10/13/16/19/22 and
    # prevents duplicate processing while allowing rapid catch-up after a miss.
    - cron: "7,17,27,37,47,57 0-12,20-23 * * *"

permissions:
  contents: write

concurrency:
  # Any workflow capable of changing live state shares one serialization lock.
  group: skysakhnews-live-state
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check whether a production slot is due
        id: schedule_guard
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: python src/schedule_guard.py production

      - uses: actions/setup-python@v5
        if: steps.schedule_guard.outputs.due == 'true'
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        if: steps.schedule_guard.outputs.due == 'true'
        run: pip install -r requirements.txt

      - name: Compile canonical v12.1 production system
        if: steps.schedule_guard.outputs.due == 'true'
        run: |
          python -m py_compile \
            src/news_bot_v8.py src/news_bot_v9.py src/production.py \
            src/editorial_gate.py src/editorial_policy.py src/category_reconciler.py \
            src/editorial_gate_runner.py src/media_enforced_runner.py \
            src/news_director.py src/publication_auditor.py \
            src/editorial_monitor.py src/publisher.py src/production_selftest.py \
            src/telegram_health.py src/editorial_hardening.py \
            src/hardened_publisher.py src/hardened_monitor.py \
            src/schedule_guard.py src/health_gate.py src/hardening_selftest.py \
            src/operational_selftest.py

      - name: Mandatory strict editorial regression gate
        if: steps.schedule_guard.outputs.due == 'true'
        env:
          IMAGE_REQUIRED: "1"
          AI_CALL_BUDGET: "0"
          EDITORIAL_AUDIT_AI_BUDGET: "0"
          NEWS_DIRECTOR_AI_BUDGET: "0"
          POST_AUDIT_AUTOCORRECT: "0"
          RUN_COOLDOWN_MINUTES: "0"
          MEDIA_PENDING_MAX_HOURS: "36"
          MEDIA_PENDING_MAX_ITEMS: "24"
          OPENROUTER_MAX_ATTEMPTS: "3"
          OPENROUTER_RETRY_BASE_SECONDS: "0"
        run: |
          python src/production_selftest.py
          python src/hardening_selftest.py
          python src/operational_selftest.py

      - name: Publish through hardened v12.1 news director
        id: publisher
        if: steps.schedule_guard.outputs.due == 'true'
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ secrets.OPENROUTER_MODEL }}
          IMAGE_REQUIRED: "1"
          POSTS_PER_RUN: "2"
          MAX_AGE_HOURS: "36"
          AI_CALL_BUDGET: "4"
          EDITORIAL_AUDIT_AI_BUDGET: "0"
          NEWS_DIRECTOR_AI_BUDGET: "0"
          OPENROUTER_MAX_ATTEMPTS: "3"
          OPENROUTER_RETRY_BASE_SECONDS: "1.0"
          POST_AUDIT_AUTOCORRECT: "1"
          RUN_COOLDOWN_MINUTES: "20"
          MEDIA_PENDING_MAX_HOURS: "36"
          MEDIA_PENDING_MAX_ITEMS: "24"
          PYTHONUNBUFFERED: "1"
        run: python src/hardened_publisher.py

      - name: Immediately audit and self-heal the published feed
        id: monitor
        if: always() && steps.schedule_guard.outputs.due == 'true'
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          POST_AUDIT_AUTOCORRECT: "1"
          IMAGE_REQUIRED: "1"
          AI_CALL_BUDGET: "0"
          EDITORIAL_AUDIT_AI_BUDGET: "0"
          NEWS_DIRECTOR_AI_BUDGET: "0"
          THEMATIC_MIX_ERROR_LIMIT: "8"
          PYTHONUNBUFFERED: "1"
        run: python src/hardened_monitor.py

      - name: Verify production and delivery execution health
        if: always() && steps.schedule_guard.outputs.due == 'true'
        run: python src/health_gate.py production

      - name: Commit production-owned state only
        if: always() && steps.schedule_guard.outputs.due == 'true'
        run: |
          git config user.name "skysakhnews-bot"
          git config user.email "actions@github.com"
          git add state.json
          if git diff --cached --quiet; then
            echo "No production state changes"
          else
            git commit -m "Update hardened v12.1 production state"
            git pull --rebase --autostash origin main
            git push origin main
          fi
