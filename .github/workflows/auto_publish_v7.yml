name: SkySakhNews Auto Publisher Stable v10.1

on:
  workflow_dispatch:
  schedule:
    # UTC; Sakhalin = UTC+11: 07:00, 10:00, 13:00, 16:00, 19:00, 22:00
    - cron: "0 2,5,8,11,20,23 * * *"

permissions:
  contents: write

concurrency:
  group: skysakhnews-production-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile production system
        run: |
          python -m py_compile \
            src/news_bot_v8.py \
            src/news_bot_v9.py \
            src/production.py \
            src/editorial_gate.py \
            src/category_reconciler.py \
            src/editorial_gate_runner.py

      - name: Historical editorial regression gate
        env:
          IMAGE_REQUIRED: "0"
          AI_CALL_BUDGET: "8"
          EDITORIAL_AUDIT_AI_BUDGET: "4"
          RUN_COOLDOWN_MINUTES: "20"
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, "src")
          import editorial_gate as gate
          import category_reconciler as rec
          import editorial_gate_runner as runner

          assert runner.VERSION == "stable-v10.1"
          assert runner.prod.VERSION == "stable-v10.1"
          assert runner.core.VERSION == "stable-v10.1"

          def cand(cat, source, title, body, url):
              return {
                  "category_key": cat, "category": cat, "source": source,
                  "title": title, "source_text": body, "url": url,
              }

          # Real historical failures: the reconciler must repair them BEFORE writing.
          c = cand(
              "sakh", "Interfax",
              "В парламенте Ирана заявили, что давление на Тегеран не поможет США заключить соглашение",
              "Иран и США обсуждают условия возможного соглашения.",
              "https://www.interfax.ru/world/1110010",
          )
          assert rec.suggest_category(c) == "geo", rec.suggest_category(c)

          c = cand(
              "ru_eco", "Interfax",
              "Трамп рассматривает отсрочку введения пошлин в 50% в отношении Канады",
              "Президент США рассматривает отсрочку пошлин для Канады.",
              "https://www.interfax.ru/world/1110016",
          )
          assert rec.suggest_category(c) == "geo", rec.suggest_category(c)

          c = cand(
              "sakh_chp", "SakhalinMedia.ru",
              "Сильный дождь пройдет в центральных районах Сахалина 20 августа",
              "Сахалинское УГМС прогнозирует сильный дождь и осадки.",
              "https://sakhalinmedia.ru/news/2593484/",
          )
          assert rec.suggest_category(c) == "sakh", rec.suggest_category(c)

          c = cand(
              "ru_pol", "Interfax",
              "Ребенок погиб в Ростовской области, упав за борт катера",
              "Следователи устанавливают обстоятельства происшествия на воде.",
              "https://www.interfax.ru/russia/1110068",
          )
          assert rec.suggest_category(c) == "ru_incident", rec.suggest_category(c)

          c = cand(
              "ru_pol", "TASS",
              "Дмитриев считает, что Федоров бросил вызов Зеленскому призывами к выборам",
              "Высказывание касается украинской политики и выборов на Украине.",
              "https://tass.ru/politika/28023743",
          )
          assert rec.suggest_category(c) == "geo", rec.suggest_category(c)

          c = cand(
              "ru_pol", "Interfax",
              "Аэропорт временно ограничил прием самолетов из-за угрозы БПЛА",
              "Росавиация сообщила об ограничениях из-за угрозы БПЛА.",
              "https://www.interfax.ru/russia/1110011",
          )
          assert rec.suggest_category(c) == "ru_security", rec.suggest_category(c)

          # Headline may not strengthen source modality.
          c = cand(
              "ru_eco", "Interfax",
              "Правительство рассматривает возможность введения новой меры",
              "Власти обсуждают предложение, окончательное решение не принято.",
              "https://www.interfax.ru/russia/1",
          )
          r = gate.deterministic_review(c, {
              "title_ru": "Правительство ввело новую меру",
              "body": [], "editorial_mode": "generated",
          })
          assert not r["approved"] and r["meaning_changed"], r

          # Invented number is a hard rejection.
          c = cand(
              "sakh_chp", "SakhalinMedia.ru",
              "В Долинске расследуют кражу",
              "Полиция Долинска расследует кражу банковской карты.",
              "https://sakhalinmedia.ru/news/1/",
          )
          r = gate.deterministic_review(c, {
              "title_ru": "В Долинске расследуют кражу на 50 тысяч рублей",
              "body": [], "editorial_mode": "generated",
          })
          assert not r["facts_supported"] and not r["approved"], r

          # World about Russia requires Russia in the story, not just a world publisher.
          c = cand(
              "world_ru", "BBC World",
              "US and Iran discuss military tensions",
              "US and Iran officials discussed military tensions.",
              "https://www.bbc.com/news/world-test",
          )
          r = gate.deterministic_review(c, {
              "title_ru": "США и Иран обсуждают военную напряженность",
              "body": [], "editorial_mode": "generated",
          })
          assert not r["approved"], r

          print("stable-v10.1 historical editorial regressions: OK")
          PY

      - name: Run stable publisher with mandatory Editorial Gate
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ secrets.OPENROUTER_MODEL }}
          IMAGE_REQUIRED: "0"
          POSTS_PER_RUN: "2"
          MAX_AGE_HOURS: "36"
          AI_CALL_BUDGET: "8"
          EDITORIAL_AUDIT_AI_BUDGET: "4"
          RUN_COOLDOWN_MINUTES: "20"
          PYTHONUNBUFFERED: "1"
        run: |
          python src/editorial_gate_runner.py

      - name: Verify semantic publication health
        run: |
          python - <<'PY'
          import json
          with open("state.json", "r", encoding="utf-8") as f:
              state = json.load(f)
          run = state.get("last_run") or {}
          if run.get("version") == "stable-v10.1":
              assert run.get("status") == "ok", run
              assert "finished_sakhalin" in run, run
              local = run.get("local_stream") or {}
              assert local.get("status") in {"healthy", "degraded"}, local
              audit = run.get("editorial_gate") or {}
              assert "checked" in audit and "reclassified" in audit, audit
              published = int(run.get("published") or 0)
              posts = (state.get("last_posts") or [])[-published:] if published else []
              for p in posts:
                  g = p.get("editorial_gate") or {}
                  assert g.get("approved") is True, p
                  assert int(g.get("title_matches_source") or 0) >= 90, p
                  assert int(g.get("category_matches_story") or 0) >= 90, p
                  assert g.get("facts_supported") is True, p
                  assert g.get("meaning_changed") is False, p
          print("stable-v10.1 semantic publication health: OK", run)
          PY

      - name: Commit state and semantic audit
        if: always()
        run: |
          git config user.name "skysakhnews-bot"
          git config user.email "actions@github.com"
          git add state.json
          if git diff --cached --quiet; then
            echo "No state changes"
          else
            git commit -m "Update v10.1 news state and editorial audit"
            git pull --rebase --autostash origin main
            git push origin main
          fi
