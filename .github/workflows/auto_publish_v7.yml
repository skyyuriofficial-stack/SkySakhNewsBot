name: SkySakhNews Auto Publisher Stable v10.0

on:
  workflow_dispatch:
  schedule:
    # UTC; Sakhalin = UTC+11: 07:00, 10:00, 13:00, 16:00, 19:00, 22:00
    - cron: "0 2,5,8,11,20,23 * * *"

permissions:
  contents: write

concurrency:
  group: skysakhnews-production-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile production system
        run: |
          python -m py_compile \
            src/news_bot_v8.py \
            src/news_bot_v9.py \
            src/production.py \
            src/editorial_gate.py \
            src/editorial_gate_runner.py

      - name: Deterministic editorial regression gate
        env:
          IMAGE_REQUIRED: "0"
          AI_CALL_BUDGET: "8"
          EDITORIAL_AUDIT_AI_BUDGET: "4"
          RUN_COOLDOWN_MINUTES: "20"
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, "src")
          import editorial_gate as gate
          import editorial_gate_runner as runner

          assert runner.VERSION == "stable-v10.0"
          assert runner.prod.VERSION == "stable-v10.0"
          assert runner.core.VERSION == "stable-v10.0"

          def review(cat, source, title, body, generated=None, url="https://example.com/news"):
              c = {
                  "category_key": cat,
                  "category": cat,
                  "source": source,
                  "title": title,
                  "source_text": body,
                  "url": url,
              }
              row = {
                  "title_ru": generated or title,
                  "body": [],
                  "editorial_mode": "extractive_fallback" if generated is None else "generated",
              }
              return gate.deterministic_review(c, row)

          # 1. Modality may not be strengthened.
          r = review(
              "ru_eco", "Interfax",
              "Правительство рассматривает возможность введения новой меры",
              "Власти обсуждают предложение, окончательное решение не принято.",
              "Правительство ввело новую меру",
              "https://www.interfax.ru/russia/1",
          )
          assert not r["approved"] and r["meaning_changed"], r

          # 2. Accident/death is not politics.
          r = review(
              "ru_pol", "Interfax",
              "Ребенок погиб в Ростовской области, упав за борт катера",
              "Следователи устанавливают обстоятельства происшествия на воде.",
              None,
              "https://www.interfax.ru/russia/1110068",
          )
          assert not r["approved"] and r["category_matches_story"] < 90, r

          # 3. Ordinary Sakhalin weather forecast is not ЧП.
          r = review(
              "sakh_chp", "SakhalinMedia.ru",
              "Сильный дождь пройдет в центральных районах Сахалина 20 августа",
              "Сахалинское УГМС прогнозирует осадки; происшествий не зарегистрировано.",
              None,
              "https://sakhalinmedia.ru/news/2593484/",
          )
          assert not r["approved"], r

          # 4. Real local crime is a valid Sakhalin incident.
          r = review(
              "sakh_chp", "SakhalinMedia.ru",
              "Житель Долинска украл банковскую карту у приятеля",
              "Полиция Долинска возбудила уголовное дело по факту кражи.",
              None,
              "https://sakhalinmedia.ru/news/2593525/",
          )
          assert r["approved"] and r["category_matches_story"] == 100, r

          # 5. US/Iran without Russia cannot be World about Russia.
          r = review(
              "world_ru", "BBC World",
              "US and Iran discuss military tensions",
              "Officials from the US and Iran discussed tensions in the Middle East.",
              "США и Иран обсуждают военную напряженность",
              "https://www.bbc.com/news/world-test",
          )
          assert not r["approved"], r

          # 6. Habr/audio cannot masquerade as Sakhalin.
          r = review(
              "sakh", "Habr",
              "История аналоговой записи и магнитных лент",
              "Материал о кассетных деках и аналоговом аудио без региональной привязки.",
              None,
              "https://habr.com/ru/articles/1/",
          )
          assert not r["approved"], r

          # 7. BPLA / airport restriction belongs to security.
          r = review(
              "ru_security", "Interfax",
              "Аэропорт временно ограничил прием самолетов из-за угрозы БПЛА",
              "Росавиация сообщила об ограничениях в российском аэропорту из-за угрозы БПЛА.",
              None,
              "https://www.interfax.ru/russia/1110011",
          )
          assert r["approved"] and r["category_matches_story"] == 100, r

          # 8. Invented number is a hard rejection.
          c = {
              "category_key": "sakh_chp", "category": "📍 Сахалин", "source": "SakhalinMedia.ru",
              "title": "В Долинске расследуют кражу", "source_text": "Полиция расследует кражу банковской карты.",
              "url": "https://sakhalinmedia.ru/news/1/",
          }
          row = {"title_ru": "В Долинске расследуют кражу на 50 тысяч рублей", "body": [], "editorial_mode": "generated"}
          r = gate.deterministic_review(c, row)
          assert not r["facts_supported"] and not r["approved"], r

          print("stable-v10.0 editorial regression gate: OK")
          PY

      - name: Run stable publisher with mandatory Editorial Gate
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ secrets.OPENROUTER_MODEL }}
          IMAGE_REQUIRED: "0"
          POSTS_PER_RUN: "2"
          MAX_AGE_HOURS: "36"
          AI_CALL_BUDGET: "8"
          EDITORIAL_AUDIT_AI_BUDGET: "4"
          RUN_COOLDOWN_MINUTES: "20"
          PYTHONUNBUFFERED: "1"
        run: |
          python src/editorial_gate_runner.py

      - name: Verify semantic publication health
        run: |
          python - <<'PY'
          import json
          with open("state.json", "r", encoding="utf-8") as f:
              state = json.load(f)

          run = state.get("last_run") or {}
          if run.get("version") == "stable-v10.0":
              assert run.get("status") == "ok", run
              assert "finished_sakhalin" in run, run
              local = run.get("local_stream") or {}
              assert local.get("status") in {"healthy", "degraded"}, local
              audit = run.get("editorial_gate") or {}
              assert "checked" in audit, audit

              published = int(run.get("published") or 0)
              posts = (state.get("last_posts") or [])[-published:] if published else []
              for p in posts:
                  g = p.get("editorial_gate") or {}
                  assert g.get("approved") is True, p
                  assert int(g.get("title_matches_source") or 0) >= 90, p
                  assert int(g.get("category_matches_story") or 0) >= 90, p
                  assert g.get("facts_supported") is True, p
                  assert g.get("meaning_changed") is False, p

          print("stable-v10.0 semantic publication health: OK", run)
          PY

      - name: Commit state and semantic audit
        if: always()
        run: |
          git config user.name "skysakhnews-bot"
          git config user.email "actions@github.com"
          git add state.json
          if git diff --cached --quiet; then
            echo "No state changes"
          else
            git commit -m "Update v10 news state and editorial audit"
            git pull --rebase --autostash origin main
            git push origin main
          fi
