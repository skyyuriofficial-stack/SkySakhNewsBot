name: SkySakhNews Auto Publisher Stable v12.0

on:
  workflow_dispatch:
  schedule:
    # UTC; Sakhalin = UTC+11: 07:00, 10:00, 13:00, 16:00, 19:00, 22:00
    - cron: "0 2,5,8,11,20,23 * * *"

permissions:
  contents: write

concurrency:
  group: skysakhnews-production-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Require validated stable v12.0 sources
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          marker = Path("V12_MAIN_VERIFIED.json")
          assert marker.exists(), "stable-v12.0 source verification marker is missing"
          data = json.loads(marker.read_text(encoding="utf-8"))
          assert data.get("version") == "stable-v12.0", data
          assert data.get("all_source_tests_passed") is True, data
          PY

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile canonical v12 production system
        run: |
          python -m py_compile \
            src/news_bot_v8.py src/news_bot_v9.py src/production.py \
            src/editorial_gate.py src/category_reconciler.py \
            src/editorial_gate_runner.py src/media_enforced_runner.py \
            src/editorial_policy.py src/news_director.py \
            src/publication_auditor.py src/publisher.py \
            src/production_selftest.py

      - name: Mandatory strict editorial regression gate
        env:
          IMAGE_REQUIRED: "1"
          AI_CALL_BUDGET: "0"
          EDITORIAL_AUDIT_AI_BUDGET: "0"
          NEWS_DIRECTOR_AI_BUDGET: "0"
          POST_AUDIT_AUTOCORRECT: "0"
          RUN_COOLDOWN_MINUTES: "0"
          MEDIA_PENDING_MAX_HOURS: "36"
          MEDIA_PENDING_MAX_ITEMS: "24"
        run: |
          python src/production_selftest.py

      - name: Publish through v12 autocorrecting news director
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ secrets.OPENROUTER_MODEL }}
          IMAGE_REQUIRED: "1"
          POSTS_PER_RUN: "2"
          MAX_AGE_HOURS: "36"
          AI_CALL_BUDGET: "0"
          EDITORIAL_AUDIT_AI_BUDGET: "0"
          NEWS_DIRECTOR_AI_BUDGET: "0"
          POST_AUDIT_AUTOCORRECT: "1"
          RUN_COOLDOWN_MINUTES: "20"
          MEDIA_PENDING_MAX_HOURS: "36"
          MEDIA_PENDING_MAX_ITEMS: "24"
          PYTHONUNBUFFERED: "1"
        run: |
          python src/publisher.py

      - name: Verify v12 editorial, proportion and media contract
        run: |
          python - <<'PY'
          import json
          from urllib.parse import urlparse

          with open("state.json", "r", encoding="utf-8") as file:
              state = json.load(file)

          run = state.get("last_run") or {}
          assert run.get("version") == "stable-v12.0", run
          assert run.get("status") == "ok", run
          assert "finished_sakhalin" in run, run
          assert (run.get("local_stream") or {}).get("status") in {"healthy", "degraded"}, run

          director = run.get("news_director") or {}
          assert str(director.get("version") or "").startswith("director-v2"), director
          targets = ((director.get("rolling_balance_after") or {}).get("targets") or {})
          expected = {"local": 6, "politics": 4, "economy": 4, "safety": 3, "world": 2, "tech": 1}
          assert targets == expected, targets
          assert sum(targets.values()) == 20, targets

          media = run.get("media_policy") or {}
          assert media.get("required") is True, media
          assert media.get("text_only_allowed") is False, media

          published = int(run.get("published") or 0)
          assert 0 <= published <= 2, run
          posts = (state.get("last_posts") or [])[-published:] if published else []
          for post in posts:
              editorial = post.get("editorial_gate") or {}
              assert editorial.get("approved") is True, post
              assert int(editorial.get("title_matches_source") or 0) >= 90, post
              assert int(editorial.get("category_matches_story") or 0) >= 90, post
              assert editorial.get("facts_supported") is True, post
              assert editorial.get("meaning_changed") is False, post

              decision = post.get("news_director") or {}
              assert decision.get("approved") is True, post
              assert int(decision.get("seriousness") or 0) >= int(decision.get("threshold") or 0), post
              assert decision.get("final_title_checked") is True, post
              assert decision.get("final_category_checked") is True, post

              assert post.get("publisher_version") == "stable-v12.0", post
              assert post.get("with_image") is True, post
              assert post.get("media_type") == "photo", post
              assert post.get("image_url"), post
              assert post.get("image_hash"), post
              assert str(post.get("publish_method") or "").startswith("sendPhoto/"), post
              assert "news.google." not in urlparse(post.get("url") or "").netloc.lower(), post

          audit = run.get("post_publication_audit") or {}
          assert audit.get("version"), audit
          assert int(audit.get("unresolved") or 0) == 0, audit
          print("stable-v12.0 publication contract: OK", run)
          PY

      - name: Commit v12 state, audit and delivery queue
        if: always()
        run: |
          git config user.name "skysakhnews-bot"
          git config user.email "actions@github.com"
          git add state.json
          if git diff --cached --quiet; then
            echo "No state changes"
          else
            git commit -m "Update stable v12.0 editorial state"
            git pull --rebase --autostash origin main
            git push origin main
          fi
