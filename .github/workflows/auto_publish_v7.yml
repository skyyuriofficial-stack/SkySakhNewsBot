name: SkySakhNews Auto Publisher Stable v9.6

on:
  workflow_dispatch:
  schedule:
    # GitHub cron is UTC; Sakhalin is UTC+11.
    # 07:00, 10:00, 13:00, 16:00, 19:00, 22:00 Sakhalin.
    - cron: "0 2,5,8,11,20,23 * * *"

permissions:
  contents: write

concurrency:
  group: skysakhnews-production-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile production code
        run: |
          python -m py_compile src/news_bot_v8.py src/news_bot_v9.py src/production.py

      - name: Production self-test
        env:
          IMAGE_REQUIRED: "0"
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, "src")
          import production as prod
          core = prod.core

          assert prod.VERSION == "stable-v9.6"
          assert core.VERSION == "stable-v9.6"
          assert core.b.IMAGE_REQUIRED is False
          assert any(s[0] == "TASS" and s[1] == "ru" for s in core.b.SOURCES)
          assert all(s[0] not in {"Habr", "ASTV", "Sakh.online"} for s in core.b.SOURCES)
          assert "ru_security" in core.b.CAT

          sources = {s[0]: s for s in core.b.SOURCES}
          assert sources["SakhalinMedia"][2] == "https://sakhalinmedia.ru/export/new/news64.rss"
          assert core.ASTV_NEWS_URL == "https://astv.ru/news"
          assert core.SAKH_NEWS_URL == "https://sakh.online/news"

          # HTML local adapters.
          astv_urls = core.discover_astv_urls('''
              <a href="/news/criminal/2026-08-19-test-story/">story</a>
              <a href="/news/">not article</a>
              <a href="https://astv.ru/news/society/2026-08-18-second-story/">story2</a>
          ''')
          assert len(astv_urls) == 2, astv_urls

          sakh_urls = core.discover_sakh_urls('''
              <a href="/news/24/2026-08-19/local-test-story-517703">story</a>
              <a href="/news">not article</a>
              <a href="https://sakh.online/news/18/2026-08-18/second-local-story-517710">story2</a>
          ''')
          assert len(sakh_urls) == 2, sakh_urls

          # Unknown date is never fresh.
          assert core.strict_fresh(None) is False
          assert core.b.fresh(None) is False

          # The exact production regression: a foreign Interfax story is NOT Russia/economy.
          cat, _, reason = prod.classify_v96(
              "ru", 78,
              "Трамп рассматривает отсрочку введения пошлин в 50% в отношении Канады",
              "Президент США рассматривает отсрочку пошлин в отношении Канады.",
              "",
              "https://www.interfax.ru/world/1110016",
          )
          assert cat not in {"ru_eco", "ru_pol", "ru_security"}, (cat, reason)
          assert cat in {"geo", None}, (cat, reason)

          # Domestic airport/BPLA story stays in security.
          cat, _, reason = prod.classify_v96(
              "ru", 78,
              "Аэропорт временно ограничил прием самолетов из-за угрозы БПЛА",
              "Росавиация сообщила об ограничениях в российском аэропорту.",
              "",
              "https://www.interfax.ru/russia/1110011",
          )
          assert cat == "ru_security", (cat, reason)

          # Second independent guard against a foreign story entering a Russia stream.
          ok, why = prod.valid_source_stream_v96({
              "category_key": "ru_eco",
              "source": "Interfax",
              "url": "https://www.interfax.ru/world/1110016",
              "title": "Трамп рассматривает отсрочку пошлин для Канады",
              "source_text": "Президент США обсуждает пошлины в отношении Канады."
          })
          assert not ok and why == "russia_stream_foreign_story", (ok, why)

          # World-about-Russia guard.
          ok, why = core.valid_source_stream({
              "category_key": "world_ru",
              "source": "BBC World",
              "url": "https://bbc.com/news/test",
              "title": "US and Iran discuss military tensions",
              "source_text": "US and Iran officials discussed military tensions."
          })
          assert ok is False and why == "world_ru_without_russia"

          # Foreign content cannot masquerade as Sakhalin.
          ok, why = core.valid_source_stream({
              "category_key": "sakh",
              "source": "Sakhalin Google",
              "url": "https://example.com/audio",
              "title": "История аналоговой записи",
              "source_text": "Материал о магнитных лентах и кассетных деках без региональной привязки."
          })
          assert ok is False and why == "local_without_geo"

          # Google wrappers are never publishable final URLs.
          ok, why = core.valid_source_stream({
              "category_key": "geo",
              "source": "Reuters",
              "url": "https://news.google.com/rss/articles/test",
              "title": "Test",
              "source_text": "Test text"
          })
          assert ok is False and why == "non_direct_or_missing_url"

          # Evidence grounding.
          source = "Reuters reported that the talks resumed in Geneva on Tuesday after a two-day pause."
          assert core.evidence_matches(source, "the talks resumed in Geneva on Tuesday")
          assert not core.evidence_matches(source, "officials signed a final peace agreement")

          # Seismic facts are mandatory when present in source.
          quake = {
              "category_key": "sakh_quake",
              "title": "У Курильских островов произошло землетрясение магнитудой 5,1",
              "source_text": (
                  "Толчок зарегистрировали в 08:42. Очаг залегал на глубине 20 км. "
                  "Эпицентр находился в 65 км от Северо-Курильска. "
                  "В городе ощущались толчки силой 3 балла."
              )
          }
          facts = core.quake_required_facts(quake)
          assert "5.1" in facts.get("magnitude", [])
          assert "20" in facts.get("depth_km", [])
          assert "65" in facts.get("distance_km", [])
          assert "3" in facts.get("intensity_points", [])

          errors = core.validate_quake({
              "title_ru": "У Курил произошло землетрясение",
              "body": ["Толчок ощущался в 08:42; эпицентр был в 65 км, глубина — 20 км, интенсивность — 3 балла."]
          }, quake)
          assert any(x.startswith("quake_missing_magnitude:5.1") for x in errors)

          print("production self-test stable-v9.6: OK")
          PY

      - name: Run stable publisher
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ secrets.OPENROUTER_MODEL }}
          IMAGE_REQUIRED: "0"
          POSTS_PER_RUN: "2"
          MAX_AGE_HOURS: "36"
          PYTHONUNBUFFERED: "1"
        run: |
          python src/production.py

      - name: Verify run health
        run: |
          python - <<'PY'
          import json
          with open("state.json", "r", encoding="utf-8") as f:
              state = json.load(f)

          run = state.get("last_run") or {}
          assert run.get("version") == "stable-v9.6", run
          assert run.get("status") == "ok", run
          assert "finished_sakhalin" in run, run

          local = run.get("local_stream") or {}
          assert local.get("status") in ("healthy", "degraded", "down"), local
          # Total local-source loss must be visible as a failed workflow.
          assert local.get("status") != "down", local

          print("run health: OK", run)
          PY

      - name: Commit state and health
        if: always()
        run: |
          git config user.name "skysakhnews-bot"
          git config user.email "actions@github.com"
          git add state.json
          if git diff --cached --quiet; then
            echo "No state changes"
          else
            git commit -m "Update news state and health"
            git push || (git pull --rebase origin main && git push)
          fi
