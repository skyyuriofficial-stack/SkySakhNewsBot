name: SkySakhNews Auto Publisher Stable v9.3

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2,5,8,11,20,23 * * *"
  push:
    branches:
      - main
    paths:
      - "src/news_bot_v8.py"
      - "src/news_bot_v9.py"
      - "requirements.txt"
      - ".github/workflows/auto_publish_v7.yml"

permissions:
  contents: write

concurrency:
  group: skysakhnews-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile production code
        run: |
          python -m py_compile src/news_bot_v8.py src/news_bot_v9.py

      - name: Production self-test
        env:
          IMAGE_REQUIRED: "0"
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, "src")
          import news_bot_v9 as prod
          assert prod.VERSION == "stable-v9.3"
          assert prod.b.IMAGE_REQUIRED is False
          assert any(s[0] == "TASS" and s[1] == "ru" for s in prod.b.SOURCES)
          assert all(s[0] != "Habr" for s in prod.b.SOURCES)
          assert "ru_security" in prod.b.CAT
          print("production self-test: OK")
          PY

      - name: Run stable publisher
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ secrets.OPENROUTER_MODEL }}
          IMAGE_REQUIRED: "0"
          POSTS_PER_RUN: "2"
          MAX_AGE_HOURS: "36"
          PYTHONUNBUFFERED: "1"
        run: |
          python src/news_bot_v9.py

      - name: Verify run health
        run: |
          python - <<'PY'
          import json
          with open("state.json", "r", encoding="utf-8") as f:
              state = json.load(f)
          run = state.get("last_run") or {}
          assert run.get("version") == "stable-v9.3", run
          assert run.get("status") == "ok", run
          assert "finished_sakhalin" in run, run
          print("run health: OK", run)
          PY

      - name: Commit state and health
        if: always()
        run: |
          git config user.name "skysakhnews-bot"
          git config user.email "actions@github.com"
          git add state.json
          if git diff --cached --quiet; then
            echo "No state changes"
          else
            git commit -m "Update news state and health"
            git push || (git pull --rebase origin main && git push)
          fi
