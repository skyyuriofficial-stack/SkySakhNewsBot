name: SkySakhNews Auto Publisher Stable v9.7

on:
  workflow_dispatch:
  schedule:
    # UTC; Sakhalin = UTC+11: 07:00, 10:00, 13:00, 16:00, 19:00, 22:00
    - cron: "0 2,5,8,11,20,23 * * *"

permissions:
  contents: write

concurrency:
  group: skysakhnews-production-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile and deterministic production gate
        env:
          IMAGE_REQUIRED: "0"
          AI_CALL_BUDGET: "8"
        run: |
          python -m py_compile src/news_bot_v8.py src/news_bot_v9.py src/production.py
          python - <<'PY'
          import sys
          sys.path.insert(0, "src")
          import production as prod
          core = prod.core

          assert prod.VERSION == "stable-v9.7"
          assert core.VERSION == "stable-v9.7"
          assert core.strict_fresh(None) is False
          assert core.b.IMAGE_REQUIRED is False
          assert any(s[0] == "TASS" for s in core.b.SOURCES)
          assert all(s[0] not in {"Habr", "ASTV", "Sakh.online"} for s in core.b.SOURCES)
          assert core.ASTV_NEWS_URL == "https://astv.ru/news"
          assert core.SAKH_NEWS_URL == "https://sakh.online/news"

          cat, _, _ = prod.classify_v97(
              "ru", 78,
              "Трамп рассматривает отсрочку введения пошлин в 50% в отношении Канады",
              "Президент США рассматривает отсрочку пошлин в отношении Канады.",
              "",
              "https://www.interfax.ru/world/1110016",
          )
          assert cat not in {"ru_eco", "ru_pol", "ru_security"}

          cat, _, _ = prod.classify_v97(
              "ru", 78,
              "Аэропорт временно ограничил прием самолетов из-за угрозы БПЛА",
              "Росавиация сообщила об ограничениях в российском аэропорту.",
              "",
              "https://www.interfax.ru/russia/1110011",
          )
          assert cat == "ru_security"

          ok, why = prod.valid_source_stream_v97({
              "category_key": "ru_eco",
              "source": "Interfax",
              "url": "https://www.interfax.ru/world/1110016",
              "title": "Трамп рассматривает отсрочку пошлин для Канады",
              "source_text": "Президент США обсуждает пошлины в отношении Канады."
          })
          assert not ok and why == "russia_stream_foreign_story"

          ok, why = core.valid_source_stream({
              "category_key": "sakh",
              "source": "Sakhalin Google",
              "url": "https://example.com/audio",
              "title": "История аналоговой записи",
              "source_text": "Материал о магнитных лентах и кассетных деках без региональной привязки."
          })
          assert not ok and why == "local_without_geo"

          fallback = prod._extractive_fallback({
              "category_key": "sakh",
              "footer": "САХАЛИН",
              "title": "В Южно-Сахалинске восстановили движение после дорожной аварии",
              "source_text": (
                  "Движение на участке городской улицы восстановили после завершения аварийных работ. "
                  "Специалисты убрали поврежденный автомобиль и освободили проезжую часть для транспорта. "
                  "Обстоятельства происшествия устанавливают сотрудники полиции."
              )
          })
          assert fallback and len(fallback["body"]) == 2

          quake = {
              "category_key": "sakh_quake",
              "title": "У Курильских островов произошло землетрясение магнитудой 5,1",
              "source_text": "Толчок зарегистрировали в 08:42. Очаг залегал на глубине 20 км. Эпицентр находился в 65 км от Северо-Курильска. В городе ощущались толчки силой 3 балла."
          }
          facts = core.quake_required_facts(quake)
          assert "5.1" in facts.get("magnitude", [])
          assert "20" in facts.get("depth_km", [])
          assert "65" in facts.get("distance_km", [])
          assert "3" in facts.get("intensity_points", [])
          print("production gate stable-v9.7: OK")
          PY

      - name: Run stable publisher
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ secrets.OPENROUTER_MODEL }}
          IMAGE_REQUIRED: "0"
          POSTS_PER_RUN: "2"
          MAX_AGE_HOURS: "36"
          AI_CALL_BUDGET: "8"
          PYTHONUNBUFFERED: "1"
        run: |
          python src/production.py

      - name: Verify run health
        run: |
          python - <<'PY'
          import json
          with open("state.json", "r", encoding="utf-8") as f:
              state = json.load(f)
          run = state.get("last_run") or {}
          assert run.get("version") == "stable-v9.7", run
          assert run.get("status") == "ok", run
          assert "finished_sakhalin" in run, run
          local = run.get("local_stream") or {}
          assert local.get("status") in {"healthy", "degraded"}, local
          stats = run.get("stats") or {}
          assert stats.get("ai_calls", 0) <= 8, stats
          print("run health: OK", run)
          PY

      - name: Commit state and health
        if: always()
        run: |
          git config user.name "skysakhnews-bot"
          git config user.email "actions@github.com"
          git add state.json
          if git diff --cached --quiet; then
            echo "No state changes"
          else
            git commit -m "Update news state and health"
            git pull --rebase --autostash origin main
            git push origin main
          fi
