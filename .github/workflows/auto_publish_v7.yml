name: SkySakhNews Auto Publisher Stable v12.0

on:
  workflow_dispatch:
  schedule:
    # UTC; Sakhalin = UTC+11: 07:00, 10:00, 13:00, 16:00, 19:00, 22:00
    - cron: "0 2,5,8,11,20,23 * * *"

permissions:
  contents: write

concurrency:
  group: skysakhnews-production-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile canonical production system
        run: |
          python -m py_compile \
            src/news_bot_v8.py \
            src/news_bot_v9.py \
            src/production.py \
            src/editorial_gate.py \
            src/category_reconciler.py \
            src/editorial_gate_runner.py \
            src/media_enforced_runner.py \
            src/news_director.py \
            src/publisher.py \
            src/quality_v12.py \
            src/publisher_v12.py \
            src/post_publish_audit_v12.py \
            src/production_selftest_v12.py

      - name: Mandatory strict editorial regression gate
        env:
          IMAGE_REQUIRED: "1"
          AI_CALL_BUDGET: "4"
          EDITORIAL_AUDIT_AI_BUDGET: "2"
          NEWS_DIRECTOR_AI_BUDGET: "0"
          OPENROUTER_MAX_ATTEMPTS: "3"
          OPENROUTER_RETRY_BASE_SECONDS: "1.0"
          RUN_COOLDOWN_MINUTES: "20"
          MEDIA_PENDING_MAX_HOURS: "36"
          MEDIA_PENDING_MAX_ITEMS: "24"
        run: python src/production_selftest_v12.py

      - name: Publish through strict v12 quality director
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ secrets.OPENROUTER_MODEL }}
          IMAGE_REQUIRED: "1"
          POSTS_PER_RUN: "2"
          MAX_AGE_HOURS: "36"
          AI_CALL_BUDGET: "4"
          EDITORIAL_AUDIT_AI_BUDGET: "2"
          NEWS_DIRECTOR_AI_BUDGET: "0"
          OPENROUTER_MAX_ATTEMPTS: "3"
          OPENROUTER_RETRY_BASE_SECONDS: "1.0"
          RUN_COOLDOWN_MINUTES: "20"
          MEDIA_PENDING_MAX_HOURS: "36"
          MEDIA_PENDING_MAX_ITEMS: "24"
          PYTHONUNBUFFERED: "1"
        run: python src/publisher_v12.py

      - name: Immediate post-publication watchdog
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: python src/post_publish_audit_v12.py

      - name: Verify strict editorial, proportions and media health
        run: |
          python - <<'PY'
          import json
          from urllib.parse import urlparse

          with open("state.json", "r", encoding="utf-8") as file:
              state = json.load(file)

          run = state.get("last_run") or {}
          if run.get("version") == "stable-v12.0":
              assert run.get("status") == "ok", run
              assert "finished_sakhalin" in run, run
              assert (run.get("local_stream") or {}).get("status") in {"healthy", "degraded"}, run

              quality = run.get("quality_v12") or {}
              assert quality.get("version") == "quality-v12.0", quality
              balance = quality.get("balance_after") or {}
              assert balance.get("targets") == {
                  "local": 6,
                  "ru_pol": 4,
                  "ru_eco": 4,
                  "ru_safety": 3,
                  "world": 2,
                  "it": 1,
              }, balance
              assert sum(int(v) for v in (balance.get("targets") or {}).values()) == 20, balance

              audit = run.get("post_publish_audit_v12") or {}
              assert audit.get("version") == "stable-v12.0", audit
              assert audit.get("all_pass") is True, audit
              assert int(audit.get("failed") or 0) == 0, audit

              media = run.get("media_policy") or {}
              assert media.get("required") is True, media
              assert media.get("text_only_allowed") is False, media

              published = int(run.get("published") or 0)
              assert 0 <= published <= 2, run
              posts = (state.get("last_posts") or [])[-published:] if published else []
              for post in posts:
                  assert post.get("post_publish_status") == "audited_ok", post
                  q = post.get("quality_v12") or {}
                  assert q.get("approved") is True, post
                  assert q.get("prepublication_checked") is True, post
                  assert q.get("final_title_checked") is True, post
                  assert q.get("final_category_checked") is True, post
                  assert int(q.get("score") or 0) >= int(q.get("threshold") or 101), post

                  editorial = post.get("editorial_gate") or {}
                  assert editorial.get("approved") is True, post
                  assert editorial.get("facts_supported") is True, post
                  assert editorial.get("meaning_changed") is False, post

                  assert post.get("with_image") is True, post
                  assert post.get("image_url") and post.get("image_hash"), post
                  assert str(post.get("publish_method") or "").startswith("sendPhoto/"), post
                  assert "news.google." not in urlparse(post.get("url") or "").netloc.lower(), post

          print("stable-v12.0 strict publication health: OK", run)
          PY

      - name: Commit state, audit and delivery queue
        if: always()
        run: |
          git config user.name "skysakhnews-bot"
          git config user.email "actions@github.com"
          git add state.json
          if git diff --cached --quiet; then
            echo "No state changes"
          else
            git commit -m "Update stable v12 strict editorial state"
            git pull --rebase --autostash origin main
            git push origin main
          fi
