name: SkySakhNews Auto Publisher Stable v10.2

on:
  workflow_dispatch:
  schedule:
    # UTC; Sakhalin = UTC+11: 07:00, 10:00, 13:00, 16:00, 19:00, 22:00
    - cron: "0 2,5,8,11,20,23 * * *"

permissions:
  contents: write

concurrency:
  group: skysakhnews-production-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile production system
        run: |
          python -m py_compile \
            src/news_bot_v8.py \
            src/news_bot_v9.py \
            src/production.py \
            src/editorial_gate.py \
            src/category_reconciler.py \
            src/editorial_gate_runner.py

      - name: Mandatory semantic regression gate
        env:
          IMAGE_REQUIRED: "0"
          AI_CALL_BUDGET: "8"
          EDITORIAL_AUDIT_AI_BUDGET: "4"
          RUN_COOLDOWN_MINUTES: "20"
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, "src")
          import editorial_gate as gate
          import category_reconciler as rec
          import editorial_gate_runner as runner

          assert runner.VERSION == "stable-v10.2"
          assert runner.prod.VERSION == "stable-v10.2"
          assert runner.core.VERSION == "stable-v10.2"
          assert runner.core.strict_fresh(None) is False

          def candidate(title, text, source="Interfax", url="https://www.interfax.ru/russia/1", category="sakh"):
              return {
                  "title": title,
                  "source_text": text,
                  "source": source,
                  "url": url,
                  "category_key": category,
                  "category": category,
              }

          cases = [
              (candidate(
                  "В парламенте Ирана заявили, что давление на Тегеран не поможет США заключить соглашение",
                  "Иран и США обсуждают условия соглашения.",
                  url="https://www.interfax.ru/world/1110010",
              ), "geo"),
              (candidate(
                  "Трамп рассматривает отсрочку введения пошлин в 50% в отношении Канады",
                  "Президент США рассматривает отсрочку пошлин для Канады.",
                  url="https://www.interfax.ru/world/1110016",
              ), "geo"),
              (candidate(
                  "Сильный дождь пройдет в центральных районах Сахалина 20 августа",
                  "Сахалинское УГМС прогнозирует осадки.",
                  source="SakhalinMedia.ru",
                  url="https://sakhalinmedia.ru/news/2593484/",
              ), "sakh"),
              (candidate(
                  "Ребенок погиб в Ростовской области, упав за борт катера",
                  "Следователи устанавливают обстоятельства происшествия.",
                  url="https://www.interfax.ru/russia/1110068",
              ), "ru_incident"),
              (candidate(
                  "Аэропорт временно ограничил прием самолетов из-за угрозы БПЛА",
                  "Росавиация сообщила об ограничениях из-за беспилотников.",
                  url="https://www.interfax.ru/russia/1110011",
              ), "ru_security"),
              (candidate(
                  "История аналоговой записи и магнитных лент",
                  "Материал о кассетных деках без региональной привязки.",
                  source="Habr",
                  url="https://habr.com/ru/articles/1/",
              ), None),
              (candidate(
                  "Мэр Хабаровска рассказал о новой автобусной остановке",
                  "Работы выполняются в Хабаровске.",
                  source="SakhalinMedia.ru",
                  url="https://sakhalinmedia.ru/news/1/",
              ), None),
              (candidate(
                  "Японист РАН: Токио наказывает Россию за Украину, но в уме держит Китай",
                  "В материале упоминаются Курильские острова.",
                  url="https://www.interfax.ru/world/1110153",
              ), "geo"),
              (candidate(
                  "Нефть слабо дорожает, Brent торгуется у $91,7 за баррель",
                  "Мировые цены на нефть растут на бирже ICE Futures.",
                  url="https://www.interfax.ru/business/1110251",
                  category="ru_eco",
              ), "geo"),
              (candidate(
                  "Прокуратура помогла сахалинцу вернуть деньги, украденные мошенниками",
                  "Полиция Сахалинской области расследовала мошенничество.",
                  source="SakhalinMedia.ru",
                  url="https://sakhalinmedia.ru/news/2/",
              ), "sakh_chp"),
          ]
          for item, expected in cases:
              actual = rec.suggest_category(item)
              assert actual == expected, (item["title"], actual, expected)

          assert "local" not in gate.infer_topics(
              "Мэр Хабаровска рассказал о благоустройстве",
              "SakhalinMedia.ru",
              "https://sakhalinmedia.ru/news/1/",
          )
          assert "it" not in gate.infer_topics("В полиции России сообщили о расследовании")

          c = candidate(
              "Правительство рассматривает возможность введения новой меры",
              "Власти обсуждают предложение, окончательное решение не принято.",
              category="ru_pol",
          )
          row = {
              "title_ru": "Правительство ввело новую меру",
              "body": [],
              "editorial_mode": "generated",
          }
          verdict = gate.deterministic_review(c, row)
          assert not verdict["approved"] and verdict["meaning_changed"], verdict

          c = candidate(
              "В Долинске расследуют кражу банковской карты",
              "Полиция расследует кражу.",
              source="SakhalinMedia.ru",
              url="https://sakhalinmedia.ru/news/3/",
              category="sakh_chp",
          )
          row = {
              "title_ru": "В Долинске расследуют кражу на 50 тысяч рублей",
              "body": [],
              "editorial_mode": "generated",
          }
          verdict = gate.deterministic_review(c, row)
          assert not verdict["approved"] and not verdict["facts_supported"], verdict

          print("stable-v10.2 mandatory semantic regression gate: OK")
          PY

      - name: Run stable publisher with mandatory Editorial Gate
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ secrets.OPENROUTER_MODEL }}
          IMAGE_REQUIRED: "0"
          POSTS_PER_RUN: "2"
          MAX_AGE_HOURS: "36"
          AI_CALL_BUDGET: "8"
          EDITORIAL_AUDIT_AI_BUDGET: "4"
          RUN_COOLDOWN_MINUTES: "20"
          PYTHONUNBUFFERED: "1"
        run: |
          python src/editorial_gate_runner.py

      - name: Verify semantic publication health
        run: |
          python - <<'PY'
          import json
          from urllib.parse import urlparse

          with open("state.json", "r", encoding="utf-8") as file:
              state = json.load(file)

          run = state.get("last_run") or {}
          if run.get("version") == "stable-v10.2":
              assert run.get("status") == "ok", run
              assert "finished_sakhalin" in run, run
              local = run.get("local_stream") or {}
              assert local.get("status") in {"healthy", "degraded"}, local
              audit = run.get("editorial_gate") or {}
              assert "prechecked" in audit and "checked" in audit, audit

              published = int(run.get("published") or 0)
              assert published <= 2, run
              posts = (state.get("last_posts") or [])[-published:] if published else []
              for post in posts:
                  gate_result = post.get("editorial_gate") or {}
                  assert gate_result.get("approved") is True, post
                  assert int(gate_result.get("title_matches_source") or 0) >= 90, post
                  assert int(gate_result.get("category_matches_story") or 0) >= 90, post
                  assert gate_result.get("facts_supported") is True, post
                  assert gate_result.get("meaning_changed") is False, post
                  assert "news.google." not in urlparse(post.get("url") or "").netloc.lower(), post

          print("stable-v10.2 semantic publication health: OK", run)
          PY

      - name: Commit state and semantic audit
        if: always()
        run: |
          git config user.name "skysakhnews-bot"
          git config user.email "actions@github.com"
          git add state.json
          if git diff --cached --quiet; then
            echo "No state changes"
          else
            git commit -m "Update v10.2 news state and editorial audit"
            git pull --rebase --autostash origin main
            git push origin main
          fi
