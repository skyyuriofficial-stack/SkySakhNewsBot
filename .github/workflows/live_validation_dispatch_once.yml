name: SkySakhNews Live Reliability Validation Once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/live_validation_dispatch_once.yml"

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch production recovery
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/auto_publish_v7.yml/dispatches \
            -d '{"ref":"main","inputs":{"force":"false"}}'
      - name: Dispatch monitor
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/editorial_monitor.yml/dispatches \
            -d '{"ref":"main","inputs":{"diagnostic":"false"}}'
