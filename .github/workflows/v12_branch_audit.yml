name: SkySakhNews v12 Strict Editorial Audit

on:
  push:
    branches:
      - fix/editorial-v12
    paths:
      - "src/quality_v12.py"
      - "src/publisher_v12.py"
      - "src/post_publish_audit_v12.py"
      - "src/production_selftest_v12.py"
      - "src/quality_audit_v12.py"
      - ".github/workflows/v12_branch_audit.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: skysakhnews-v12-branch-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile full chain
        run: |
          python -m py_compile \
            src/news_bot_v8.py \
            src/news_bot_v9.py \
            src/production.py \
            src/editorial_gate.py \
            src/category_reconciler.py \
            src/editorial_gate_runner.py \
            src/media_enforced_runner.py \
            src/news_director.py \
            src/publisher.py \
            src/quality_v12.py \
            src/publisher_v12.py \
            src/post_publish_audit_v12.py \
            src/production_selftest_v12.py \
            src/quality_audit_v12.py

      - name: Exact regression suite
        env:
          IMAGE_REQUIRED: "1"
          AI_CALL_BUDGET: "4"
          EDITORIAL_AUDIT_AI_BUDGET: "2"
          NEWS_DIRECTOR_AI_BUDGET: "0"
          OPENROUTER_MAX_ATTEMPTS: "3"
          OPENROUTER_RETRY_BASE_SECONDS: "0"
        run: python src/production_selftest_v12.py

      - name: Live-source dry audit
        env:
          IMAGE_REQUIRED: "1"
          AI_CALL_BUDGET: "0"
          EDITORIAL_AUDIT_AI_BUDGET: "0"
          NEWS_DIRECTOR_AI_BUDGET: "0"
          RUN_COOLDOWN_MINUTES: "0"
          FORCE_RUN: "1"
          PYTHONUNBUFFERED: "1"
        run: python src/quality_audit_v12.py

      - name: Validate report
        run: |
          python - <<'PY'
          import json
          with open("quality_audit_v12.json", "r", encoding="utf-8") as file:
              report = json.load(file)
          assert report.get("version") == "stable-v12.0", report
          assert report.get("all_pass") is True, report
          assert int(report.get("failed") or 0) == 0, report
          assert int(report.get("approved_count") or 0) > 0, report
          print(json.dumps(report.get("selected") or [], ensure_ascii=False, indent=2))
          PY

      - name: Persist live audit report
        if: always()
        run: |
          find src -type d -name __pycache__ -prune -exec rm -rf {} +
          git config user.name "skysakhnews-bot"
          git config user.email "actions@github.com"
          git add quality_audit_v12.json
          if git diff --cached --quiet; then
            echo "No audit report changes"
          else
            git commit -m "Record stable v12 live-source quality audit"
            git push origin HEAD:fix/editorial-v12
          fi
