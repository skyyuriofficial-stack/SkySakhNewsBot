name: SkySakhNews Hardened Recovery Once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/hardening_recovery_once.yml"

permissions:
  contents: write

concurrency:
  group: skysakhnews-production-publisher
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile and regress
        env:
          IMAGE_REQUIRED: "1"
          AI_CALL_BUDGET: "0"
          EDITORIAL_AUDIT_AI_BUDGET: "0"
          NEWS_DIRECTOR_AI_BUDGET: "0"
          POST_AUDIT_AUTOCORRECT: "0"
          RUN_COOLDOWN_MINUTES: "0"
        run: |
          python -m py_compile src/telegram_health.py src/editorial_hardening.py src/hardened_publisher.py src/hardened_monitor.py src/health_gate.py
          python src/production_selftest.py
          python src/hardening_selftest.py
      - name: Hardened production recovery
        id: publisher
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ secrets.OPENROUTER_MODEL }}
          IMAGE_REQUIRED: "1"
          POSTS_PER_RUN: "2"
          MAX_AGE_HOURS: "36"
          AI_CALL_BUDGET: "4"
          EDITORIAL_AUDIT_AI_BUDGET: "0"
          NEWS_DIRECTOR_AI_BUDGET: "0"
          OPENROUTER_MAX_ATTEMPTS: "3"
          OPENROUTER_RETRY_BASE_SECONDS: "1.0"
          POST_AUDIT_AUTOCORRECT: "1"
          RUN_COOLDOWN_MINUTES: "0"
          MEDIA_PENDING_MAX_HOURS: "36"
          MEDIA_PENDING_MAX_ITEMS: "24"
          PYTHONUNBUFFERED: "1"
        run: python src/hardened_publisher.py
      - name: Hardened monitor
        id: monitor
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          POST_AUDIT_AUTOCORRECT: "1"
          IMAGE_REQUIRED: "1"
          AI_CALL_BUDGET: "0"
          EDITORIAL_AUDIT_AI_BUDGET: "0"
          NEWS_DIRECTOR_AI_BUDGET: "0"
          THEMATIC_MIX_ERROR_LIMIT: "8"
          PYTHONUNBUFFERED: "1"
        run: python src/hardened_monitor.py
      - name: Persist recovery state
        if: always()
        run: |
          git config user.name "skysakhnews-recovery"
          git config user.email "actions@github.com"
          git add state.json monitor_status.json telegram_health.json
          if git diff --cached --quiet; then
            echo "No recovery state changes"
          else
            git commit -m "Persist hardened recovery state"
            git pull --rebase --autostash origin main
            git push origin main
          fi
      - name: Require healthy recovery
        if: always()
        run: python src/health_gate.py production
