name: SkySakhNews v10 Editorial Gate Audit

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/run_editorial_audit_once.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: skysakhnews-editorial-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Audit live candidates and dry-run publication
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ secrets.OPENROUTER_MODEL }}
          IMAGE_REQUIRED: "0"
          POSTS_PER_RUN: "2"
          MAX_AGE_HOURS: "36"
          AI_CALL_BUDGET: "2"
          EDITORIAL_AUDIT_AI_BUDGET: "2"
          RUN_COOLDOWN_MINUTES: "0"
          FORCE_RUN: "1"
          PYTHONUNBUFFERED: "1"
        run: |
          python - <<'PY'
          import copy
          import json
          import sys
          from datetime import datetime, timezone
          from pathlib import Path

          sys.path.insert(0, "src")
          import editorial_gate as gate
          import editorial_gate_runner as runner

          core = runner.core
          prod = runner.prod
          original_state = json.loads(Path("state.json").read_text(encoding="utf-8"))
          working_state = copy.deepcopy(original_state)
          captured_state = {}
          captured_posts = []

          # First audit the entire live candidate pool before any writing happens.
          cands = core.b.collect(copy.deepcopy(original_state))
          pre_audit = []
          for c in cands:
              source_row = {
                  "title_ru": prod._display_title(c),
                  "body": [],
                  "editorial_mode": "extractive_fallback",
              }
              r = gate.deterministic_review(c, source_row)
              pre_audit.append({
                  "source": c.get("source"),
                  "url": c.get("url"),
                  "title": c.get("title"),
                  "category": c.get("category"),
                  "category_key": c.get("category_key"),
                  "title_matches_source": r.get("title_matches_source"),
                  "category_matches_story": r.get("category_matches_story"),
                  "approved": r.get("approved"),
                  "issues": r.get("issues"),
                  "source_topics": r.get("source_topics"),
                  "title_topics": r.get("title_topics"),
              })

          # Dry Telegram: execute the actual v10 pipeline, but capture instead of send.
          def dry_photo(c, cap):
              captured_posts.append({
                  "method": "dry-sendPhoto", "url": c.get("url"), "source": c.get("source"),
                  "source_title": c.get("title"), "category": c.get("category"),
                  "category_key": c.get("category_key"), "caption": cap,
              })
              return {"ok": True, "result": {"message_id": 1}}

          def dry_text(row, c):
              captured_posts.append({
                  "method": "dry-sendMessage", "url": c.get("url"), "source": c.get("source"),
                  "source_title": c.get("title"), "category": c.get("category"),
                  "category_key": c.get("category_key"), "row": row,
              })
              return {"ok": True, "result": {"message_id": 1}}

          def fake_load():
              return copy.deepcopy(working_state)

          def fake_save(state):
              captured_state.clear()
              captured_state.update(copy.deepcopy(state))

          core.b.load_state = fake_load
          core.b.save_state = fake_save
          core.b.send_photo = dry_photo
          core.send_text = dry_text
          core.time.sleep = lambda _x: None

          error = None
          try:
              runner.main()
          except Exception as ex:
              error = repr(ex)

          run = captured_state.get("last_run") or {}
          published = int(run.get("published") or 0)
          dry_last_posts = (captured_state.get("last_posts") or [])[-published:] if published else []

          checks = []
          def check(name, ok, detail=""):
              checks.append({"name": name, "ok": bool(ok), "detail": str(detail)[:1000]})

          check("runtime_no_exception", error is None, error)
          check("version_v10", run.get("version") == "stable-v10.0", run.get("version"))
          check("candidate_pool_nonempty", len(cands) > 0, len(cands))
          local_count = sum(1 for c in cands if c.get("category_key") in {"sakh", "sakh_chp", "sakh_quake"})
          check("local_candidates_nonempty", local_count > 0, local_count)
          check("pre_audit_no_category_mismatch", all(int(x.get("category_matches_story") or 0) >= 90 for x in pre_audit), [x for x in pre_audit if int(x.get("category_matches_story") or 0) < 90][:8])
          check("published_exactly_2", published == 2, published)
          check("captured_exactly_2", len(captured_posts) == 2, len(captured_posts))

          for i, p in enumerate(dry_last_posts, 1):
              g = p.get("editorial_gate") or {}
              check(f"post_{i}_gate_approved", g.get("approved") is True, g)
              check(f"post_{i}_title_match", int(g.get("title_matches_source") or 0) >= 90, g)
              check(f"post_{i}_category_match", int(g.get("category_matches_story") or 0) >= 90, g)
              check(f"post_{i}_facts_supported", g.get("facts_supported") is True, g)
              check(f"post_{i}_meaning_unchanged", g.get("meaning_changed") is False, g)

          report = {
              "generated_at_utc": datetime.now(timezone.utc).isoformat(timespec="seconds"),
              "version": "stable-v10.0",
              "mode": "live-sources / dry-Telegram / mandatory-editorial-gate",
              "run": run,
              "candidate_count": len(cands),
              "local_candidate_count": local_count,
              "pre_audit": pre_audit,
              "captured_posts": captured_posts,
              "dry_last_posts": dry_last_posts,
              "checks": checks,
              "passed": sum(1 for x in checks if x["ok"]),
              "failed": sum(1 for x in checks if not x["ok"]),
              "all_pass": all(x["ok"] for x in checks),
              "run_error": error,
          }
          Path("v10_editorial_audit_report.json").write_text(
              json.dumps(report, ensure_ascii=False, indent=2) + "\n", encoding="utf-8"
          )
          print(json.dumps({k: report[k] for k in ("version","candidate_count","local_candidate_count","passed","failed","all_pass","run_error")}, ensure_ascii=False, indent=2))
          if not report["all_pass"]:
              print("FAILED CHECKS:")
              for x in checks:
                  if not x["ok"]:
                      print(x)
          PY
      - name: Persist audit report
        if: always()
        run: |
          git config user.name "skysakhnews-bot"
          git config user.email "actions@github.com"
          git add v10_editorial_audit_report.json
          if git diff --cached --quiet; then
            echo "No audit report changes"
          else
            git commit -m "Record v10 editorial gate live-source audit"
            git pull --rebase --autostash origin main
            git push origin main
          fi
