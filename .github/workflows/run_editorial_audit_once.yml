name: SkySakhNews v10.1 Editorial Gate Audit

on:
  push:
    branches: [main]
    paths: [".github/workflows/run_editorial_audit_once.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: skysakhnews-editorial-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Live-source dry semantic audit
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ secrets.OPENROUTER_MODEL }}
          IMAGE_REQUIRED: "0"
          POSTS_PER_RUN: "2"
          MAX_AGE_HOURS: "36"
          AI_CALL_BUDGET: "2"
          EDITORIAL_AUDIT_AI_BUDGET: "2"
          RUN_COOLDOWN_MINUTES: "0"
          FORCE_RUN: "1"
          PYTHONUNBUFFERED: "1"
        run: |
          set +e
          python -m py_compile src/news_bot_v8.py src/news_bot_v9.py src/production.py src/editorial_gate.py src/category_reconciler.py src/editorial_gate_runner.py > editorial_audit.log 2>&1
          python - <<'PY' >> editorial_audit.log 2>&1
          import copy, json, sys, traceback
          from datetime import datetime, timezone
          from pathlib import Path

          sys.path.insert(0, "src")
          import editorial_gate as gate
          import category_reconciler as rec
          import editorial_gate_runner as runner

          core, prod = runner.core, runner.prod
          report = {
              "generated_at_utc": datetime.now(timezone.utc).isoformat(timespec="seconds"),
              "version": runner.VERSION,
              "mode": "live-sources / dry-Telegram / pre-order-reconcile + semantic-gate",
              "checks": [], "all_pass": False, "run_error": None,
          }
          try:
              original_state = json.loads(Path("state.json").read_text(encoding="utf-8"))
              raw = runner._original_collect(copy.deepcopy(original_state))
              candidate_audit = []
              for c in raw:
                  suggested = rec.suggest_category(c)
                  cc = copy.deepcopy(c)
                  if suggested in core.b.CAT:
                      cc["category_key"] = suggested
                      cc["category"], cc["footer"] = core.b.CAT[suggested]
                      v = gate.deterministic_review(cc, {"title_ru": prod._display_title(cc), "body": [], "editorial_mode": "extractive_fallback"})
                  else:
                      v = {"approved": False, "title_matches_source":100, "category_matches_story":0, "issues":["offtopic"]}
                  candidate_audit.append({
                      "source": c.get("source"), "url": c.get("url"), "title": c.get("title"),
                      "original_category": c.get("category_key"), "suggested_category": suggested,
                      "reclassified": bool(suggested and suggested != c.get("category_key")),
                      "approved_after_reconcile": bool(v.get("approved")),
                      "title_matches_source": v.get("title_matches_source"),
                      "category_matches_story": v.get("category_matches_story"),
                      "issues": v.get("issues"),
                  })

              captured_state, captured_posts = {}, []
              core.b.load_state = lambda: copy.deepcopy(original_state)
              def capture_state(state):
                  captured_state.clear(); captured_state.update(copy.deepcopy(state))
              # Keep runner's save wrapper active so per-post editorial_gate is persisted.
              runner._original_save_state = capture_state
              core.b.save_state = runner.save_state_with_editorial_audit
              def dry_photo(c, cap):
                  captured_posts.append({"method":"photo","url":c.get("url"),"title":c.get("title"),"category_key":c.get("category_key"),"caption":cap})
                  return {"ok":True,"result":{"message_id":1}}
              def dry_text(row, c):
                  captured_posts.append({"method":"text","url":c.get("url"),"title":c.get("title"),"category_key":c.get("category_key"),"row":row})
                  return {"ok":True,"result":{"message_id":1}}
              core.b.send_photo = dry_photo
              core.send_text = dry_text
              core.time.sleep = lambda _x: None

              run_error = None
              try:
                  runner.main()
              except Exception as ex:
                  run_error = repr(ex); traceback.print_exc()

              run = captured_state.get("last_run") or {}
              published = int(run.get("published") or 0)
              final_posts = (captured_state.get("last_posts") or [])[-published:] if published else []
              checks = []
              def ck(name, ok, detail=""):
                  checks.append({"name":name,"ok":bool(ok),"detail":str(detail)[:1600]})
              ck("runtime", run_error is None, run_error)
              ck("version", run.get("version") == "stable-v10.1", run.get("version"))
              ck("raw_candidates", len(raw) > 0, len(raw))
              ck("final_candidates", int(run.get("candidates") or 0) > 0, run.get("candidates"))
              ck("local_candidates", int(run.get("local_candidates") or 0) > 0, run.get("local_candidates"))
              ck("published_2", published == 2, published)
              ck("captured_2", len(captured_posts) == 2, len(captured_posts))
              for i,p in enumerate(final_posts,1):
                  g = p.get("editorial_gate") or {}
                  ck(f"post{i}_approved", g.get("approved") is True, g)
                  ck(f"post{i}_title90", int(g.get("title_matches_source") or 0) >= 90, g)
                  ck(f"post{i}_category90", int(g.get("category_matches_story") or 0) >= 90, g)
                  ck(f"post{i}_facts", g.get("facts_supported") is True, g)
                  ck(f"post{i}_meaning", g.get("meaning_changed") is False, g)

              report.update({
                  "run": run,
                  "raw_candidate_count": len(raw),
                  "reclassified_count": sum(1 for x in candidate_audit if x["reclassified"]),
                  "rejected_or_offtopic_count": sum(1 for x in candidate_audit if not x["approved_after_reconcile"]),
                  "candidate_audit": candidate_audit,
                  "captured_posts": captured_posts,
                  "final_posts": final_posts,
                  "checks": checks,
                  "run_error": run_error,
              })
          except Exception as ex:
              report["run_error"] = repr(ex)
              report["checks"] = [{"name":"harness","ok":False,"detail":repr(ex)}]
              traceback.print_exc()
          report["passed"] = sum(1 for x in report["checks"] if x.get("ok"))
          report["failed"] = sum(1 for x in report["checks"] if not x.get("ok"))
          report["all_pass"] = bool(report["checks"]) and report["failed"] == 0
          Path("v10_editorial_audit_report.json").write_text(json.dumps(report, ensure_ascii=False, indent=2)+"\n", encoding="utf-8")
          print(json.dumps({k:report.get(k) for k in ("version","raw_candidate_count","reclassified_count","rejected_or_offtopic_count","passed","failed","all_pass","run_error")}, ensure_ascii=False, indent=2))
          PY
          tail -n 250 editorial_audit.log
          exit 0
      - name: Persist audit
        if: always()
        run: |
          git config user.name "skysakhnews-bot"
          git config user.email "actions@github.com"
          git add -A v10_editorial_audit_report.json editorial_audit.log
          if git diff --cached --quiet; then
            echo "No audit changes"
          else
            git commit -m "Record v10.1 editorial gate live-source audit"
            git pull --rebase --autostash origin main
            git push origin main
          fi
