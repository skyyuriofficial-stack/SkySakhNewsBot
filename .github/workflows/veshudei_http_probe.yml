name: Veshudei HTTP Probe

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/veshudei_http_probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe production health and webhook endpoint after runtime fix
        run: |
          set +e
          base="https://sky-sakh-news-bot.vercel.app"

          echo "=== HEALTH ==="
          code=$(curl -L -sS -o /tmp/health -w "%{http_code}" --max-time 20 "$base/api/health")
          echo "HTTP=$code"
          cat /tmp/health
          echo

          echo "=== TELEGRAM EMPTY POST ==="
          code=$(curl -L -sS -o /tmp/tg -w "%{http_code}" --max-time 20             -X POST -H "content-type: application/json" -d '{}' "$base/api/telegram")
          echo "HTTP=$code"
          cat /tmp/tg
          echo

          echo "=== TELEGRAM FAKE MESSAGE POST ==="
          code=$(curl -L -sS -o /tmp/tg2 -w "%{http_code}" --max-time 20             -X POST -H "content-type: application/json"             -d '{"update_id":999999992,"message":{"message_id":999999992,"date":1790845000,"chat":{"id":123456789,"type":"private"},"from":{"id":123456789,"is_bot":false,"first_name":"Probe"},"text":"/today"}}'             "$base/api/telegram")
          echo "HTTP=$code"
          cat /tmp/tg2
          echo
          exit 0
