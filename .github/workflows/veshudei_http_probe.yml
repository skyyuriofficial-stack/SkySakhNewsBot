name: Veshudei HTTP Probe

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/veshudei_http_probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Repair and verify Veshudei webhook
        run: |
          set +e
          base="https://sky-sakh-news-bot.vercel.app"

          echo "=== REPAIR ==="
          code=$(curl -L -sS -o /tmp/repair -w "%{http_code}" --max-time 20 "$base/api/health?repair=1")
          echo "HTTP=$code"
          cat /tmp/repair
          echo

          sleep 3

          echo "=== HEALTH AFTER REPAIR ==="
          code=$(curl -L -sS -o /tmp/health -w "%{http_code}" --max-time 20 "$base/api/health")
          echo "HTTP=$code"
          cat /tmp/health
          echo

          echo "=== TELEGRAM EMPTY POST ==="
          code=$(curl -L -sS -o /tmp/tg -w "%{http_code}" --max-time 20             -X POST -H "content-type: application/json" -d '{}' "$base/api/telegram")
          echo "HTTP=$code"
          cat /tmp/tg
          echo
          exit 0
