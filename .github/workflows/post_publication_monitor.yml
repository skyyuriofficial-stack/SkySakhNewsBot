name: SkySakhNews Independent Post-Publication Monitor

on:
  workflow_run:
    workflows: ["SkySakhNews Auto Publisher Stable v12.0"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: skysakhnews-post-publication-monitor
  cancel-in-progress: false

jobs:
  audit:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Re-read and autocorrect the actual latest v12 posts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          POST_AUDIT_AUTOCORRECT: "1"
          PYTHONUNBUFFERED: "1"
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          sys.path.insert(0, "src")
          import publication_auditor

          path = Path("state.json")
          state = json.loads(path.read_text(encoding="utf-8"))
          run = state.get("last_run") or {}
          if run.get("version") != "stable-v12.0":
              print("latest run is not stable-v12.0; monitor has nothing to mutate")
              raise SystemExit(0)

          published = int(run.get("published") or 0)
          posts = (state.get("last_posts") or [])[-published:] if published else []
          report = publication_auditor.audit_posts(
              posts,
              telegram_token=os.environ.get("TELEGRAM_BOT_TOKEN", ""),
              telegram_channel_id=os.environ.get("TELEGRAM_CHANNEL_ID", ""),
              mutate=True,
          )
          run["independent_post_publication_monitor"] = report
          state["last_run"] = run
          path.write_text(json.dumps(state, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(report, ensure_ascii=False, indent=2))
          assert int(report.get("unresolved") or 0) == 0, report
          PY

      - name: Commit independent audit state
        if: always()
        run: |
          git config user.name "skysakhnews-bot"
          git config user.email "actions@github.com"
          git add state.json
          if git diff --cached --quiet; then
            echo "No monitor state changes"
          else
            git commit -m "Record independent v12 post-publication audit"
            git pull --rebase --autostash origin main
            git push origin main
          fi
