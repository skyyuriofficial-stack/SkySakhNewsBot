name: Clean known bad legacy feed posts

on:
  push:
    branches: [main]
    paths: [".github/workflows/cleanup_known_bad_feed.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: skysakhnews-feed-cleanup
  cancel-in-progress: true

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Delete or repair exact known bad publications
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: |
          python - <<'PY'
          import html
          import json
          import os
          import re
          from datetime import datetime, timezone
          from pathlib import Path

          import requests

          token = os.environ["TELEGRAM_BOT_TOKEN"].strip()
          channel = os.environ["TELEGRAM_CHANNEL_ID"].strip()
          state_path = Path("state.json")
          state = json.loads(state_path.read_text(encoding="utf-8"))

          exact_delete_prefixes = (
              "Не санаторий и не дача",
              "В Южно-Сахалинске наградили волонтёров Победы",
              "В этот день, 3 сентября, в 1945 году",
              "Ветерана Вячеслава Гаврилова поздравили",
              "Пять пьяных, 16 без прав",
              "Полиция на Сахалине ищет Александра Ледяева",
          )

          def api(method, **data):
              response = requests.post(
                  f"https://api.telegram.org/bot{token}/{method}",
                  data=data,
                  timeout=30,
              )
              payload = response.json()
              if not payload.get("ok"):
                  raise RuntimeError(f"{method}: {payload}")
              return payload

          def paragraph_sentences(text):
              value = re.sub(r"\s+", " ", str(text or "")).strip()
              value = re.sub(r"Мы будем присылать.*$", "", value, flags=re.I)
              parts = [
                  part.strip()
                  for part in re.split(r"(?<=[.!?])\s+(?=[А-ЯЁ])", value)
                  if len(part.strip()) >= 45
              ]
              unique = []
              for part in parts:
                  if part not in unique:
                      unique.append(part)
              return unique

          actions = []
          deleted_ids = set()
          for post in state.get("last_posts") or []:
              title = str(post.get("title") or "")
              message_id = post.get("telegram_message_id")
              if message_id is None:
                  continue

              if any(title.startswith(prefix) for prefix in exact_delete_prefixes):
                  try:
                      api("deleteMessage", chat_id=channel, message_id=str(message_id))
                      actions.append({"message_id": message_id, "title": title, "action": "deleted"})
                      deleted_ids.add(message_id)
                      post["legacy_cleanup"] = "deleted"
                  except Exception as exc:
                      actions.append({"message_id": message_id, "title": title, "action": "delete_failed", "error": str(exc)[:300]})
                  continue

              if title.startswith("Предъявили обвинение: сахалинца"):
                  fixed_title = "Суд арестовал сахалинца, обвиняемого в убийстве и незаконном лишении свободы женщины"
                  sentences = paragraph_sentences(post.get("source_text_excerpt"))
                  body = sentences[:2]
                  if len(body) < 2:
                      body = [
                          "В Сахалинской области мужчине предъявили обвинение в убийстве и незаконном лишении свободы женщины.",
                          "По данным следствия, пострадавшая получила ножевые ранения и позже скончалась в больнице; обвиняемого заключили под стражу.",
                      ]
                  caption = (
                      "📍 Сахалин\n\n"
                      f"<b>{html.escape(fixed_title)}</b>\n\n"
                      f"{html.escape(body[0])}\n\n"
                      f"{html.escape(body[1])}\n\n"
                      "ЧП | САХАЛИН · <a href=\"" + html.escape(str(post.get("url") or ""), quote=True) + "\">ASTV</a>"
                  )
                  try:
                      api(
                          "editMessageCaption",
                          chat_id=channel,
                          message_id=str(message_id),
                          caption=caption,
                          parse_mode="HTML",
                      )
                      actions.append({"message_id": message_id, "title": title, "action": "edited", "new_title": fixed_title, "new_category_key": "sakh_chp"})
                      post["title"] = fixed_title
                      post["category"] = "📍 Сахалин"
                      post["category_key"] = "sakh_chp"
                      post["topic_cluster"] = "sakh_chp:violent_crime_custody"
                      post["legacy_cleanup"] = "edited"
                  except Exception as exc:
                      actions.append({"message_id": message_id, "title": title, "action": "edit_failed", "error": str(exc)[:300]})

              if title.startswith("Прогноз ВТБ: рынок сбережений") and post.get("category_key") == "sakh":
                  sentences = paragraph_sentences(post.get("source_text_excerpt"))[:2]
                  if len(sentences) >= 2:
                      caption = (
                          "🇷🇺 Россия / экономика\n\n"
                          f"<b>{html.escape(title)}</b>\n\n"
                          f"{html.escape(sentences[0])}\n\n"
                          f"{html.escape(sentences[1])}\n\n"
                          "РОССИЯ | ЭКОНОМИКА · <a href=\"" + html.escape(str(post.get("url") or ""), quote=True) + "\">SakhalinMedia.ru</a>"
                      )
                      try:
                          api("editMessageCaption", chat_id=channel, message_id=str(message_id), caption=caption, parse_mode="HTML")
                          actions.append({"message_id": message_id, "title": title, "action": "edited", "new_category_key": "ru_eco"})
                          post["category"] = "🇷🇺 Россия / экономика"
                          post["category_key"] = "ru_eco"
                          post["legacy_cleanup"] = "edited"
                      except Exception as exc:
                          actions.append({"message_id": message_id, "title": title, "action": "edit_failed", "error": str(exc)[:300]})

          report = {
              "version": "legacy-feed-cleanup-v1",
              "executed_at_utc": datetime.now(timezone.utc).isoformat(timespec="seconds"),
              "actions": actions,
              "deleted_count": sum(1 for item in actions if item["action"] == "deleted"),
              "edited_count": sum(1 for item in actions if item["action"] == "edited"),
              "failed_count": sum(1 for item in actions if item["action"].endswith("failed")),
          }
          state["legacy_feed_cleanup"] = report
          state_path.write_text(json.dumps(state, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          Path("FEED_CLEANUP_REPORT.json").write_text(json.dumps(report, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(report, ensure_ascii=False, indent=2))
          assert report["failed_count"] == 0, report
          PY

      - name: Commit cleanup audit
        if: always()
        run: |
          git config user.name "skysakhnews-bot"
          git config user.email "actions@github.com"
          git add state.json FEED_CLEANUP_REPORT.json
          if git diff --cached --quiet; then
            echo "No cleanup changes"
          else
            git commit -m "Record cleanup of known bad legacy publications"
            git pull --rebase --autostash origin main
            git push origin main
          fi
