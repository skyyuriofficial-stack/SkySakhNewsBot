name: Veshudei Secret Availability Probe

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/veshudei_secret_probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Report credential availability only v2
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          test -n "$OPENROUTER_API_KEY" && echo "OPENROUTER_API_KEY=yes" || echo "OPENROUTER_API_KEY=no"
          test -n "$VERCEL_TOKEN" && echo "VERCEL_TOKEN=yes" || echo "VERCEL_TOKEN=no"
          test -n "$VERCEL_ORG_ID" && echo "VERCEL_ORG_ID=yes" || echo "VERCEL_ORG_ID=no"
          test -n "$VERCEL_PROJECT_ID" && echo "VERCEL_PROJECT_ID=yes" || echo "VERCEL_PROJECT_ID=no"
