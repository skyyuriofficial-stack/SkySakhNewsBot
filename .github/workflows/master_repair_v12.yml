name: SkySakhNews Definitive Stable v12.0 Repair

on:
  push:
    branches: [main]
    paths: [".github/workflows/master_repair_v12.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: skysakhnews-production-publisher
  cancel-in-progress: false

jobs:
  repair-test-live-clean-certify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Synchronize validated v12 source set
        run: |
          set -euo pipefail
          git fetch origin main fix/editorial-director-v12
          git reset --hard origin/main
          for file in \
            src/editorial_policy.py \
            src/category_reconciler.py \
            src/news_director.py \
            src/publication_auditor.py \
            src/publisher.py \
            src/production_selftest.py; do
            git show "origin/fix/editorial-director-v12:${file}" > "${file}"
          done

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile and pass all exact historical regressions
        env:
          IMAGE_REQUIRED: "1"
          AI_CALL_BUDGET: "0"
          EDITORIAL_AUDIT_AI_BUDGET: "0"
          NEWS_DIRECTOR_AI_BUDGET: "0"
          POST_AUDIT_AUTOCORRECT: "0"
          RUN_COOLDOWN_MINUTES: "0"
          MEDIA_PENDING_MAX_HOURS: "36"
          MEDIA_PENDING_MAX_ITEMS: "24"
        run: |
          set -euo pipefail
          grep -q "SkySakhNews Auto Publisher Stable v12.0" .github/workflows/auto_publish_v7.yml
          grep -q 'python src/publisher.py' .github/workflows/auto_publish_v7.yml
          python -m py_compile \
            src/news_bot_v8.py src/news_bot_v9.py src/production.py \
            src/editorial_gate.py src/category_reconciler.py \
            src/editorial_gate_runner.py src/media_enforced_runner.py \
            src/editorial_policy.py src/news_director.py \
            src/publication_auditor.py src/publisher.py \
            src/production_selftest.py
          python src/production_selftest.py

      - name: Audit live sources without Telegram
        env:
          IMAGE_REQUIRED: "1"
          POSTS_PER_RUN: "2"
          MAX_AGE_HOURS: "36"
          AI_CALL_BUDGET: "0"
          EDITORIAL_AUDIT_AI_BUDGET: "0"
          NEWS_DIRECTOR_AI_BUDGET: "0"
          POST_AUDIT_AUTOCORRECT: "0"
          RUN_COOLDOWN_MINUTES: "0"
          FORCE_RUN: "1"
          PYTHONUNBUFFERED: "1"
        run: |
          python - <<'PY'
          import copy
          import json
          import sys
          from datetime import datetime, timezone
          from pathlib import Path
          from urllib.parse import urlparse

          sys.path.insert(0, "src")
          import publisher

          core = publisher.core
          state = core.b.load_state()
          candidates = core.b.collect(copy.deepcopy(state))
          ordered = core.b.ordered(candidates)

          forbidden = (
              "в этот день", "наградили", "поздравили", "торжественная церемония",
              "гороскоп", "рецепт", "головолом", "райское место", "по карману",
              "туристический форум", "чтобы вернуть ему вещи и документы",
              "пять пьяных", "трое пьяных", "16 без прав", "шесть без прав",
          )
          assert publisher.VERSION == "stable-v12.0", publisher.VERSION
          assert len(candidates) >= 2, len(candidates)
          assert len(ordered) >= 2, len(ordered)

          accepted = []
          inspected = []
          for candidate in ordered[:30]:
              title = str(candidate.get("title") or "")
              decision = candidate.get("_news_director") or {}
              item = {
                  "title": title,
                  "source": candidate.get("source"),
                  "category_key": candidate.get("category_key"),
                  "url": candidate.get("url"),
                  "image_url": candidate.get("image_url"),
                  "director": decision,
              }
              inspected.append(item)
              assert decision.get("approved") is True, item
              assert int(decision.get("seriousness") or 0) >= int(decision.get("threshold") or 0), item
              assert not any(marker in title.lower() for marker in forbidden), item
              assert candidate.get("image_url"), item
              assert "news.google." not in urlparse(str(candidate.get("url") or "")).netloc.lower(), item

              row = core.b.valid_post(candidate)
              if not row:
                  continue
              editorial = row.get("editorial_gate") or {}
              assert editorial.get("approved") is True, {"candidate": item, "row": row}
              assert int(editorial.get("title_matches_source") or 0) >= 90, editorial
              assert int(editorial.get("category_matches_story") or 0) >= 90, editorial
              assert editorial.get("facts_supported") is True, editorial
              assert editorial.get("meaning_changed") is False, editorial
              accepted.append({
                  "source_title": title,
                  "final_title": row.get("title_ru"),
                  "source": candidate.get("source"),
                  "category_key": candidate.get("category_key"),
                  "url": candidate.get("url"),
                  "image_url": candidate.get("image_url"),
                  "director": decision,
                  "editorial_gate": editorial,
              })
              if len(accepted) == 2:
                  break

          assert len(accepted) == 2, {"accepted": accepted, "inspected": inspected}
          assert accepted[0]["url"] != accepted[1]["url"], accepted
          assert accepted[0]["image_url"] != accepted[1]["image_url"], accepted

          report = {
              "version": "stable-v12.0",
              "all_pass": True,
              "audited_at_utc": datetime.now(timezone.utc).isoformat(timespec="seconds"),
              "candidate_count": len(candidates),
              "ordered_count": len(ordered),
              "accepted": accepted,
              "inspected": inspected,
          }
          Path("V12_FINAL_DRY_AUDIT.json").write_text(
              json.dumps(report, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(report, ensure_ascii=False, indent=2))
          PY

      - name: Detect a valid existing v12 live release
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          state = json.loads(Path("state.json").read_text(encoding="utf-8"))
          run = state.get("last_run") or {}
          published = int(run.get("published") or 0)
          posts = (state.get("last_posts") or [])[-published:] if published else []
          valid = (
              run.get("version") == "stable-v12.0"
              and run.get("status") == "ok"
              and published == 2
              and len(posts) == 2
          )
          for post in posts:
              valid = valid and (
                  post.get("publisher_version") == "stable-v12.0"
                  and post.get("telegram_message_id") is not None
                  and post.get("with_image") is True
                  and (post.get("editorial_gate") or {}).get("approved") is True
                  and (post.get("news_director") or {}).get("approved") is True
              )
          Path("/tmp/need_live").write_text("0" if valid else "1", encoding="utf-8")
          print({"existing_verified_live_release": bool(valid), "published": published})
          PY

      - name: Publish a real release only when still unverified
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ secrets.OPENROUTER_MODEL }}
          IMAGE_REQUIRED: "1"
          POSTS_PER_RUN: "2"
          MAX_AGE_HOURS: "36"
          AI_CALL_BUDGET: "2"
          EDITORIAL_AUDIT_AI_BUDGET: "0"
          NEWS_DIRECTOR_AI_BUDGET: "0"
          POST_AUDIT_AUTOCORRECT: "1"
          RUN_COOLDOWN_MINUTES: "0"
          FORCE_RUN: "1"
          MEDIA_PENDING_MAX_HOURS: "36"
          MEDIA_PENDING_MAX_ITEMS: "24"
          PYTHONUNBUFFERED: "1"
        run: |
          if [ "$(cat /tmp/need_live)" = "1" ]; then
            python src/publisher.py
          else
            echo "Verified v12 live posts already exist; no duplicate release"
          fi

      - name: Clean or repair the known legacy mistakes idempotently
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: |
          python - <<'PY'
          import html
          import json
          import os
          import re
          from datetime import datetime, timezone
          from pathlib import Path

          import requests

          token = os.environ["TELEGRAM_BOT_TOKEN"].strip()
          channel = os.environ["TELEGRAM_CHANNEL_ID"].strip()
          path = Path("state.json")
          state = json.loads(path.read_text(encoding="utf-8"))

          delete_prefixes = (
              "Не санаторий и не дача",
              "В Южно-Сахалинске наградили волонтёров Победы",
              "В этот день, 3 сентября, в 1945 году",
              "Ветерана Вячеслава Гаврилова поздравили",
              "Пять пьяных, 16 без прав",
              "Трое пьяных, шесть без прав",
              "Полиция на Сахалине ищет Александра Ледяева",
          )

          def call(method, **data):
              response = requests.post(
                  f"https://api.telegram.org/bot{token}/{method}",
                  data=data,
                  timeout=30,
              )
              try:
                  payload = response.json()
              except Exception:
                  payload = {"ok": False, "description": response.text[:300]}
              if payload.get("ok"):
                  return "ok", payload
              description = str(payload.get("description") or payload).lower()
              if any(marker in description for marker in (
                  "message to delete not found",
                  "message to edit not found",
                  "message is not modified",
              )):
                  return "already_absent_or_fixed", payload
              return "failed", payload

          def sentences(value):
              text = re.sub(r"\s+", " ", str(value or "")).strip()
              text = re.sub(r"Мы будем присылать.*$", "", text, flags=re.I)
              result = []
              for part in re.split(r"(?<=[.!?])\s+(?=[А-ЯЁ])", text):
                  part = part.strip()
                  if len(part) >= 45 and part not in result:
                      result.append(part)
              return result

          actions = []
          for post in state.get("last_posts") or []:
              title = str(post.get("title") or "")
              message_id = post.get("telegram_message_id")
              if message_id is None:
                  continue

              if any(title.startswith(prefix) for prefix in delete_prefixes):
                  status, payload = call(
                      "deleteMessage",
                      chat_id=channel,
                      message_id=str(message_id),
                  )
                  actions.append({
                      "message_id": message_id,
                      "title": title,
                      "action": "deleted" if status == "ok" else status,
                      "error": payload if status == "failed" else None,
                  })
                  if status != "failed":
                      post["legacy_cleanup"] = "deleted_or_already_absent"
                  continue

              if title.startswith("Предъявили обвинение: сахалинца"):
                  fixed_title = (
                      "Суд арестовал сахалинца, обвиняемого в убийстве "
                      "и незаконном лишении свободы женщины"
                  )
                  body = sentences(post.get("source_text_excerpt"))[:2]
                  if len(body) < 2:
                      body = [
                          "В Сахалинской области мужчине предъявили обвинение в убийстве и незаконном лишении свободы женщины.",
                          "По данным следствия, пострадавшая получила ножевые ранения и позже скончалась в больнице; обвиняемого заключили под стражу.",
                      ]
                  caption = (
                      "📍 Сахалин\n\n"
                      f"<b>{html.escape(fixed_title)}</b>\n\n"
                      f"{html.escape(body[0])}\n\n"
                      f"{html.escape(body[1])}\n\n"
                      "ЧП | САХАЛИН · <a href=\""
                      + html.escape(str(post.get("url") or ""), quote=True)
                      + "\">ASTV</a>"
                  )
                  status, payload = call(
                      "editMessageCaption",
                      chat_id=channel,
                      message_id=str(message_id),
                      caption=caption,
                      parse_mode="HTML",
                  )
                  actions.append({
                      "message_id": message_id,
                      "title": title,
                      "action": "edited" if status == "ok" else status,
                      "new_title": fixed_title,
                      "new_category_key": "sakh_chp",
                      "error": payload if status == "failed" else None,
                  })
                  if status != "failed":
                      post["title"] = fixed_title
                      post["category"] = "📍 Сахалин"
                      post["category_key"] = "sakh_chp"
                      post["topic_cluster"] = "sakh_chp:violent_crime_custody"
                      post["legacy_cleanup"] = "edited_or_already_fixed"
                  continue

              if title.startswith("Прогноз ВТБ: рынок сбережений") and post.get("category_key") == "sakh":
                  body = sentences(post.get("source_text_excerpt"))[:2]
                  if len(body) >= 2:
                      caption = (
                          "🇷🇺 Россия / экономика\n\n"
                          f"<b>{html.escape(title)}</b>\n\n"
                          f"{html.escape(body[0])}\n\n"
                          f"{html.escape(body[1])}\n\n"
                          "РОССИЯ | ЭКОНОМИКА · <a href=\""
                          + html.escape(str(post.get("url") or ""), quote=True)
                          + "\">SakhalinMedia.ru</a>"
                      )
                      status, payload = call(
                          "editMessageCaption",
                          chat_id=channel,
                          message_id=str(message_id),
                          caption=caption,
                          parse_mode="HTML",
                      )
                      actions.append({
                          "message_id": message_id,
                          "title": title,
                          "action": "edited" if status == "ok" else status,
                          "new_category_key": "ru_eco",
                          "error": payload if status == "failed" else None,
                      })
                      if status != "failed":
                          post["category"] = "🇷🇺 Россия / экономика"
                          post["category_key"] = "ru_eco"
                          post["legacy_cleanup"] = "edited_or_already_fixed"

          failures = [item for item in actions if item["action"] == "failed"]
          report = {
              "version": "legacy-feed-cleanup-v3",
              "executed_at_utc": datetime.now(timezone.utc).isoformat(timespec="seconds"),
              "actions": actions,
              "failed_count": len(failures),
          }
          state["legacy_feed_cleanup_v3"] = report
          path.write_text(json.dumps(state, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          Path("FEED_CLEANUP_REPORT_V3.json").write_text(
              json.dumps(report, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(report, ensure_ascii=False, indent=2))
          assert not failures, failures
          PY

      - name: Certify the actual running system
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          from urllib.parse import urlparse

          state = json.loads(Path("state.json").read_text(encoding="utf-8"))
          run = state.get("last_run") or {}
          assert run.get("version") == "stable-v12.0", run
          assert run.get("status") == "ok", run
          assert int(run.get("published") or 0) == 2, run
          assert (run.get("local_stream") or {}).get("status") in {"healthy", "degraded"}, run

          expected = {
              "local": 6,
              "politics": 4,
              "economy": 4,
              "safety": 3,
              "world": 2,
              "tech": 1,
          }
          director_report = run.get("news_director") or {}
          targets = ((director_report.get("rolling_balance_after") or {}).get("targets") or {})
          assert targets == expected, targets

          posts = (state.get("last_posts") or [])[-2:]
          assert len(posts) == 2, posts
          forbidden = (
              "в этот день", "наградили", "поздравили", "торжественная церемония",
              "гороскоп", "рецепт", "головолом", "райское место", "по карману",
              "туристический форум", "чтобы вернуть ему вещи и документы",
              "пять пьяных", "трое пьяных", "16 без прав", "шесть без прав",
          )
          for post in posts:
              title = str(post.get("title") or "")
              assert not any(marker in title.lower() for marker in forbidden), post
              assert post.get("publisher_version") == "stable-v12.0", post
              assert post.get("telegram_message_id") is not None, post
              assert post.get("with_image") is True, post
              assert post.get("image_url") and post.get("image_hash"), post
              assert str(post.get("publish_method") or "").startswith("sendPhoto/"), post
              assert "news.google." not in urlparse(str(post.get("url") or "")).netloc.lower(), post
              editorial = post.get("editorial_gate") or {}
              assert editorial.get("approved") is True, post
              assert int(editorial.get("title_matches_source") or 0) >= 90, post
              assert int(editorial.get("category_matches_story") or 0) >= 90, post
              assert editorial.get("facts_supported") is True, post
              assert editorial.get("meaning_changed") is False, post
              decision = post.get("news_director") or {}
              assert decision.get("approved") is True, post
              assert int(decision.get("seriousness") or 0) >= int(decision.get("threshold") or 0), post
              assert decision.get("final_title_checked") is True, post
              assert decision.get("final_category_checked") is True, post

          post_audit = run.get("post_publication_audit") or {}
          assert int(post_audit.get("unresolved") or 0) == 0, post_audit
          cleanup = json.loads(Path("FEED_CLEANUP_REPORT_V3.json").read_text(encoding="utf-8"))
          assert int(cleanup.get("failed_count") or 0) == 0, cleanup

          status = {
              "version": "stable-v12.0",
              "system_complete": True,
              "certified_at_utc": datetime.now(timezone.utc).isoformat(timespec="seconds"),
              "source_tests_passed": True,
              "live_source_dry_audit_passed": True,
              "live_telegram_verified": True,
              "post_publication_unresolved": 0,
              "legacy_cleanup_failed": 0,
              "topic_targets_20_posts": expected,
              "latest_verified_posts": [
                  {
                      "message_id": post.get("telegram_message_id"),
                      "title": post.get("title"),
                      "category_key": post.get("category_key"),
                      "source": post.get("source"),
                      "url": post.get("url"),
                  }
                  for post in posts
              ],
          }
          Path("SYSTEM_COMPLETE_V12.json").write_text(
              json.dumps(status, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(status, ensure_ascii=False, indent=2))
          PY

      - name: Commit the reconciled source, state and final certificate
        if: always()
        run: |
          git config user.name "skysakhnews-bot"
          git config user.email "actions@github.com"
          find src -type d -name __pycache__ -prune -exec rm -rf {} + || true
          git add \
            src/editorial_policy.py src/category_reconciler.py \
            src/news_director.py src/publication_auditor.py \
            src/publisher.py src/production_selftest.py \
            state.json V12_FINAL_DRY_AUDIT.json \
            FEED_CLEANUP_REPORT_V3.json
          if [ -f SYSTEM_COMPLETE_V12.json ]; then git add SYSTEM_COMPLETE_V12.json; fi
          if git diff --cached --quiet; then
            echo "No master repair changes"
          else
            git commit -m "Complete and certify strict stable v12.0 system"
            git pull --rebase --autostash origin main
            git push origin HEAD:main
          fi
