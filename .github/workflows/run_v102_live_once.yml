name: SkySakhNews v10.2 One-Shot Live Verification

on:
  push:
    branches: [main]
    paths: [".github/workflows/run_v102_live_once.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: skysakhnews-production-publisher
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile
        run: |
          python -m py_compile \
            src/news_bot_v8.py \
            src/news_bot_v9.py \
            src/production.py \
            src/editorial_gate.py \
            src/category_reconciler.py \
            src/editorial_gate_runner.py

      - name: Publish two verified posts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ secrets.OPENROUTER_MODEL }}
          IMAGE_REQUIRED: "0"
          POSTS_PER_RUN: "2"
          MAX_AGE_HOURS: "36"
          AI_CALL_BUDGET: "8"
          EDITORIAL_AUDIT_AI_BUDGET: "4"
          RUN_COOLDOWN_MINUTES: "0"
          FORCE_RUN: "1"
          PYTHONUNBUFFERED: "1"
        run: |
          python src/editorial_gate_runner.py

      - name: Verify live state
        run: |
          python - <<'PY'
          import json
          from urllib.parse import urlparse

          with open("state.json", "r", encoding="utf-8") as file:
              state = json.load(file)

          run = state.get("last_run") or {}
          assert run.get("version") == "stable-v10.2", run
          assert run.get("status") == "ok", run
          assert int(run.get("published") or 0) == 2, run
          assert (run.get("local_stream") or {}).get("status") in {"healthy", "degraded"}, run

          posts = (state.get("last_posts") or [])[-2:]
          assert len(posts) == 2, posts
          assert posts[0].get("category_key") in {"sakh", "sakh_chp", "sakh_quake"}, posts

          for post in posts:
              audit = post.get("editorial_gate") or {}
              assert audit.get("approved") is True, post
              assert int(audit.get("title_matches_source") or 0) >= 90, post
              assert int(audit.get("category_matches_story") or 0) >= 90, post
              assert audit.get("facts_supported") is True, post
              assert audit.get("meaning_changed") is False, post
              assert "news.google." not in urlparse(post.get("url") or "").netloc.lower(), post

          print("stable-v10.2 live publication verified", posts)
          PY

      - name: Commit verified live state
        if: always()
        run: |
          git config user.name "skysakhnews-bot"
          git config user.email "actions@github.com"
          git add state.json
          if git diff --cached --quiet; then
            echo "No state changes"
          else
            git commit -m "Record stable v10.2 verified live publication"
            git pull --rebase --autostash origin main
            git push origin main
          fi
