name: SkySakhNews Final Quality Proof v10.2 Rerun

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/final_quality_proof_v102_rerun.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: skysakhnews-final-quality-proof
  cancel-in-progress: true

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile
        run: |
          python -m py_compile src/news_bot_v8.py src/news_bot_v9.py src/production.py src/editorial_gate.py src/category_reconciler.py src/editorial_gate_runner.py src/quality_audit.py
      - name: Execute live-source dry proof
        continue-on-error: true
        env:
          IMAGE_REQUIRED: "0"
          POSTS_PER_RUN: "2"
          MAX_AGE_HOURS: "36"
          AI_CALL_BUDGET: "0"
          EDITORIAL_AUDIT_AI_BUDGET: "0"
          RUN_COOLDOWN_MINUTES: "0"
          FORCE_RUN: "1"
          PYTHONUNBUFFERED: "1"
        run: |
          rm -f FINAL_QUALITY_PASS.json FINAL_QUALITY_FAIL.json
          set +e
          python src/quality_audit.py > final_quality_audit.log 2>&1
          rc=$?
          python - <<PY
          import json
          from pathlib import Path
          report_path = Path('final_quality_report.json')
          report = json.loads(report_path.read_text(encoding='utf-8')) if report_path.exists() else {}
          proof = {
              'version': report.get('version'),
              'all_pass': report.get('all_pass') is True and $rc == 0,
              'passed': report.get('passed'),
              'failed': report.get('failed'),
              'candidate_count': report.get('candidate_count'),
              'reconciled_count': report.get('reconciled_count'),
              'offtopic_count': report.get('offtopic_count'),
              'candidate_violations': len(report.get('candidate_violations') or []),
              'run_error': report.get('run_error'),
              'failed_checks': [x for x in report.get('checks', []) if not x.get('ok')],
              'exit_code': $rc,
          }
          name = 'FINAL_QUALITY_PASS.json' if proof['all_pass'] else 'FINAL_QUALITY_FAIL.json'
          Path(name).write_text(json.dumps(proof, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(proof, ensure_ascii=False, indent=2))
          PY
          exit 0
      - name: Commit proof
        if: always()
        run: |
          git config user.name "skysakhnews-bot"
          git config user.email "actions@github.com"
          git add -A final_quality_report.json final_quality_audit.log FINAL_QUALITY_PASS.json FINAL_QUALITY_FAIL.json
          if git diff --cached --quiet; then
            echo "No proof changes"
          else
            git commit -m "Record stable v10.2 final quality proof rerun"
            git pull --rebase --autostash origin main
            git push origin main
          fi
