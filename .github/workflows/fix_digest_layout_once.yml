name: Validate digest layout on real sources
on:
  push:
    branches: [fix/digest-evidence-depth-20261102]
    paths: ['tools/fix_digest_layout.py', '.github/workflows/fix_digest_layout_once.yml']
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      IMAGE_REQUIRED: '1'
      AI_CALL_BUDGET: '0'
      EDITORIAL_AUDIT_AI_BUDGET: '0'
      NEWS_DIRECTOR_AI_BUDGET: '0'
      POST_AUDIT_AUTOCORRECT: '0'
      DIGEST_DRY_RUN: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/digest-evidence-depth-20261102
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python tools/fix_digest_layout.py
      - run: python src/mobilization_depth_selftest.py
      - run: python src/production_selftest.py
      - run: python src/mobilization_live_preview.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-bound-preview
          path: mobilization_depth_preview.json
          if-no-files-found: warn
      - name: Commit tested layout only
        run: |
          git diff --check
          git config user.name skysakhnews-bot
          git config user.email actions@github.com
          git add src/mobilization_depth.py src/mobilization_depth_selftest.py
          if ! git diff --cached --quiet; then
            git commit -m "Preserve complete legal analysis within Telegram layout budget"
            git push origin HEAD:fix/digest-evidence-depth-20261102
          fi
