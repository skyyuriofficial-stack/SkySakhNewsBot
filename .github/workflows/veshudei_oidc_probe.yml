name: Veshudei OIDC Probe
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/veshudei_oidc_probe.yml"
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wait for production deployment
        run: sleep 25
      - name: Probe live health
        run: |
          curl -L -sS --max-time 20 https://sky-sakh-news-bot.vercel.app/api/health
          echo
