name: Apply OpenRouter resilience hotfix v11

on:
  push:
    branches:
      - fix/openrouter-resilience-v11
    paths:
      - "tools/apply_openrouter_resilience_v11.py"
      - ".github/workflows/apply_openrouter_resilience_v11.yml"

permissions:
  contents: write

concurrency:
  group: apply-openrouter-resilience-v11
  cancel-in-progress: true

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Apply source patch
        run: python tools/apply_openrouter_resilience_v11.py

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile canonical production chain
        run: |
          python -m py_compile \
            src/news_bot_v8.py \
            src/news_bot_v9.py \
            src/production.py \
            src/editorial_gate.py \
            src/category_reconciler.py \
            src/editorial_gate_runner.py \
            src/media_enforced_runner.py \
            src/news_director.py \
            src/publisher.py \
            src/production_selftest.py

      - name: Run full regression suite
        env:
          IMAGE_REQUIRED: "1"
          AI_CALL_BUDGET: "4"
          EDITORIAL_AUDIT_AI_BUDGET: "2"
          NEWS_DIRECTOR_AI_BUDGET: "0"
          OPENROUTER_MAX_ATTEMPTS: "3"
          OPENROUTER_RETRY_BASE_SECONDS: "0"
          RUN_COOLDOWN_MINUTES: "20"
          MEDIA_PENDING_MAX_HOURS: "36"
          MEDIA_PENDING_MAX_ITEMS: "24"
        run: python src/production_selftest.py

      - name: Verify clean source patch
        run: |
          git diff --check
          git diff --stat
          git diff -- src/production.py src/editorial_gate_runner.py src/publisher.py src/production_selftest.py

      - name: Commit tested source hotfix
        run: |
          git config user.name "skysakhnews-bot"
          git config user.email "actions@github.com"
          find src -type d -name __pycache__ -prune -exec rm -rf {} +
          git checkout -- .github/workflows/auto_publish_v7.yml .github/workflows/production_ci.yml
          git add src/editorial_gate_runner.py src/production.py src/production_selftest.py src/publisher.py
          git commit -m "Harden OpenRouter and remove it from the Russian-news critical path"
          git push origin HEAD:fix/openrouter-resilience-v11
